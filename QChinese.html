        <h3 style="margin:6px 0;">🖋️ ${QCore.escapeHtml(titleTxt)}</h3>
        <div class="card-subtle" style="margin-bottom:12px;"><strong>${vi ? "Đề bài:" : "Prompt:"}</strong> ${QCore.escapeHtml(promptTxt)}</div>
        <textarea class="textarea-field hanzi-text" id="lwr-txt" rows="4" data-pinyin-ime="true" placeholder="${vi ? "Viết bài bằng Chữ Hán Giản thể..." : "Write in Simplified Chinese (Pinyin IME supported)..."}"></textarea>
        <button class="btn btn-primary" style="margin-top:10px;" id="lwr-sub">👩‍🏫 ${vi ? "Nộp bài & AI Chấm Rubric" : "Submit & AI Evaluate"}</button>
        <div id="lwr-out" style="margin-top:12px;"></div>
      </div>
    `;
    stage.querySelector("#lwr-sub").onclick = async () => {
      const text = (stage.querySelector("#lwr-txt").value || "").trim();
      if (!text) return;
      const out = stage.querySelector("#lwr-out");
      out.innerHTML = `<div class="card-subtle">⏳ ${vi ? "AI đang chấm bài viết theo rubric 7 tiêu chí..." : "AI is evaluating your Chinese writing..."}</div>`;
      const res = await window.QAiTutor.evaluateSentenceSmart({ text, prompt: promptTxt, targetWord: ex.targetWord || "", hskLevel: ex.hskLevel || 1 });
      QCore.recordLessonExercise(ex.id, res.score || 70);
      QCore.updateSkillScore("writing", res.score || 70);
      out.innerHTML = window.QAiTutor.renderSentenceEvaluationCard(res);
    };
  }

  function renderSpeakingEx(stage, lesson, ex) {
    const vi = isViMode();
    if (!ex) { stage.innerHTML = `<div class="card">${vi ? "Chưa có bài nói." : "No speaking exercise yet."}</div>`; return; }
    const promptTxt = (!vi && ex.prompt_en) ? ex.prompt_en : (ex.prompt || "");
    const titleTxt = (vi && ex.title_vi) ? ex.title_vi : (ex.title || "");
    stage.innerHTML = `
      <div class="card">
        ${sourceTagBadge(ex.sourceTag)}
        <h3 style="margin:6px 0;">🎙️ ${QCore.escapeHtml(titleTxt)}</h3>
        <div class="card-subtle" style="margin-bottom:12px;">
          <div>${QCore.escapeHtml(promptTxt)}</div>
          ${ex.sampleQuestion ? `<div class="hanzi-text" style="font-size:20px;font-weight:700;margin-top:8px;">${QCore.escapeHtml(ex.sampleQuestion)} <button class="btn btn-soft btn-sm" id="lspk-hear">🔊</button></div>` : ""}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <button class="btn btn-primary" id="lspk-rec">🎙️ ${vi ? "Ghi âm câu trả lời (5 giây)" : "Record Speaking (5s)"}</button>
        </div>
        <div id="lspk-out"></div>
      </div>
    `;
    const hear = stage.querySelector("#lspk-hear");
    if (hear) hear.onclick = () => QCore.speakChinese(ex.sampleQuestion);
    stage.querySelector("#lspk-rec").onclick = () => {
      const out = stage.querySelector("#lspk-out");
      out.innerHTML = `<div class="card-subtle" style="color:var(--accent-red);">🔴 ${vi ? "Đang thu âm 5 giây..." : "Recording for 5 seconds..."}</div>`;
      QCore.captureLearnerVoice({
        durationMs: 5000,
        onAudioReady: (url, tr) => {
          QCore.recordLessonExercise(ex.id, 85);
          QCore.logDailyActivity("speakingMinutes", 1);
          out.innerHTML = `<div class="card-subtle"><audio controls src="${url}" style="width:100%;height:38px;margin-bottom:6px;"></audio><div>${tr ? `✅ ${vi ? "Nhận diện" : "Recognized"}: "${QCore.escapeHtml(tr)}"` : (vi ? "🎧 Đã lưu băng thu âm — hãy bấm Play đối chiếu phát âm!" : "🎧 Recording saved — press Play to review your pronunciation!")}</div></div>`;
        }
      });
    };
  }

  /* ---------- 3-LEVEL HIERARCHICAL SKILL FOLDER BROWSER (Skill -> Lesson Folder -> Exercise 1, 2, 3...) ---------- */
  const SKILL_META = {
    reading: { icon: "📰", en: "Reading", vi: "Luyện đọc", descEn: "Choose a Lesson folder, then pick one bite-sized reading exercise at a time.", descVi: "Chọn thư mục Lesson tương ứng giáo trình PDF, sau đó chọn từng bài đọc nhỏ (Bài 1, Bài 2, Bài 3...)." },
    listening: { icon: "🎧", en: "Listening", vi: "Luyện nghe", descEn: "Choose a Lesson folder to practice individual audio tracks & listening drills.", descVi: "Chọn thư mục Lesson để luyện từng bài nghe nhỏ (Bài 1, Bài 2...) theo đúng tiến độ mỗi ngày." },
    grammar: { icon: "🧩", en: "Grammar", vi: "Ngữ pháp", descEn: "Choose a Lesson folder to master one grammar point per exercise.", descVi: "Chọn thư mục Lesson để học từng điểm ngữ pháp chia nhỏ (Bài 1, Bài 2, Bài 3...)." },
    writing: { icon: "🖋️", en: "Writing", vi: "Luyện viết", descEn: "Choose a Lesson folder and complete one focused writing task at a time.", descVi: "Chọn thư mục Lesson và luyện từng bài viết ngắn (Bài 1, Bài 2, Bài 3...)." },
    speaking: { icon: "🎙️", en: "Speaking", vi: "Luyện nói", descEn: "Choose a Lesson folder for step-by-step shadowing and speaking drills.", descVi: "Chọn thư mục Lesson để luyện phát âm & phản xạ theo từng bài nhỏ." }
  };

  const folderState = {}; // skill -> { view: "lessons"|"exercises"|"practice", lessonIdx: 0, exIdx: 0, mode: "lessons"|"classic" }

  function getFolderState(skill) {
    if (!folderState[skill]) {
      folderState[skill] = { view: "lessons", lessonIdx: 0, exIdx: 0, mode: "lessons" };
    }
    return folderState[skill];
  }

  async function ensureCourseLoaded(params = {}) {
    let needFetch = !activeCourse;
    if (params && params.hskLevel && Number(params.hskLevel) !== activeHsk) {
      activeHsk = Number(params.hskLevel);
      activeCourseId = params.courseId || null;
      needFetch = true;
    } else if (params && params.courseId && params.courseId !== activeCourseId) {
      activeCourseId = params.courseId;
      needFetch = true;
    }
    if (!needFetch) return true;
    if (!QCore.getServerHealth().ok) return false;
    try {
      const qs = activeCourseId
        ? `courseId=${encodeURIComponent(activeCourseId)}`
        : `hskLevel=${encodeURIComponent(activeHsk)}`;
      const res = await QCore.apiFetch(`/api/pdf/course?${qs}`);
      activeCourse = res.course;
      return Boolean(activeCourse);
    } catch (_) {
      return false;
    }
  }

  async function renderSkillFolder(container, skillKey, params = {}, legacyRenderer = null) {
    const meta = SKILL_META[skillKey] || SKILL_META.reading;
    const fState = getFolderState(skillKey);
    if (params && params.resetFolder) {
      fState.view = "lessons";
      fState.mode = "lessons";
    }
    if (params && (params.materialId || params.classic)) {
      fState.mode = "classic";
    }

    const vi = isViMode();
    if (fState.mode === "classic" && typeof legacyRenderer === "function") {
      container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
          <div class="tabs-bar">
            <button class="tab-pill" id="sf-tab-lessons">📁 ${vi ? "Thư mục Lesson (HSK 3.0)" : "PDF Lesson Folders (HSK 3.0)"}</button>
            <button class="tab-pill active" id="sf-tab-classic">📚 ${vi ? "Luyện tập tổng hợp & Tài liệu cá nhân" : "Classic & Personal Materials"}</button>
          </div>
        </div>
        <div id="sf-legacy-host"></div>
      `;
      container.querySelector("#sf-tab-lessons").onclick = () => {
        fState.mode = "lessons";
        renderSkillFolder(container, skillKey, {}, legacyRenderer);
      };
      legacyRenderer(container.querySelector("#sf-legacy-host"));
      return;
    }

    if (!activeCourse) {
      container.innerHTML = `<div class="card" style="text-align:center;padding:38px;">⏳ ${vi ? "Đang mở thư mục bài học..." : "Loading lesson folders..."}</div>`;
    }
    const loaded = await ensureCourseLoaded(params);
    if (!loaded || !activeCourse) {
      if (typeof legacyRenderer === "function") {
        legacyRenderer(container);
        return;
      }
      container.innerHTML = `<div class="card" style="padding:28px;">⚠️ ${vi ? "Không tải được khóa học PDF." : "Unable to load PDF course."}</div>`;
      return;
    }

    drawSkillFolderView(container, skillKey, legacyRenderer);
  }

  function drawSkillFolderView(container, skillKey, legacyRenderer) {
    const vi = isViMode();
    const meta = SKILL_META[skillKey] || SKILL_META.reading;
    const fState = getFolderState(skillKey);
    const st = QCore.getState();
    const lp = (st && st.lessonProgress) || {};
    const lessons = (activeCourse && activeCourse.lessons) || [];
    if (fState.lessonIdx >= lessons.length) fState.lessonIdx = 0;

    const topSwitcher = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
        <div class="tabs-bar">
          <button class="tab-pill active" id="sf-tab-lessons">📁 ${vi ? "Thư mục Lesson (HSK 3.0)" : "PDF Lesson Folders (HSK 3.0)"}</button>
          ${typeof legacyRenderer === "function" ? `<button class="tab-pill" id="sf-tab-classic">📚 ${vi ? "Luyện tập tổng hợp & Tài liệu cá nhân" : "Classic & Personal Materials"}</button>` : ""}
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <span class="badge badge-jade">${QCore.escapeHtml(activeCourse.code || "HSK 1 (3.0)")}</span>
          <button class="btn btn-outline btn-sm" id="sf-goto-pdf">📄 ${vi ? "Quản lý AI PDF" : "AI PDF Manager"}</button>
        </div>
      </div>
    `;

    // LEVEL 1: Clean Lesson Folder Grid (Lesson 1 .. Lesson 15)
    if (fState.view === "lessons") {
      container.innerHTML = `
        ${topSwitcher}
        <div class="page-header" style="margin-bottom:14px;">
          <div>
            <h2 style="margin:0;">${meta.icon} ${vi ? meta.vi : meta.en} — ${vi ? "Thư mục Lesson" : "Lesson Folders"}</h2>
            <p style="margin:4px 0 0;">${vi ? meta.descVi : meta.descEn}</p>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;">
          ${lessons.map((l, idx) => {
            const exs = Array.isArray(l.skills && l.skills[skillKey]) ? l.skills[skillKey] : [];
            const doneCnt = exs.filter((e) => lp[e.id] && lp[e.id].status === "completed").length;
            const pct = exs.length ? Math.round((doneCnt / exs.length) * 100) : 0;
            return `
              <div class="card" data-open-lfolder="${idx}" style="padding:16px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:10px;border-color:${pct === 100 && exs.length ? "var(--primary)" : "var(--border-color)"};transition:transform .15s ease;">
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;">
                    <span class="badge ${pct === 100 && exs.length ? "badge-jade" : "badge-blue"}">📁 Lesson ${l.lessonNum}</span>
                    <span style="font-size:12px;font-weight:700;color:${doneCnt > 0 ? "var(--primary)" : "var(--text-muted)"};">${doneCnt}/${exs.length} ${vi ? "bài xong" : "done"}</span>
                  </div>
                  <div style="font-weight:700;font-size:15px;line-height:1.45;">${QCore.escapeHtml(l.title.replace(/^Lesson\s*\d+:\s*/i, ""))}</div>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border-color);font-size:12.5px;color:var(--text-secondary);">
                  <span>📄 ${exs.length} ${vi ? "bài tập nhỏ" : "exercises"}</span>
                  <strong style="color:var(--primary);">${vi ? "Mở thư mục →" : "Open →"}</strong>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;

      bindCommonFolderHeader(container, skillKey, legacyRenderer);
      container.querySelectorAll("[data-open-lfolder]").forEach((card) => {
        card.onclick = () => {
          fState.lessonIdx = Number(card.getAttribute("data-open-lfolder"));
          fState.view = "exercises";
          drawSkillFolderView(container, skillKey, legacyRenderer);
        };
      });
      return;
    }

    const lesson = lessons[fState.lessonIdx] || lessons[0];
    const exList = (lesson && lesson.skills && Array.isArray(lesson.skills[skillKey])) ? lesson.skills[skillKey] : [];

    // LEVEL 2: Bite-Sized Exercise List inside selected Lesson (Bài 1, Bài 2, Bài 3...)
    if (fState.view === "exercises") {
      container.innerHTML = `
        ${topSwitcher}
        <div class="card" style="padding:16px;margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
            <div>
              <button class="btn btn-outline btn-sm" id="sf-back-lessons" style="margin-bottom:8px;">← ${vi ? `Quay lại danh sách Lesson ${meta.vi}` : `Back to ${meta.en} Lessons`}</button>
              <h2 style="margin:0;font-size:19px;">📁 ${QCore.escapeHtml(lesson.title)} — ${meta.icon} ${vi ? meta.vi : meta.en}</h2>
              <p style="margin:4px 0 0;font-size:13px;color:var(--text-secondary);">
                ${vi ? `Chọn 1 bài tập nhỏ bên dưới để học tập trung (tổng ${exList.length} bài):` : `Pick one focused exercise below to study at your own pace (${exList.length} exercises):`}
              </p>
            </div>
            <button class="btn btn-primary btn-sm" id="sf-ai-gen-ex">✨ ${vi ? `AI – Tạo thêm Bài ${exList.length + 1}` : `AI – Generate Exercise ${exList.length + 1}`}</button>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;">
          ${exList.map((ex, idx) => {
            const rec = lp[ex.id];
            const exTitle = (vi && ex.title_vi) ? ex.title_vi : (ex.title || `${vi ? "Bài" : "Exercise"} ${idx + 1}`);
            const qCnt = Array.isArray(ex.questions) ? ex.questions.length : 0;
            return `
              <div class="card" data-open-ex="${idx}" style="padding:18px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:12px;border-color:${rec && rec.status === "completed" ? "var(--primary)" : "var(--border-color)"};">
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
                    <span class="badge badge-jade">${vi ? `Bài ${idx + 1}` : `Exercise ${idx + 1}`}</span>
                    ${rec
                      ? `<span class="badge ${rec.status === "completed" ? "badge-jade" : "badge-amber"}">${rec.status === "completed" ? "✅" : "🟡"} ${rec.bestScore}/100</span>`
                      : `<span style="font-size:12px;color:var(--text-muted);">${vi ? "Chưa làm" : "Not started"}</span>`}
                  </div>
                  <div style="font-weight:700;font-size:15.5px;line-height:1.45;margin-bottom:6px;">${QCore.escapeHtml(exTitle)}</div>
                  <div style="font-size:12.5px;color:var(--text-muted);">
                    ${qCnt ? `📝 ${qCnt} ${vi ? "câu hỏi" : "questions"}` : (skillKey === "writing" ? (vi ? "🖋️ Luyện viết & AI chấm điểm" : "🖋️ Writing & AI Rubric") : (vi ? "🎙️ Luyện nói & Thu âm" : "🎙️ Speaking & Audio Check"))}
                  </div>
                </div>
                <div style="display:flex;justify-content:flex-end;">
                  <button class="btn btn-primary btn-sm">${rec ? (vi ? "Làm lại →" : "Practice Again →") : (vi ? "Bắt đầu làm →" : "Start Exercise →")}</button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;

      bindCommonFolderHeader(container, skillKey, legacyRenderer);
      container.querySelector("#sf-back-lessons").onclick = () => {
        fState.view = "lessons";
        drawSkillFolderView(container, skillKey, legacyRenderer);
      };
      container.querySelectorAll("[data-open-ex]").forEach((card) => {
        card.onclick = () => {
          fState.exIdx = Number(card.getAttribute("data-open-ex"));
          fState.view = "practice";
          drawSkillFolderView(container, skillKey, legacyRenderer);
        };
      });
      bindAiGenButton(container, "#sf-ai-gen-ex", lesson, skillKey, () => {
        fState.exIdx = lesson.skills[skillKey].length - 1;
        fState.view = "practice";
        drawSkillFolderView(container, skillKey, legacyRenderer);
      });
      return;
    }

    // LEVEL 3: Distraction-Free Single-Exercise Workspace (ONLY 1 exercise on screen!)
    if (fState.exIdx >= exList.length) fState.exIdx = 0;
    const currentEx = exList[fState.exIdx];
    const hasPrev = fState.exIdx > 0;
    const hasNext = fState.exIdx + 1 < exList.length;

    container.innerHTML = `
      <div class="card" style="padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" id="sf-back-exs">← ${vi ? `Danh sách bài tập (Lesson ${lesson.lessonNum})` : `Lesson ${lesson.lessonNum} Exercises`}</button>
          <span style="font-size:13.5px;font-weight:700;color:var(--text-secondary);">
            ${meta.icon} Lesson ${lesson.lessonNum} · ${vi ? `Bài ${fState.exIdx + 1}/${exList.length}` : `Exercise ${fState.exIdx + 1}/${exList.length}`}
          </span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${hasPrev ? `<button class="btn btn-outline btn-sm" id="sf-prev-ex">← ${vi ? "Bài trước" : "Prev"}</button>` : ""}
          ${hasNext ? `<button class="btn btn-soft btn-sm" id="sf-next-ex">${vi ? "Bài tiếp theo →" : "Next Exercise →"}</button>` : ""}
          <button class="btn btn-primary btn-sm" id="ls-ai-gen-btn">✨ ${vi ? "AI – Tạo bài mới" : "AI – New Exercise"}</button>
        </div>
      </div>
      <div id="sf-practice-stage"></div>
    `;

    container.querySelector("#sf-back-exs").onclick = () => {
      fState.view = "exercises";
      drawSkillFolderView(container, skillKey, legacyRenderer);
    };
    const prevBtn = container.querySelector("#sf-prev-ex");
    if (prevBtn) prevBtn.onclick = () => { fState.exIdx--; drawSkillFolderView(container, skillKey, legacyRenderer); };
    const nextBtn = container.querySelector("#sf-next-ex");
    if (nextBtn) nextBtn.onclick = () => { fState.exIdx++; drawSkillFolderView(container, skillKey, legacyRenderer); };

    bindAiGenButton(container, "#ls-ai-gen-btn", lesson, skillKey, () => {
      fState.exIdx = lesson.skills[skillKey].length - 1;
      drawSkillFolderView(container, skillKey, legacyRenderer);
    });

    const stage = container.querySelector("#sf-practice-stage");
    if (skillKey === "reading") renderReadingSplit(stage, lesson, currentEx, container);
    else if (skillKey === "listening") renderListeningEx(stage, lesson, currentEx, container);
    else if (skillKey === "grammar") renderGrammarEx(stage, lesson, currentEx, container);
    else if (skillKey === "writing") renderWritingEx(stage, lesson, currentEx, container);
    else renderSpeakingEx(stage, lesson, currentEx, container);
  }

  function bindCommonFolderHeader(container, skillKey, legacyRenderer) {
    const fState = getFolderState(skillKey);
    const classicBtn = container.querySelector("#sf-tab-classic");
    if (classicBtn && typeof legacyRenderer === "function") {
      classicBtn.onclick = () => {
        fState.mode = "classic";
        renderSkillFolder(container, skillKey, {}, legacyRenderer);
      };
    }
    const pdfBtn = container.querySelector("#sf-goto-pdf");
    if (pdfBtn) pdfBtn.onclick = () => window.QApp.navigate("ai-pdf");
  }

  function bindAiGenButton(container, selector, lesson, skillKey, onCreated) {
    const btn = container.querySelector(selector);
    if (!btn) return;
    btn.onclick = async () => {
      const vi = isViMode();
      btn.disabled = true;
      btn.textContent = vi ? "⏳ AI đang tạo bài tập mới..." : "⏳ Generating new exercise...";
      try {
        const currList = (lesson.skills && lesson.skills[skillKey]) || [];
        const newEx = await QCore.apiFetch("/api/ai/generate-lesson-exercise", {
          method: "POST",
          body: {
            skill: skillKey,
            hskLevel: (activeCourse && activeCourse.hskLevel) || 1,
            lessonTitle: lesson.title,
            vocabWords: (lesson.skills && lesson.skills.vocabulary) || [],
            wrongFocuses: lastWrongFocuses,
            variantIndex: currList.length + 1
          }
        });
        if (!Array.isArray(lesson.skills[skillKey])) lesson.skills[skillKey] = [];
        lesson.skills[skillKey].push(newEx);
        QCore.showToast(vi ? "✨ AI đã tạo xong bài tập mới!" : "✨ AI generated a new focused exercise!");
        onCreated();
      } catch (err) {
        QCore.showToast("❌ " + err.message);
        btn.disabled = false;
      }
    };
  }

  return {
    renderLessons,
    renderSkillFolder
  };
})();

</script>
  <script data-bundle="js/modules/materials-hub.js">
/* -*- coding: utf-8 -*-
 * QChinese – My Learning Materials (Kho Tài Liệu Cá Nhân) & Public URL / File Importer
 * Integrates directly with Writing, Listening, Speaking, and LWT-Style Interactive Reading!
 */

window.QMaterialsHub = (function () {
  let filterCat = "all";
  let filterFolder = "all";
  let filterHsk = "all";
  let searchQuery = "";
  let addMode = "manual"; // manual | upload | url
  let showAddPanel = false;
  let editingId = null;

  const CATEGORIES = [
    { id: "writing", label: "✍️ Writing – Bài tập viết" },
    { id: "listening", label: "🎧 Listening – Bài tập nghe" },
    { id: "speaking", label: "🎙️ Speaking – Chủ đề nói" },
    { id: "reading", label: "📖 Reading – Bài tập đọc" },
    { id: "vocabulary", label: "📚 Vocabulary – Từ vựng" },
    { id: "grammar", label: "🧩 Grammar – Ngữ pháp" },
    { id: "hsk", label: "🎯 HSK Practice – Đề thi HSK" },
    { id: "other", label: "📌 Other – Tài liệu khác" }
  ];

  const FOLDERS = [
    "Tài liệu trên lớp",
    "Bài tập giảng viên giao",
    "Bài luyện thi HSK",
    "Bài tự học",
    "Tài liệu tham khảo"
  ];

  const STATUS_MAP = {
    not_started: { label: "Chưa học", cls: "badge-blue" },
    in_progress: { label: "Đang học", cls: "badge-amber" },
    completed: { label: "Hoàn thành", cls: "badge-jade" }
  };

  function renderMaterials(container, params = {}) {
    if (params && params.category) filterCat = params.category;
    const st = QCore.getState();
    const allMats = (st && st.materials) || [];

    const filtered = allMats.filter((m) => {
      if (filterCat !== "all" && m.category !== filterCat) return false;
      if (filterFolder !== "all" && m.folder !== filterFolder) return false;
      if (filterHsk !== "all" && Number(m.hskLevel) !== Number(filterHsk)) return false;
      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        const hay = [m.title, m.content, m.source, m.topic, m.notes].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2>📁 My Learning Materials – Kho Tài Liệu Cá Nhân</h2>
          <p>Đưa đề bài giảng viên giao, file nghe MP3/WAV, file DOCX/TXT/PDF, ảnh hoặc URL bài học công khai vào để luyện trực tiếp Writing, Listening, Speaking & Reading với AI.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="mat-toggle-add">${showAddPanel ? "✕ Đóng biểu mẫu" : "➕ Thêm tài liệu mới"}</button>
          <button class="btn btn-soft btn-sm" id="mat-add-demo">✨ Thêm 3 đề mẫu thử ngay</button>
        </div>
      </div>

      ${showAddPanel ? renderAddPanelHTML() : ""}

      <!-- Filter Bar -->
      <div class="card" style="padding:14px 16px;margin-bottom:16px;">
        <div style="display:grid;grid-template-columns:minmax(200px,1.5fr) repeat(3,minmax(145px,1fr));gap:10px;">
          <input class="input-field" id="mat-search" value="${QCore.escapeHtml(searchQuery)}" placeholder="🔍 Tìm tên tài liệu, nội dung, ghi chú..." />
          <select class="select-field" id="mat-f-cat">
            <option value="all">Tất cả loại (${allMats.length})</option>
            ${CATEGORIES.map((c) => `<option value="${c.id}" ${filterCat === c.id ? "selected" : ""}>${c.label}</option>`).join("")}
          </select>
          <select class="select-field" id="mat-f-folder">
            <option value="all">📂 Tất cả thư mục</option>
            ${FOLDERS.map((f) => `<option value="${QCore.escapeHtml(f)}" ${filterFolder === f ? "selected" : ""}>${QCore.escapeHtml(f)}</option>`).join("")}
          </select>
          <select class="select-field" id="mat-f-hsk">
            <option value="all">🎯 Mọi cấp HSK</option>
            ${[1, 2, 3, 4, 5, 6].map((lv) => `<option value="${lv}" ${String(filterHsk) === String(lv) ? "selected" : ""}>HSK ${lv}</option>`).join("")}
          </select>
        </div>
      </div>

      <!-- Materials Grid -->
      ${filtered.length ? `
        <div class="grid-2" style="gap:14px;">
          ${filtered.map((m) => renderMaterialCardHTML(m)).join("")}
        </div>
      ` : `
        <div class="card" style="text-align:center;padding:42px;">
          <div style="font-size:40px;margin-bottom:8px;">📂</div>
          <h3 style="margin:0 0 6px;">Kho tài liệu của bạn chưa có mục nào khớp bộ lọc</h3>
          <p style="color:var(--text-secondary);margin-bottom:16px;">Bấm <strong>"➕ Thêm tài liệu mới"</strong> để tải file/dán đề bài giảng viên giao, hoặc bấm <strong>"✨ Thêm 3 đề mẫu thử ngay"</strong> để trải nghiệm tích hợp 4 kỹ năng!</p>
        </div>
      `}
    `;

    // Bind top actions
    container.querySelector("#mat-toggle-add").onclick = () => {
      showAddPanel = !showAddPanel;
      editingId = null;
      renderMaterials(container);
    };
    container.querySelector("#mat-add-demo").onclick = () => {
      QCore.addMaterial({
        title: "Bài tập viết HSK 2: Giới thiệu gia đình của bạn",
        category: "writing",
        folder: "Bài tập giảng viên giao",
        source: "Đề bài mẫu giảng viên",
        hskLevel: 2,
        topic: "Gia đình",
        content: "请写一篇关于你的家庭的短文（不少于50个字），介绍一下你家有几口人、他们做什么工作以及你们周末常做什么。",
        notes: "Chú ý dùng đúng lượng từ 口, 很 + tính từ và trật tự thời gian."
      });
      QCore.addMaterial({
        title: "Bài đọc hiểu tương tác: Con chó và người đàn ông",
        category: "reading",
        folder: "Tài liệu trên lớp",
        source: "Truyện ngắn HSK 2",
        hskLevel: 2,
        topic: "Đời sống",
        content: "一天，一个男人走在街上。突然，他看见前面有一只黑色的大狗，看起来很凶。男人非常害怕，不敢往前走。狗的旁边站着一个女人，男人问她：你的狗咬人吗？女人说：我的狗不咬人。这时，那只狗咬了男人。他气坏了，大叫：你说你的狗不咬人！女人回答：这不是我的狗。",
        notes: "Bấm vào từng chữ Hán trong trình đọc để tra nghĩa & lưu Sổ tay."
      });
      QCore.addMaterial({
        title: "Chủ đề luyện nói HSK 2: Giới thiệu ngôi trường của bạn",
        category: "speaking",
        folder: "Bài tập giảng viên giao",
        source: "Đề luyện nói trên lớp",
        hskLevel: 2,
        topic: "Trường học",
        content: "请介绍一下你的学校：你的学校在哪里？大不大？你最喜欢学校的什么地方？你在学校学习什么专业？",
        notes: "Luyện phản xạ trả lời 3–5 câu đầy đủ."
      });
      QCore.showToast("✨ Đã thêm 3 tài liệu mẫu (Writing, Reading, Speaking)!");
      renderMaterials(container);
    };

    // Filters
    container.querySelector("#mat-search").oninput = (e) => { searchQuery = e.target.value; renderMaterials(container); };
    container.querySelector("#mat-f-cat").onchange = (e) => { filterCat = e.target.value; renderMaterials(container); };
    container.querySelector("#mat-f-folder").onchange = (e) => { filterFolder = e.target.value; renderMaterials(container); };
    container.querySelector("#mat-f-hsk").onchange = (e) => { filterHsk = e.target.value; renderMaterials(container); };

    if (showAddPanel) bindAddPanelEvents(container);

    // Card actions
    container.querySelectorAll("[data-launch-wr]").forEach((b) => (b.onclick = () => window.QApp.navigate("writing", { materialId: b.getAttribute("data-launch-wr") })));
    container.querySelectorAll("[data-launch-lis]").forEach((b) => (b.onclick = () => window.QApp.navigate("listening", { materialId: b.getAttribute("data-launch-lis") })));
    container.querySelectorAll("[data-launch-spk]").forEach((b) => (b.onclick = () => window.QApp.navigate("speaking", { materialId: b.getAttribute("data-launch-spk") })));
    container.querySelectorAll("[data-launch-rd]").forEach((b) => (b.onclick = () => window.QApp.navigate("reading", { materialId: b.getAttribute("data-launch-rd") })));
    container.querySelectorAll("[data-del-mat]").forEach((b) => {
      b.onclick = () => {
        QCore.deleteMaterial(b.getAttribute("data-del-mat"));
        QCore.showToast("Đã xóa tài liệu khỏi kho cá nhân.");
        renderMaterials(container);
      };
    });
    container.querySelectorAll("[data-status-mat]").forEach((sel) => {
      sel.onchange = () => {
        QCore.updateMaterial(sel.getAttribute("data-status-mat"), { status: sel.value });
        QCore.showToast("Đã cập nhật trạng thái tài liệu.");
        renderMaterials(container);
      };
    });
  }

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;">

  function bindAddPanelEvents(container) {
    container.querySelectorAll("[data-addmode]").forEach((b) => {
      b.onclick = () => {
        addMode = b.getAttribute("data-addmode");
        renderMaterials(container);
      };
    });
    container.querySelector("#mat-cancel").onclick = () => {
      showAddPanel = false;
      renderMaterials(container);
    };

    const urlBtn = container.querySelector("#mat-url-fetch");
    if (urlBtn) {
      urlBtn.onclick = async () => {
        const url = (container.querySelector("#mat-url-inp").value || "").trim();
        const stEl = container.querySelector("#mat-url-status");
        if (!url) { stEl.textContent = "Vui lòng nhập URL hợp lệ (https://...)."; return; }
        if (!QCore.getServerHealth().ok) {
          stEl.innerHTML = `<span style="color:var(--accent-amber);">⚠️ Trích xuất URL trực tiếp cần chạy Python Backend (<code>python server.py</code> hoặc Render). Trên bản tĩnh GitHub Pages, vui lòng sao chép văn bản hợp pháp và dán vào ô Nội dung bên dưới!</span>`;
          return;
        }
        stEl.textContent = "⏳ Đang kiểm tra & trích xuất nội dung công khai...";
        try {
          const res = await QCore.apiFetch("/api/materials/fetch-url", { method: "POST", body: { url } });
          container.querySelector("#mat-title").value = res.title || url;
          container.querySelector("#mat-source").value = new URL(url).hostname;
          container.querySelector("#mat-hidden-source-url").value = res.sourceUrl || url;
          container.querySelector("#mat-content").value = res.content || "";
          if (res.suggestedHsk) container.querySelector("#mat-hsk").value = String(res.suggestedHsk);
          stEl.innerHTML = `<span style="color:var(--primary);font-weight:600;">✅ Trích xuất thành công (${res.hanziCount || 0} chữ Hán)! Hãy kiểm tra bản xem trước bên dưới rồi bấm Lưu.</span>`;
        } catch (err) {
          stEl.innerHTML = `<span style="color:var(--accent-red);">❌ ${QCore.escapeHtml(err.message)}</span>`;
        }
      };
    }

    const fileInp = container.querySelector("#mat-file-inp");
    if (fileInp) {
      fileInp.onchange = async (e) => {
        const file = e.target.files && e.target.files[0];
        const stEl = container.querySelector("#mat-file-status");
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) {
          stEl.innerHTML = `<span style="color:var(--accent-red);">❌ File vượt quá giới hạn an toàn 8 MB.</span>`;
          return;
        }
        container.querySelector("#mat-hidden-file-name").value = file.name;
        container.querySelector("#mat-hidden-media-type").value = file.type || "";
        if (!container.querySelector("#mat-title").value) {
          container.querySelector("#mat-title").value = file.name.replace(/\.[^.]+$/, "");
        }

        const ext = file.name.split(".").pop().toLowerCase();
        if (file.type.startsWith("audio/") || file.type.startsWith("video/")) {
          const objUrl = URL.createObjectURL(file);
          container.querySelector("#mat-media-url").value = objUrl;
          container.querySelector("#mat-cat").value = "listening";
          stEl.innerHTML = `<span style="color:var(--primary);font-weight:600;">✅ Đã nạp file nghe/video "${QCore.escapeHtml(file.name)}" (${(file.size / 1024).toFixed(0)} KB). Bạn có thể nhập thêm transcript (nếu có) rồi bấm Lưu!</span>`;
          return;
        }
        if (file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = () => {
            container.querySelector("#mat-media-url").value = reader.result;
            stEl.innerHTML = `<span style="color:var(--primary);">✅ Đã tải ảnh "${QCore.escapeHtml(file.name)}". Hãy gõ/dán văn bản đề bài trong ảnh vào ô Nội dung để AI chấm trực tiếp!</span>`;
          };
          reader.readAsDataURL(file);
          return;
        }
        if (ext === "txt" || ext === "md") {
          const text = await file.text();
          container.querySelector("#mat-content").value = text.slice(0, 20000);
          stEl.innerHTML = `<span style="color:var(--primary);font-weight:600;">✅ Đã đọc xong file văn bản (${text.length} ký tự)!</span>`;
          return;
        }
        if (ext === "docx" || ext === "pdf") {
          if (!QCore.getServerHealth().ok) {
            stEl.innerHTML = `<span style="color:var(--accent-amber);">⚠️ Đọc trực tiếp file .${ext} cần Python Backend. Bạn hãy copy nội dung từ file dán vào ô bên dưới rồi lưu nhé!</span>`;
            return;
          }
          stEl.textContent = `⏳ Đang trích xuất văn bản từ ${file.name}...`;
          const reader = new FileReader();
          reader.onload = async () => {
            try {
              const b64 = String(reader.result || "").split(",")[1] || "";
              const res = await QCore.apiFetch("/api/materials/extract-file", { method: "POST", body: { filename: file.name, dataBase64: b64 } });
              container.querySelector("#mat-content").value = res.content || "";
              stEl.innerHTML = `<span style="color:var(--primary);font-weight:600;">✅ Đã trích xuất văn bản từ ${QCore.escapeHtml(file.name)} (${res.hanziCount || 0} chữ Hán)!</span>`;
            } catch (err) {
              stEl.innerHTML = `<span style="color:var(--accent-red);">❌ ${QCore.escapeHtml(err.message)}</span>`;
            }
          };
          reader.readAsDataURL(file);
        }
      };
    }

    container.querySelector("#mat-save-btn").onclick = () => {
      const title = (container.querySelector("#mat-title").value || "").trim();
      const content = (container.querySelector("#mat-content").value || "").trim();
      const mediaUrl = (container.querySelector("#mat-media-url").value || "").trim();
      if (!title) { QCore.showToast("Vui lòng nhập tên tài liệu!"); return; }
      if (!content && !mediaUrl) { QCore.showToast("Vui lòng nhập nội dung đề bài hoặc tải file audio/tài liệu!"); return; }
      QCore.addMaterial({
        title,
        source: container.querySelector("#mat-source").value.trim() || "Người học tải lên",
        sourceUrl: container.querySelector("#mat-hidden-source-url").value || "",
        category: container.querySelector("#mat-cat").value,
        folder: container.querySelector("#mat-folder").value,
        hskLevel: Number(container.querySelector("#mat-hsk").value || 1),
        content,
        transcript: container.querySelector("#mat-cat").value === "listening" ? content : "",
        mediaUrl,
        mediaType: container.querySelector("#mat-hidden-media-type").value || "",
        fileName: container.querySelector("#mat-hidden-file-name").value || "",
        notes: container.querySelector("#mat-notes").value.trim()
      });
      showAddPanel = false;
      QCore.showToast(`✅ Đã lưu "${title}" vào Kho tài liệu cá nhân!`);
      renderMaterials(container);
    };
  }

  return {
    renderMaterials
  };
})();

</script>
  <script data-bundle="js/modules/grammar-reading-writing.js">
/* -*- coding: utf-8 -*-
 * QChinese – Modules 6, 8, 9, 10:
 * - Grammar Studio (6.2)
 * - AI Speaking Tutor (6.4)
 * - Split-Screen Reading Studio (6.5)

 */

window.QGrammarReadingWriting = (function () {
  /* ==================== 6.2. GRAMMAR STUDIO ==================== */
  let activeGrammarId = "g_shi";
  let grammarReorderDraft = [];

  function renderGrammar(container) {
    const list = window.QCHINESE_GRAMMAR || [];

        </div>
        <button class="btn btn-outline btn-sm" id="gr-save-nb">📒 Lưu cấu trúc này vào Sổ tay</button>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
        ${list

          <button class="btn ${g.id === lesson.id ? "btn-primary" : st.grammarCompleted.includes(g.id) ? "btn-soft" : "btn-outline"} btn-sm" data-grid="${g.id}">
            ${st.grammarCompleted.includes(g.id) ? "✓ " : ""}HSK ${g.hsk_level}: ${QCore.escapeHtml(g.title.split("–")[0])}
          </button>
        `
          )
          .join("")}
      </div>

      <div class="grid-2">
        <!-- Theory & Examples -->
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span class="badge badge-jade">HSK ${lesson.hsk_level}</span>
            ${isDone ? `<span class="badge badge-jade">✓ Đã hoàn thành</span>` : ""}
          </div>
          <h3 style="margin:0 0 10px;font-size:20px;">${QCore.escapeHtml(lesson.title)}</h3>
          <div class="card-subtle" style="border-left:4px solid var(--primary);font-weight:700;font-size:15.5px;margin-bottom:14px;">
            📐 Công thức: ${QCore.escapeHtml(lesson.formula)}
          </div>

          <div style="margin-bottom:12px;">
            <strong>🇻🇳 Giải thích tiếng Việt:</strong>
            <p style="margin:4px 0 0;font-size:14px;">${QCore.escapeHtml(lesson.explainVi)}</p>
          </div>
          <div style="margin-bottom:14px;">
            <strong>🇬🇧 English Explanation:</strong>
            <p style="margin:4px 0 0;font-size:13.5px;color:var(--text-secondary);">${QCore.escapeHtml(lesson.explainEn)}</p>
          </div>

          <div class="vi-hint-banner" style="margin-bottom:16px;">
            <span>⚠️</span>
            <div><strong>Lỗi thường gặp cần tránh:</strong> ${QCore.escapeHtml(lesson.commonMistakes)}</div>
          </div>

          <h4 style="margin:0 0 8px;">💬 Ví dụ minh họa ba ngôn ngữ</h4>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${lesson.examples
              .map(
                (ex) => `
              <div class="card-subtle" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
                <div>
                  <div class="hanzi-text" style="font-size:18px;font-weight:700;">${QCore.escapeHtml(ex.chinese)}</div>
                  <div class="pinyin-text" style="font-size:13.5px;color:var(--primary);font-weight:600;">${QCore.escapeHtml(ex.pinyin)}</div>
                  <div style="font-size:13px;color:var(--text-secondary);">🇬🇧 ${QCore.escapeHtml(ex.english)} · 🇻🇳 <strong>${QCore.escapeHtml(ex.vietnamese)}</strong></div>
                </div>
                <button class="btn btn-soft btn-sm" data-speak="${QCore.escapeHtml(ex.chinese)}">🔊</button>
              </div>
            `
              )
              .join("")}
          </div>
        </div>

        <!-- 4 Interactive Grammar Exercises -->
        <div class="card">
          <h3 style="margin:0 0 14px;">✍️ Thực hành 4 dạng bài tập</h3>

          <!-- Ex 1: Fill blank -->
          <div class="card-subtle" style="margin-bottom:12px;">
            <strong>1. Điền từ còn thiếu:</strong>
            <div class="hanzi-text" style="font-size:18px;margin:6px 0;">${QCore.escapeHtml(lesson.exercises.fillBlank.sentence)}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${lesson.exercises.fillBlank.options
                .map((o) => `<button class="btn btn-outline btn-sm hanzi-text" data-gr-fb="${QCore.escapeHtml(o)}">${QCore.escapeHtml(o)}</button>`)
                .join("")}
            </div>
            <div id="gr-fb-msg" style="margin-top:6px;font-size:13px;"></div>
          </div>

          <!-- Ex 2: Reorder -->
          <div class="card-subtle" style="margin-bottom:12px;">
            <strong>2. Sắp xếp các từ thành câu đúng:</strong>
            <div class="hanzi-text" style="min-height:34px;font-size:18px;font-weight:700;color:var(--primary);margin:6px 0;">
              ${QCore.escapeHtml(grammarReorderDraft.join("")) || "Bấm chọn từng từ bên dưới..."}
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${lesson.exercises.reorder.words
                .map((w) => `<button class="btn btn-outline btn-sm hanzi-text" data-gr-word="${QCore.escapeHtml(w)}">${QCore.escapeHtml(w)}</button>`)
                .join("")}
              <button class="btn btn-danger btn-sm" id="gr-ord-clear">Xóa</button>
              <button class="btn btn-primary btn-sm" id="gr-ord-check">Kiểm tra</button>
            </div>
            <div id="gr-ord-msg" style="margin-top:6px;font-size:13px;"></div>
          </div>

          <!-- Ex 3: Choose right structure -->
          <div class="card-subtle" style="margin-bottom:12px;">
            <strong>3. ${QCore.escapeHtml(lesson.exercises.multipleChoice.question)}</strong>
            <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">
              ${lesson.exercises.multipleChoice.options
                .map((o) => `<button class="btn btn-outline btn-sm hanzi-text" style="justify-content:flex-start;" data-gr-mcq="${QCore.escapeHtml(o)}">${QCore.escapeHtml(o)}</button>`)
                .join("")}
            </div>
            <div id="gr-mcq-msg" style="margin-top:6px;font-size:13px;"></div>
          </div>

          <!-- Ex 4: Free sentence writing with AI feedback -->
          <div class="card-subtle">
            <strong>4. Tự viết câu & nhận giải thích từ AI Giáo viên:</strong>
            <p style="margin:4px 0 8px;font-size:13px;color:var(--text-secondary);">${QCore.escapeHtml(lesson.exercises.freeWritePrompt)}</p>
            <textarea class="textarea-field hanzi-text" id="gr-free-inp" rows="2" data-pinyin-ime="true" placeholder="Gõ Pinyin để chọn chữ Hán Giản thể..."></textarea>
            <div style="margin-top:8px;">
              <button class="btn btn-primary btn-sm" id="gr-free-btn">👩‍🏫 Chấm câu & Hoàn thành bài ngữ pháp</button>
            </div>
            <div id="gr-free-msg" style="margin-top:8px;font-size:13px;"></div>
          </div>
        </div>
      </div>
    `;

    container.querySelectorAll("[data-grid]").forEach((b) => {
      b.onclick = () => {
        activeGrammarId = b.getAttribute("data-grid");
        grammarReorderDraft = [];
        renderGrammar(container);
      };
    });

    container.querySelectorAll("[data-speak]").forEach((b) => {
      b.onclick = () => QCore.speakChinese(b.getAttribute("data-speak"));
    });

    container.querySelector("#gr-save-nb").onclick = () => {
      QCore.addToNotebook({
        category: "grammar",
        hanzi: lesson.title,
        pinyin: lesson.formula,
        english: lesson.explainEn,
        vietnamese: lesson.explainVi,
        example: lesson.examples[0] ? `${lesson.examples[0].chinese} (${lesson.examples[0].vietnamese})` : "",
        note: lesson.commonMistakes
      });
    };

    container.querySelectorAll("[data-gr-fb]").forEach((b) => {
      b.onclick = () => {
        const ok = b.getAttribute("data-gr-fb") === lesson.exercises.fillBlank.answer;
        QCore.updateSkillScore("grammar", ok ? 92 : 60);
        container.querySelector("#gr-fb-msg").innerHTML = ok
          ? `<span style="color:var(--primary);font-weight:700;">✅ Đúng rồi! ${QCore.escapeHtml(lesson.exercises.fillBlank.explain)}</span>`
          : `<span style="color:var(--accent-red);">❌ Chưa đúng. ${QCore.escapeHtml(lesson.exercises.fillBlank.explain)}</span>`;
      };
    });

    container.querySelectorAll("[data-gr-word]").forEach((b) => {
      b.onclick = () => {
        grammarReorderDraft.push(b.getAttribute("data-gr-word"));
        renderGrammar(container);
      };
    });
    container.querySelector("#gr-ord-clear").onclick = () => {
      grammarReorderDraft = [];
      renderGrammar(container);
    };
    container.querySelector("#gr-ord-check").onclick = () => {
      const s = grammarReorderDraft.join("");
      const ex = lesson.exercises.reorder;
      const ok = s === ex.answer || (ex.altAnswers && ex.altAnswers.includes(s));
      QCore.updateSkillScore("grammar", ok ? 95 : 60);
      container.querySelector("#gr-ord-msg").innerHTML = ok
        ? `<span style="color:var(--primary);font-weight:700;">✅ Chính xác! ${QCore.escapeHtml(ex.answer)} (${QCore.escapeHtml(ex.pinyin)})</span>`
        : `<span style="color:var(--accent-red);">Đáp án chuẩn: <strong>${QCore.escapeHtml(ex.answer)}</strong> — ${QCore.escapeHtml(ex.explain)}</span>`;
    };

    container.querySelectorAll("[data-gr-mcq]").forEach((b) => {
      b.onclick = () => {
        const ok = b.getAttribute("data-gr-mcq") === lesson.exercises.multipleChoice.answer;
        QCore.updateSkillScore("grammar", ok ? 95 : 58);
        container.querySelector("#gr-mcq-msg").innerHTML = ok
          ? `<span style="color:var(--primary);font-weight:700;">✅ Hoàn toàn chính xác! ${QCore.escapeHtml(lesson.exercises.multipleChoice.explain)}</span>`
          : `<span style="color:var(--accent-red);">❌ Chưa đúng. ${QCore.escapeHtml(lesson.exercises.multipleChoice.explain)}</span>`;
      };
    });

    container.querySelector("#gr-free-btn").onclick = async () => {
      const val = container.querySelector("#gr-free-inp").value.trim();
      const msgEl = container.querySelector("#gr-free-msg");
      if (!val) {
        QCore.showToast("Hãy viết câu của bạn trước nhé!");
        return;
      }
      msgEl.textContent = "⏳ Giáo viên AI đang kiểm tra ngữ pháp...";
      try {
        const res = await QCore.apiFetch("/api/ai/writing", {
          method: "POST",
          body: {
            text: val,
            prompt: lesson.exercises.freeWritePrompt,
            expected: lesson.examples[0].chinese,
            expectedPinyin: lesson.examples[0].pinyin,
            expectedEn: lesson.examples[0].english,
            expectedVi: lesson.examples[0].vietnamese,
            hskLevel: lesson.hsk_level
          }
        });
        if (!st.grammarCompleted.includes(lesson.id)) {
          st.grammarCompleted.push(lesson.id);
          QCore.logDailyActivity("grammarCount", 1);
        }
        QCore.updateSkillScore("grammar", res.score);
        QCore.saveState(true);
        msgEl.innerHTML = `
          <div style="padding:10px;border-radius:10px;background:var(--bg-surface);border:1px solid var(--primary);">
            <strong>Điểm ngữ pháp: ${res.score}/100</strong> · Câu chuẩn: <strong class="hanzi-text" style="color:var(--primary);">${QCore.escapeHtml(res.corrected)}</strong>
            <div style="margin-top:4px;">${QCore.escapeHtml(res.whyWrong)}</div>
          </div>
        `;
      } catch (e) {
        msgEl.textContent = e.message;
      }
    };
  }

  /* ==================== 6.4. SPEAKING – AI CONVERSATION TUTOR ==================== */
  let spkMode = "basic"; // "basic" | "free"
  let spkTopic = "greeting";
  let spkShowPinyin = true;
  let spkShowTrans = true;
  let chatHistory = [];
  let latestSuggestions = [];

  const BASIC_TOPICS = [
    { id: "greeting", label: "👋 Chào hỏi" },
    { id: "intro", label: "🙋 Giới thiệu bản thân" },
    { id: "name", label: "🪪 Hỏi tên" },
    { id: "age", label: "🎂 Hỏi tuổi" },
    { id: "family", label: "🏠 Gia đình" },
    { id: "school", label: "📚 Trường học" },
    { id: "food", label: "🍜 Gọi món" },
    { id: "direction", label: "🗺️ Hỏi đường" }
  ];

  async function startNewConversation(container) {
    const st = QCore.getState();
    chatHistory = [];
    try {
      const res = await QCore.apiFetch("/api/ai/speaking", {
        method: "POST",
        body: { mode: spkMode, topic: spkTopic, hskLevel: st.profile.hskLevel, message: "" }
      });
      chatHistory.push({
        role: "ai",
        chinese: res.reply,
        pinyin: res.pinyin,
        english: res.english,
        vietnamese: res.vietnamese
      });
      latestSuggestions = res.suggestions || [];
      QCore.speakChinese(res.reply);
      renderSpeaking(container, true);
    } catch (e) {
      QCore.showToast(e.message);
    }
  }

  let activeSpkMatId = null;

  function renderSpeaking(container, skipAutoInit = false, params = {}) {
    const st = QCore.getState();
    if (params && params.materialId) {
      activeSpkMatId = params.materialId;
    } else if (params && params.materialId === null) {
      activeSpkMatId = null;
    }
    const customMat = activeSpkMatId ? (st.materials || []).find((m) => m.id === activeSpkMatId) : null;
    if (customMat) {
      renderMaterialSpeakingStudio(container, customMat);
      return;
    }
    if (!chatHistory.length && !skipAutoInit) {
      container.innerHTML = `<div class="card">⏳ Đang kết nối với AI Giáo viên tiếng Trung...</div>`;
      startNewConversation(container);
      return;
    }

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2>🎙️ Luyện Nói Tiếng Trung Với AI Giáo Viên (HSK ${st.profile.hskLevel})</h2>
          <p>Trò chuyện ở tốc độ phù hợp người mới, có Pinyin, dịch Anh–Việt, sửa lỗi ngữ pháp/dùng từ và gợi ý câu trả lời.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn ${spkShowPinyin ? "btn-primary" : "btn-outline"} btn-sm" id="spk-tog-py">ā Hiện Pinyin</button>
          <button class="btn ${spkShowTrans ? "btn-primary" : "btn-outline"} btn-sm" id="spk-tog-tr">🌐 Hiện Dịch Việt–Anh</button>
          <button class="btn btn-outline btn-sm" id="spk-restart">🔄 Bắt đầu hội thoại mới</button>
        </div>
      </div>

      <!-- Mode & Topic Selector -->
      <div class="card" style="padding:16px;margin-bottom:18px;">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:${spkMode === "basic" ? "12px" : "0"};">
          <div class="tabs-bar">
            <button class="tab-pill ${spkMode === "basic" ? "active" : ""}" data-spkmode="basic">Chế độ 1: Giao tiếp cơ bản (8 tình huống)</button>
            <button class="tab-pill ${spkMode === "free" ? "active" : ""}" data-spkmode="free">Chế độ 2: Hội thoại tự do theo HSK ${st.profile.hskLevel}</button>
          </div>
        </div>
        ${
          spkMode === "basic"
            ? `
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${BASIC_TOPICS.map(
              (t) => `<button class="btn ${spkTopic === t.id ? "btn-primary" : "btn-outline"} btn-sm" data-spktopic="${t.id}">${t.label}</button>`
            ).join("")}
          </div>
        `
            : ""
        }
      </div>

      <div class="card">
        <div class="chat-stream" id="spk-chat-stream">
          ${chatHistory
            .map(
              (m, idx) => `
            <div class="chat-bubble ${m.role}">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;">
                <strong style="font-size:12.5px;color:var(--text-muted);">${m.role === "ai" ? "👩‍🏫 AI Giáo viên" : "🙋 Bạn"}</strong>
                <div style="display:flex;gap:4px;">
                  <button class="btn btn-outline btn-sm" style="padding:2px 8px;font-size:11.5px;" data-chat-speak="${QCore.escapeHtml(m.chinese)}">🔊 Nghe</button>
                  <button class="btn btn-outline btn-sm" style="padding:2px 8px;font-size:11.5px;" data-chat-slow="${QCore.escapeHtml(m.chinese)}">🐢 Chậm</button>
                </div>
              </div>
              ${spkShowPinyin && m.pinyin ? `<div class="pinyin-text" style="font-size:13px;color:var(--primary);font-weight:600;">${QCore.escapeHtml(m.pinyin)}</div>` : ""}
              <div class="hanzi-text" style="font-size:19px;font-weight:600;">${QCore.escapeHtml(m.chinese)}</div>
              ${
                spkShowTrans && (m.vietnamese || m.english)
                  ? `<div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">🇻🇳 ${QCore.escapeHtml(m.vietnamese || "")} ${m.english ? `<br>🇬🇧 ${QCore.escapeHtml(m.english)}` : ""}</div>`
                  : ""
              }
              ${
                m.feedback
                  ? `
                <div class="card-subtle" style="margin-top:8px;padding:8px 10px;font-size:12.5px;border-left:3px solid ${m.feedback.isCorrect ? "var(--primary)" : "var(--accent-amber)"};">
                  ${m.feedback.isCorrect ? "✅" : "🛠️ <strong>Sửa lỗi:</strong>"}
                  ${!m.feedback.isCorrect && m.feedback.correctedSentence ? `<span class="hanzi-text" style="font-weight:700;color:var(--primary);"> ${QCore.escapeHtml(m.feedback.correctedSentence)}</span> — ` : ""}
                  ${QCore.escapeHtml(m.feedback.explanationVi || "")}
                </div>
              `
                  : ""
              }
            </div>
          `
            )
            .join("")}
        </div>

        <!-- Suggested Replies for Beginners -->
        ${
          latestSuggestions.length
            ? `
          <div style="margin-top:12px;">
            <small style="color:var(--text-muted);display:block;margin-bottom:6px;">💡 Gợi ý câu trả lời (bấm để điền hoặc nghe thử trước khi tự nói):</small>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${latestSuggestions
                .map(
                  (s) => `
                <button class="btn btn-soft btn-sm" style="text-align:left;" data-sug-hz="${QCore.escapeHtml(s.chinese)}">
                  <span class="hanzi-text" style="font-size:15px;font-weight:700;">${QCore.escapeHtml(s.chinese)}</span>
                  <span style="font-size:12px;">(${QCore.escapeHtml(s.pinyin)} · ${QCore.escapeHtml(s.vietnamese)})</span>
                </button>
              `
                )
                .join("")}
            </div>
          </div>
        `
            : ""
        }

        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
          <button class="btn btn-soft" id="spk-mic-btn">🎙️ Nói bằng Micro</button>
          <input class="input-field hanzi-text" id="spk-input" data-pinyin-ime="true" style="flex:1;min-width:220px;" placeholder="Hoặc gõ Pinyin (vd: wo shi yuenan ren) để chọn chữ Hán trả lời...">
          <button class="btn btn-primary" id="spk-send-btn">Gửi câu nói →</button>
        </div>
      </div>
    `;

    const streamEl = container.querySelector("#spk-chat-stream");
    if (streamEl) streamEl.scrollTop = streamEl.scrollHeight;

    container.querySelector("#spk-tog-py").onclick = () => { spkShowPinyin = !spkShowPinyin; renderSpeaking(container, true); };
    container.querySelector("#spk-tog-tr").onclick = () => { spkShowTrans = !spkShowTrans; renderSpeaking(container, true); };
    container.querySelector("#spk-restart").onclick = () => startNewConversation(container);

    container.querySelectorAll("[data-spkmode]").forEach((b) => {
      b.onclick = () => {
        spkMode = b.getAttribute("data-spkmode");
        startNewConversation(container);
      };
    });
    container.querySelectorAll("[data-spktopic]").forEach((b) => {
      b.onclick = () => {
        spkTopic = b.getAttribute("data-spktopic");
        startNewConversation(container);
      };
    });

    container.querySelectorAll("[data-chat-speak]").forEach((b) => {
      b.onclick = () => QCore.speakChinese(b.getAttribute("data-chat-speak"));
    });
    container.querySelectorAll("[data-chat-slow]").forEach((b) => {
      b.onclick = () => QCore.speakChinese(b.getAttribute("data-chat-slow"), { slow: true });
    });

    const inp = container.querySelector("#spk-input");
    container.querySelectorAll("[data-sug-hz]").forEach((b) => {
      b.onclick = () => {
        inp.value = b.getAttribute("data-sug-hz");
        QCore.speakChinese(inp.value);
        inp.focus();
      };
    });

    const sendUserTurn = async () => {
      const msg = inp.value.trim();
      if (!msg) return;
      inp.value = "";
      chatHistory.push({ role: "user", chinese: msg });
      renderSpeaking(container, true);

      try {
        const res = await QCore.apiFetch("/api/ai/speaking", {
          method: "POST",
          body: {
            mode: spkMode,
            topic: spkTopic,
            hskLevel: st.profile.hskLevel,
            message: msg,
            history: chatHistory.map((h) => ({ role: h.role, text: h.chinese }))
          }
        });
        // Attach grammar/word feedback to user's message bubble
        chatHistory[chatHistory.length - 1].feedback = res.feedback;
        chatHistory.push({
          role: "ai",
          chinese: res.reply,
          pinyin: res.pinyin,
          english: res.english,
          vietnamese: res.vietnamese
        });
        latestSuggestions = res.suggestions || [];
        st.speakingSessions = (st.speakingSessions || 0) + 1;
        QCore.logDailyActivity("speakingMinutes", 1);
        QCore.updateSkillScore("speaking", res.feedback && res.feedback.isCorrect ? 90 : 72);
        QCore.speakChinese(res.reply);
        renderSpeaking(container, true);
      } catch (e) {
        QCore.showToast(e.message);
      }
    };

    container.querySelector("#spk-send-btn").onclick = sendUserTurn;
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendUserTurn();
    });

    container.querySelector("#spk-mic-btn").onclick = () => {
      const micBtn = container.querySelector("#spk-mic-btn");
      micBtn.textContent = "🔴 Đang nghe (hãy nói tiếng Trung)...";
      QCore.captureLearnerVoice({
        durationMs: 4200,
        onAudioReady: (_, transcript) => {
          micBtn.textContent = "🎙️ Nói bằng Micro";
          if (transcript) {
            inp.value = transcript;
            QCore.showToast(`Đã nhận diện: "${transcript}" — bấm Gửi để AI phản hồi!`);
          } else {
            QCore.showToast("Trình duyệt chưa nhận diện được câu tiếng Trung rõ ràng, bạn có thể nói lại hoặc dùng thanh gợi ý Pinyin nhé!");
          }
        }
      });
    };
  }

  /* ==================== 6.5. READING – SPLIT-SCREEN STUDIO ==================== */
  let activeReadId = "read_hsk1_day";
  let rdShowPinyin = true;
  let rdShowTrans = false;
  let selectedToken = null;
  let selectedSentIdx = 0;
  let showReadQuiz = false;

  let activeReadMatId = null;
  let matRdShowGloss = true;
  let matRdSelectedWord = null;

  function renderReading(container, params = {}) {
    const st = QCore.getState();
    if (params && params.materialId) {
      activeReadMatId = params.materialId;
      matRdSelectedWord = null;
    } else if (params && params.materialId === null) {
      activeReadMatId = null;
    }
    const customMat = activeReadMatId ? (st.materials || []).find((m) => m.id === activeReadMatId) : null;
    if (customMat) {
      renderMaterialReadingStudio(container, customMat);
      return;
    }

    const passages = window.QCHINESE_READING || [];
    const passage = passages.find((p) => p.id === activeReadId) || passages[0];
    const sent = passage.sentences[selectedSentIdx] || passage.sentences[0];
    const tok = selectedToken || sent.tokens.find((t) => !t.punct) || sent.tokens[0];
    const noteKey = `${passage.id}_${selectedSentIdx}`;

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2>📰 Luyện Đọc Hiểu Song Song (HSK 1 – HSK 6)</h2>
          <p>Bên trái: Văn bản chữ Hán Giản thể (bấm từng từ để nghe âm & xem nghĩa). Bên phải: Từ điển ngữ cảnh, ghi chú câu và bài kiểm tra đọc hiểu.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${passages
            .map(
              (p) => `<button class="btn ${p.id === passage.id ? "btn-primary" : "btn-outline"} btn-sm" data-rdid="${p.id}">HSK ${p.hsk_level}: ${QCore.escapeHtml(p.title.split("(")[0])}</button>`
            )
            .join("")}
        </div>
      </div>

      <div class="reading-layout">
        <!-- LEFT PANE: Chinese Text -->
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border-color);margin-bottom:14px;">
            <div>
              <span class="badge badge-jade">HSK ${passage.hsk_level}</span>
              <h3 style="margin:4px 0 0;">${QCore.escapeHtml(passage.title)}</h3>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn ${rdShowPinyin ? "btn-primary" : "btn-outline"} btn-sm" id="rd-tog-py">ā Pinyin</button>
              <button class="btn ${rdShowTrans ? "btn-primary" : "btn-outline"} btn-sm" id="rd-tog-tr">👁️ Bản dịch</button>
              <button class="btn btn-soft btn-sm" id="rd-play-passage">🔊 Nghe cả bài</button>
              <button class="btn btn-outline btn-sm" id="rd-open-quiz">📝 Kiểm tra sau đọc</button>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:14px;">
            ${passage.sentences
              .map(
                (s, sIdx) => `
              <div class="card-subtle" style="border-color:${selectedSentIdx === sIdx ? "var(--primary)" : "var(--border-color)"};">
                <div style="display:flex;flex-wrap:wrap;align-items:flex-end;">
                  ${s.tokens
                    .map((t, tIdx) => {
                      if (t.punct) {
                        return `<span class="hanzi-text" style="font-size:23px;padding:3px 2px;">${QCore.escapeHtml(t.w)}</span>`;
                      }
                      const isMarked = st.markedWords.includes(t.w);
                      const isSel = selectedToken && selectedToken.w === t.w && selectedSentIdx === sIdx;
                      return `
                        <span class="reading-token ${isSel ? "selected" : ""} ${isMarked ? "marked" : ""}" data-sidx="${sIdx}" data-tidx="${tIdx}">
                          ${rdShowPinyin ? `<span class="rt-py pinyin-text">${QCore.escapeHtml(t.py)}</span>` : ""}
                          <span class="rt-hz">${QCore.escapeHtml(t.w)}</span>
                        </span>
                      `;
                    })
                    .join("")}
                  <button class="btn btn-outline btn-sm" style="margin-left:8px;padding:3px 8px;" data-speak-sent="${QCore.escapeHtml(s.zh)}" data-sel-sent="${sIdx}">🔊 Câu ${sIdx + 1}</button>
                </div>
                ${
                  rdShowTrans
                    ? `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-color);font-size:13.5px;color:var(--text-secondary);">🇻🇳 <strong>${QCore.escapeHtml(s.vi)}</strong><br>🇬🇧 ${QCore.escapeHtml(s.en)}</div>`
                    : ""
                }
              </div>
            `
              )
              .join("")}
          </div>

          ${
            showReadQuiz
              ? `
            <div class="card-subtle" style="margin-top:18px;border:1.5px solid var(--primary);">
              <h4 style="margin:0 0 10px;">📝 Bài kiểm tra đọc hiểu</h4>
              ${passage.quiz
                .map(
                  (qz, qi) => `
                <div style="margin-bottom:12px;">
                  <strong style="display:block;margin-bottom:6px;">Câu ${qi + 1}: ${QCore.escapeHtml(qz.q)}</strong>
                  <div class="grid-2" style="gap:6px;">
                    ${qz.options
                      .map(
                        (opt) => `<button class="btn btn-outline btn-sm" style="justify-content:flex-start;" data-rd-q="${qi}" data-rd-opt="${QCore.escapeHtml(opt)}">${QCore.escapeHtml(opt)}</button>`
                      )
                      .join("")}
                  </div>
                  <div id="rd-q-fb-${qi}" style="margin-top:4px;font-size:13px;"></div>
                </div>
              `
                )
                .join("")}
            </div>
          `
              : ""
          }
        </div>

        <!-- RIGHT PANE: Explanation, Word Inspector, Highlight, Save to Notebook & Sentence Notes -->
        <div class="card" style="position:sticky;top:76px;">
          <span class="badge badge-blue" style="margin-bottom:8px;">🔍 Giải thích từ & Dịch câu đang chọn</span>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;">
            <div>
              <div class="hanzi-calligraphy" style="font-size:44px;line-height:1.1;">${QCore.escapeHtml(tok.w)}</div>
              <div class="pinyin-text" style="font-size:18px;font-weight:700;color:var(--primary);">${QCore.escapeHtml(tok.py || "")}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <button class="btn btn-primary btn-sm" id="rd-tok-speak">🔊 Nghe từ</button>
              <button class="btn btn-outline btn-sm" id="rd-tok-stroke">✍️ Xem nét chữ đầu</button>
            </div>
          </div>

          <div class="card-subtle" style="margin-bottom:12px;">
            <div>🇻🇳 <strong>Nghĩa tiếng Việt:</strong> ${QCore.escapeHtml(tok.vi || "Dấu câu")}</div>
            <div style="margin-top:4px;">🇬🇧 <strong>Nghĩa tiếng Anh:</strong> ${QCore.escapeHtml(tok.en || "")}</div>
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
            <button class="btn btn-soft btn-sm" id="rd-mark-word">
              ${st.markedWords.includes(tok.w) ? "★ Bỏ đánh dấu từ mới" : "☆ Đánh dấu từ mới"}
            </button>
            <button class="btn btn-outline btn-sm" id="rd-save-nb">📒 Lưu từ vào Sổ tay</button>
          </div>

          <hr style="border:none;border-top:1px solid var(--border-color);margin:14px 0;">

          <h4 style="margin:0 0 6px;font-size:14.5px;">📖 Dịch nghĩa Câu ${selectedSentIdx + 1}</h4>
          <div class="card-subtle" style="margin-bottom:12px;font-size:13.5px;">
            <div class="hanzi-text" style="font-weight:700;margin-bottom:4px;">${QCore.escapeHtml(sent.zh)}</div>
            <div style="color:var(--primary);margin-bottom:4px;">${QCore.escapeHtml(sent.py)}</div>
            <div>🇻🇳 <strong>${QCore.escapeHtml(sent.vi)}</strong></div>
            <div style="color:var(--text-secondary);">🇬🇧 ${QCore.escapeHtml(sent.en)}</div>
          </div>

          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">📝 Ghi chú cá nhân cho câu này:</label>
          <textarea class="textarea-field" id="rd-sent-note" rows="2" placeholder="Ghi chú ngữ pháp hoặc từ mới của riêng bạn...">${QCore.escapeHtml(st.readingNotes[noteKey] || "")}</textarea>
          <button class="btn btn-outline btn-sm" style="margin-top:8px;" id="rd-save-note">Lưu ghi chú câu</button>
        </div>
      </div>
    `;

    container.querySelectorAll("[data-rdid]").forEach((b) => {
      b.onclick = () => {
        activeReadId = b.getAttribute("data-rdid");
        selectedSentIdx = 0;
        selectedToken = null;
        showReadQuiz = false;
        renderReading(container);
      };
    });

    container.querySelector("#rd-tog-py").onclick = () => { rdShowPinyin = !rdShowPinyin; renderReading(container); };
    container.querySelector("#rd-tog-tr").onclick = () => { rdShowTrans = !rdShowTrans; renderReading(container); };
    container.querySelector("#rd-open-quiz").onclick = () => { showReadQuiz = !showReadQuiz; renderReading(container); };

    container.querySelector("#rd-play-passage").onclick = () => {
      const fullText = passage.sentences.map((s) => s.zh).join(" ");
      QCore.speakChinese(fullText);
    };

    container.querySelectorAll("[data-sidx]").forEach((el) => {
      el.onclick = () => {
        selectedSentIdx = Number(el.getAttribute("data-sidx"));
        const tIdx = Number(el.getAttribute("data-tidx"));
        selectedToken = passage.sentences[selectedSentIdx].tokens[tIdx];
        QCore.speakChinese(selectedToken.w);
        renderReading(container);
      };
    });

    container.querySelectorAll("[data-speak-sent]").forEach((b) => {
      b.onclick = () => {
        selectedSentIdx = Number(b.getAttribute("data-sel-sent"));
        QCore.speakChinese(b.getAttribute("data-speak-sent"));
        renderReading(container);
      };
    });

    container.querySelector("#rd-tok-speak").onclick = () => QCore.speakChinese(tok.w);
    container.querySelector("#rd-tok-stroke").onclick = () => window.QApp.navigate("hanzi", { char: tok.w.charAt(0) });
    container.querySelector("#rd-mark-word").onclick = () => {
      const idx = st.markedWords.indexOf(tok.w);
      if (idx >= 0) st.markedWords.splice(idx, 1);
      else st.markedWords.push(tok.w);
      QCore.saveState(false);
      renderReading(container);
    };
    container.querySelector("#rd-save-nb").onclick = () => {
      QCore.addToNotebook({
        category: "vocab",
        hanzi: tok.w,
        pinyin: tok.py,
        english: tok.en,
        vietnamese: tok.vi,
        example: `${sent.zh} (${sent.vi})`
      });
    };
    container.querySelector("#rd-save-note").onclick = () => {
      const val = container.querySelector("#rd-sent-note").value.trim();
      st.readingNotes[noteKey] = val;
      if (val) {
        QCore.addToNotebook({
          category: "sentence",
          hanzi: sent.zh,
          pinyin: sent.py,
          english: sent.en,
          vietnamese: sent.vi,
          note: val
        });
      } else {
        QCore.saveState(true);
        QCore.showToast("Đã lưu ghi chú!");
      }
    };

    container.querySelectorAll("[data-rd-q]").forEach((b) => {
      b.onclick = () => {
        const qi = Number(b.getAttribute("data-rd-q"));
        const opt = b.getAttribute("data-rd-opt");
        const ok = opt === passage.quiz[qi].answer;
        QCore.updateSkillScore("reading", ok ? 95 : 60);
        if (ok && !st.readingCompleted.includes(passage.id)) {
          st.readingCompleted.push(passage.id);
          QCore.saveState(true);
        }
        container.querySelector(`#rd-q-fb-${qi}`).innerHTML = ok
          ? `<span style="color:var(--primary);font-weight:700;">✅ Chính xác!</span>`
          : `<span style="color:var(--accent-red);">❌ Đáp án đúng là: ${QCore.escapeHtml(passage.quiz[qi].answer)}</span>`;
      };
    });
  }

  /* ==================== 6.6. WRITING STUDIO (PART A HANZI + PART B SENTENCE/PARAGRAPH AI) ==================== */
  let wrSection = "partB"; // "partA" | "partB"
  let activeTaskIdx = 0;
  let activeWriteMatId = null;
  let lastAiGrade = null;

  function renderWriting(container, params = {}) {
    const st = QCore.getState();
    if (params && params.materialId) {
      activeWriteMatId = params.materialId;
      wrSection = "partB";
      lastAiGrade = null;
    } else if (params && params.materialId === null) {
      activeWriteMatId = null;
    }
    const customMat = activeWriteMatId ? (st.materials || []).find((m) => m.id === activeWriteMatId) : null;
    if (customMat) {
      renderMaterialWritingStudio(container, customMat);
      return;
    }
    const tasks = window.QCHINESE_WRITING_TASKS || [];
    const task = tasks[activeTaskIdx % tasks.length];

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2>🖋️ Luyện Viết Tiếng Trung Toàn Diện (Chữ Hán & Viết Câu/Đoạn AI)</h2>
          <p>Phân chia rõ 2 phần: A. Luyện viết chữ Hán chuẩn thứ tự nét & B. Viết câu, dịch câu, viết đoạn văn được AI sửa chi tiết theo 7 tiêu chí.</p>
        </div>
        <div class="tabs-bar">
          <button class="tab-pill ${wrSection === "partA" ? "active" : ""}" data-wrtab="partA">Phần A: Viết chữ Hán theo nét</button>
          <button class="tab-pill ${wrSection === "partB" ? "active" : ""}" data-wrtab="partB">Phần B: Viết câu & đoạn văn (AI sửa 7 tiêu chí)</button>
        </div>
      </div>

      <div id="writing-stage"></div>
    `;

    container.querySelectorAll("[data-wrtab]").forEach((b) => {
      b.onclick = () => {
        wrSection = b.getAttribute("data-wrtab");
        renderWriting(container);
      };
    });

    const stage = container.querySelector("#writing-stage");

    if (wrSection === "partA") {
      // Embed the full Hanzi Writing Studio directly for Part A!
      window.QHanziStudio.renderHanzi(stage);
      return;
    }

    // Part B: Sentence & Paragraph Writing with 7-Criteria AI Feedback
    stage.innerHTML = `
      <div class="grid-2">
        <div class="card">
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">
            ${tasks
              .map(
                (t, idx) => `
              <button class="btn ${idx === activeTaskIdx ? "btn-primary" : "btn-outline"} btn-sm" data-wtask="${idx}">
                Đề ${idx + 1}: HSK ${t.hsk_level}
              </button>
            `
              )
              .join("")}
          </div>

          <span class="badge badge-jade" style="margin-bottom:8px;">${QCore.escapeHtml(task.badge)}</span>
          <h3 style="margin:0 0 10px;font-size:18px;">${QCore.escapeHtml(task.prompt)}</h3>
          <div class="card-subtle" style="margin-bottom:14px;font-size:13px;color:var(--text-secondary);">
            💡 ${QCore.escapeHtml(task.hint)}
          </div>

          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">1. Nhập câu / đoạn văn bằng Chữ Hán Giản thể (gõ Pinyin tự động hiện gợi ý chữ Hán):</label>
          <textarea class="textarea-field hanzi-text" id="wr-main-text" rows="4" data-pinyin-ime="true" style="font-size:18px;margin-bottom:12px;" placeholder="Ví dụ gõ: wo shi yuenan ren..."></textarea>

          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">2. Nhập Pinyin của câu (tùy chọn – nếu nhập AI sẽ chấm cả lỗi Pinyin cho bạn):</label>
          <input class="input-field pinyin-text" id="wr-opt-py" data-pinyin-ime="true" data-pinyin-mode="pinyin-only" placeholder="Tùy chọn: gõ Pinyin để luyện thêm dấu thanh..." style="margin-bottom:14px;">

          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-primary" id="wr-submit-ai">👩‍🏫 Chấm & Sửa bài chi tiết (7 tiêu chí)</button>
            <button class="btn btn-outline" id="wr-save-wrong">📒 Lưu câu vào Sổ tay</button>
          </div>
        </div>

        <div class="card" id="wr-feedback-panel">
          ${
            lastAiGrade
              ? renderAiWritingFeedbackHTML(lastAiGrade)
              : `
            <div style="text-align:center;padding:40px 18px;color:var(--text-muted);">
              <div style="font-size:42px;margin-bottom:10px;">📝</div>
              <strong style="color:var(--text-main);font-size:16px;">Bảng chấm bài chi tiết 7 tiêu chí của AI Giáo viên</strong>
              <p style="font-size:13.5px;margin-top:6px;">
                Sau khi bạn nộp bài viết bên trái, AI Giáo viên sẽ phân tích: Chữ Hán Giản thể, Pinyin, Ngữ pháp, Dùng từ, Trật tự từ, Độ tự nhiên, Phù hợp ngữ cảnh — kèm giải thích tại sao sai và ví dụ tương tự để bạn tự sửa được lần sau!
              </p>
            </div>
          `
          }
        </div>
      </div>
    `;

    stage.querySelectorAll("[data-wtask]").forEach((b) => {
      b.onclick = () => {
        activeTaskIdx = Number(b.getAttribute("data-wtask"));
        lastAiGrade = null;
        renderWriting(container);
      };
    });

    bindGradePanelAudio(stage);

    stage.querySelector("#wr-submit-ai").onclick = async () => {
      const text = stage.querySelector("#wr-main-text").value.trim();
      const py = stage.querySelector("#wr-opt-py").value.trim();
      if (!text) {
        QCore.showToast("Vui lòng nhập câu hoặc đoạn văn tiếng Trung trước khi chấm bài!");
        return;
      }
      const panel = stage.querySelector("#wr-feedback-panel");
      panel.innerHTML = `<div style="padding:30px;text-align:center;">⏳ Giáo viên AI đang chấm từng tiêu chí chữ Hán, ngữ pháp và trật tự từ...</div>`;
      try {
        const res = await QCore.apiFetch("/api/ai/writing", {
          method: "POST",
          body: {
            text,
            pinyin: py,
            prompt: task.prompt,
            targetWord: task.targetWord,
            expected: task.expected,
            expectedPinyin: task.expectedPinyin,
            expectedEn: task.expectedEn,
            expectedVi: task.expectedVi,
            hskLevel: task.hsk_level
          }
        });
        lastAiGrade = res;
        st.writingSubmissions.unshift({
          date: QCore.todayStr(),
          original: res.original,
          corrected: res.corrected,
          score: res.score
        });
        QCore.updateSkillScore("writing", res.score);
        QCore.saveState(true);
        panel.innerHTML = renderAiWritingFeedbackHTML(res);
        bindGradePanelAudio(panel);
      } catch (e) {
        panel.innerHTML = `<div style="color:var(--accent-red);">${QCore.escapeHtml(e.message)}</div>`;
      }
    };

    stage.querySelector("#wr-save-wrong").onclick = () => {
      if (!lastAiGrade) {
        QCore.showToast("Hãy bấm Chấm bài trước để lưu kèm câu sửa chuẩn vào Sổ tay nhé!");
        return;
      }
      QCore.addToNotebook({
        category: "wrong_write",
        hanzi: lastAiGrade.corrected,
        pinyin: lastAiGrade.pinyin,
        english: lastAiGrade.english,
        vietnamese: lastAiGrade.vietnamese,
        example: `Câu đã viết: ${lastAiGrade.original}`,
        note: lastAiGrade.whyWrong
      });
    };
  }

  async function renderMaterialReadingStudio(container, mat) {
    await QVocabStore.init();

    const markedSet = new Set(st.markedWords || []);

    const sentences = (mat.content || "").split(/[。！？\n]+/).map((s) => s.trim()).filter((s) => s.length >= 4);

    container.innerHTML = `
      <div class="page-header">

          <span class="badge badge-blue">📁 ĐỌC HIỂU TƯƠNG TÁC (LWT-STYLE) · HSK ${mat.hskLevel}</span>
