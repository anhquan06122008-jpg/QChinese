  <style>
/* -*- coding: utf-8 -*-
 * QChinese – AI 汉语私人教师 Design System
 * Cozy Modern Educational Aesthetic (Light & Dark Mode, Responsive, Simplified Chinese Optimized)
 */

:root {
  --bg-app: #f4f7f4;
  --bg-surface: #ffffff;
  --bg-subtle: #edf3ee;
  --bg-elevated: #ffffff;
  --bg-accent-soft: #e3f1e8;
  --bg-warn-soft: #fef6e6;
  --bg-danger-soft: #fdecec;
  --bg-info-soft: #e8f1fb;

  --text-main: #1b2a22;
  --text-secondary: #4a5d52;
  --text-muted: #76897e;

  --primary: #2d6a4f;
  --primary-hover: #22543d;
  --primary-light: #52b788;
  --accent-red: #d94343;
  --accent-amber: #d97706;
  --accent-blue: #2563eb;

  --border-color: #dce6df;
  --border-strong: #c2d4c8;
  --grid-line: #e3ebe5;
  --grid-guide: #eccaca;

  --shadow-sm: 0 2px 8px rgba(27, 42, 34, 0.04);
  --shadow-md: 0 8px 24px rgba(27, 42, 34, 0.07);
  --shadow-lg: 0 16px 40px rgba(27, 42, 34, 0.12);

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-pill: 999px;

  --font-ui: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-hanzi-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-hanzi-serif: "Noto Serif SC", "KaiTi", "STKaiti", "SimKai", serif;

  --sidebar-width: 268px;
}

[data-theme="dark"] {
  --bg-app: #0f1714;
  --bg-surface: #17231e;
  --bg-subtle: #1f2f28;
  --bg-elevated: #21322b;
  --bg-accent-soft: #1e3a2f;
  --bg-warn-soft: #362912;
  --bg-danger-soft: #3a1b1e;
  --bg-info-soft: #172a42;

  --text-main: #edf4ef;
  --text-secondary: #b4c6bc;
  --text-muted: #7d9487;

  --primary: #52b788;
  --primary-hover: #74c69d;
  --primary-light: #40916c;
  --accent-red: #ef6461;
  --accent-amber: #f59e0b;
  --accent-blue: #60a5fa;

  --border-color: #293d34;
  --border-strong: #395448;
  --grid-line: #2b3f36;
  --grid-guide: #593336;

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 8px 26px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.5);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-app);
  color: var(--text-main);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.hanzi-text {
  font-family: var(--font-hanzi-sans);
}

.hanzi-calligraphy {
  font-family: var(--font-hanzi-serif);
  font-weight: 500;
}

.pinyin-text {
  font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
  letter-spacing: 0.02em;
}

/* ============ App Layout ============ */
.app-shell {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-surface);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 40;
  transition: transform 0.25s ease;
}

.sidebar-brand {
  padding: 20px 20px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border-color);
}

.brand-seal {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--primary);
  color: #fff;
  font-family: var(--font-hanzi-serif);
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}

[data-theme="dark"] .brand-seal {
  color: #0e1713;
  font-weight: 700;
}

.brand-titles h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.2;
}

.brand-titles span {
  font-size: 12px;
  color: var(--text-muted);
  display: block;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.nav-btn {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  padding: 10px 14px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 11px;
  cursor: pointer;
  text-align: left;
  transition: background 0.16s ease, color 0.16s ease;
}

.nav-btn:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
}

.nav-btn.active {
  background: var(--bg-accent-soft);
  color: var(--primary);
  font-weight: 700;
}

.nav-icon {
  width: 22px;
  text-align: center;
  font-size: 16px;
  flex-shrink: 0;
}

.sidebar-user {
  padding: 14px 16px;
  border-top: 1px solid var(--border-color);
  background: var(--bg-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.user-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg-accent-soft);
  color: var(--primary);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-strong);
  flex-shrink: 0;
}

.user-meta {
  flex: 1;
  min-width: 0;
}

.user-meta strong {
  display: block;
  font-size: 13.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-meta small {
  color: var(--text-muted);
  font-size: 11.5px;
}

.main-area {
  flex: 1;
  margin-left: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* ============ Top Header Bar ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg-app) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-color);
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.mobile-menu-btn {
  display: none;
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  color: var(--text-main);
  border-radius: 10px;
  padding: 8px 11px;
  cursor: pointer;
  font-size: 18px;
}

.quick-search-wrap {
  position: relative;
  flex: 1;
  max-width: 460px;
}

.quick-search-input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  color: var(--text-main);
  font-family: inherit;
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.quick-search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--bg-accent-soft);
}

.quick-search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.quick-search-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  max-height: 340px;
  overflow-y: auto;
  z-index: 80;
  display: none;
}

.quick-search-dropdown.open {
  display: block;
}

.qs-item {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
}

.qs-item:last-child {
  border-bottom: none;
}

.qs-item:hover {
  background: var(--bg-subtle);
}

.topbar-pills {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.stat-pill {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-pill);
  padding: 6px 13px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-sm);
}

.icon-btn {
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  color: var(--text-main);
  border-radius: var(--radius-pill);
  padding: 7px 12px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.16s ease;
}

.icon-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

/* ============ Page Container & Smooth View Transitions ============ */
.page-content {
  padding: 26px 30px 64px;
  max-width: 1260px;
  width: 100%;
  margin: 0 auto;
  animation: fadeSlideIn 0.22s ease-out;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.page-header h2 {
  margin: 0 0 4px;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.page-header p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 14.5px;
}

/* ============ Reusable Cards, Buttons & Badges ============ */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: var(--shadow-sm);
}

.card-subtle {
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 16px;
}

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

.btn {
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 10px 18px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.16s ease;
}

.btn-primary {
  background: var(--primary);
  color: #ffffff;
}

[data-theme="dark"] .btn-primary {
  color: #0d1813;
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-outline {
  background: var(--bg-surface);
  border-color: var(--border-strong);
  color: var(--text-main);
}

.btn-outline:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.btn-soft {
  background: var(--bg-accent-soft);
  color: var(--primary);
}

.btn-soft:hover {
  filter: brightness(0.96);
}

.btn-danger {
  background: var(--bg-danger-soft);
  color: var(--accent-red);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12.5px;
  border-radius: 9px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-subtle);
  color: var(--text-secondary);
}

.badge-jade { background: var(--bg-accent-soft); color: var(--primary); }
.badge-amber { background: var(--bg-warn-soft); color: var(--accent-amber); }
.badge-red { background: var(--bg-danger-soft); color: var(--accent-red); }
.badge-blue { background: var(--bg-info-soft); color: var(--accent-blue); }

.tabs-bar {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 6px;
  background: var(--bg-subtle);
  padding: 5px;
  border-radius: 14px;
  border: 1px solid var(--border-color);
}

.tab-pill {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  padding: 8px 15px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}

.tab-pill.active {
  background: var(--bg-surface);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

/* ============ Metric Cards & Progress Bars ============ */
.kpi-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.kpi-label {
  font-size: 12.5px;
  color: var(--text-muted);
  font-weight: 500;
}

.kpi-value {
  font-size: 24px;
  font-weight: 800;
  color: var(--text-main);
}

.kpi-sub {
  font-size: 12px;
  color: var(--primary);
}

.progress-track {
  width: 100%;
  height: 10px;
  background: var(--bg-subtle);
  border-radius: var(--radius-pill);
  overflow: hidden;
  border: 1px solid var(--border-color);
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  border-radius: var(--radius-pill);
  transition: width 0.35s ease;
}

/* ============ Hanzi Grid (田字格 / 米字格) & Stroke Breakdown Strip ============ */
.mizige-box {
  position: relative;
  width: 280px;
  height: 280px;
  background: var(--bg-surface);
  border: 2px solid var(--primary);
  border-radius: 16px;
  overflow: hidden;
  margin: 0 auto;
  user-select: none;
  touch-action: none;
  box-shadow: var(--shadow-sm);
}

.mizige-guides {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.mizige-target {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
}

.stroke-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.stroke-step-cell {
  width: 74px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  overflow: hidden;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}

.stroke-step-cell:hover,
.stroke-step-cell.active {
  border-color: var(--accent-red);
  transform: translateY(-2px);
}

.stroke-step-head {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-subtle);
  padding: 2px 4px;
  border-bottom: 1px solid var(--border-color);
}

.stroke-step-svg {
  width: 72px;
  height: 72px;
  display: block;
}

/* ============ Vietnamese Hint Caution Box ============ */
.vi-hint-banner {
  background: var(--bg-warn-soft);
  border: 1px solid color-mix(in srgb, var(--accent-amber) 35%, transparent);
  border-radius: 12px;
  padding: 9px 13px;
  font-size: 13px;
  color: var(--text-main);
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

/* ============ Trilingual Table ============ */
.tri-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.tri-table th,
.tri-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-color);
  text-align: left;
  vertical-align: top;
}

.tri-table th {
  color: var(--text-muted);
  font-weight: 600;
  width: 130px;
  background: var(--bg-subtle);
}

/* ============ Dialogue Replay & Split Reading ============ */
.dialogue-row {
  padding: 13px 16px;
  border-radius: 14px;
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}

.dialogue-row:hover,
.dialogue-row.playing {
  border-color: var(--primary);
  background: var(--bg-accent-soft);
}

.reading-layout {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 20px;
  align-items: start;
}

.reading-token {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  padding: 3px 5px;
  margin: 2px 1px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.14s;
}

.reading-token:hover,
.reading-token.selected {
  background: var(--bg-accent-soft);
}

.reading-token.marked {
  background: var(--bg-warn-soft);
  border-bottom: 2px solid var(--accent-amber);
}

.reading-token .rt-py {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.2;
}

.reading-token .rt-hz {
  font-size: 23px;
  font-family: var(--font-hanzi-sans);
  line-height: 1.35;
}

/* ============ Inputs & Smart Pinyin IME Floating Bar ============ */
.input-field,
.textarea-field,
.select-field {
  width: 100%;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-main);
  font-family: inherit;
  font-size: 14.5px;
  outline: none;
  transition: border-color 0.18s, box-shadow 0.18s;
}

.input-field:focus,
.textarea-field:focus,
.select-field:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--bg-accent-soft);
}

.pinyin-ime-bar {
  position: fixed;
  z-index: 200;
  background: var(--bg-elevated);
  border: 1.5px solid var(--primary);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  padding: 8px 10px;
  max-width: min(92vw, 620px);
  display: none;
}

.pinyin-ime-bar.visible {
  display: block;
}

.ime-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 11.5px;
  color: var(--text-muted);
  padding-bottom: 5px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--border-color);
}

.ime-candidates {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.ime-chip {
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  color: var(--text-main);
  border-radius: 10px;
  padding: 5px 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  font-family: inherit;
  transition: all 0.14s ease;
}

.ime-chip:hover,
.ime-chip.first {
  background: var(--bg-accent-soft);
  border-color: var(--primary);
}

.ime-chip .ime-hz {
  font-family: var(--font-hanzi-sans);
  font-size: 17px;
  font-weight: 600;
}

.ime-chip .ime-py {
  font-size: 12px;
  color: var(--primary);
  font-weight: 600;
}

.ime-chip .ime-vi {
  font-size: 11.5px;
  color: var(--text-muted);
}

/* ============ AI Chat Bubbles ============ */
.chat-stream {
  max-height: 440px;
  overflow-y: auto;
  padding: 14px;
  background: var(--bg-subtle);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.chat-bubble {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 16px;
  border: 1px solid var(--border-color);
  background: var(--bg-surface);
}

.chat-bubble.ai {
  align-self: flex-start;
  border-top-left-radius: 4px;
}

.chat-bubble.user {
  align-self: flex-end;
  background: var(--bg-accent-soft);
  border-color: var(--primary);
  border-top-right-radius: 4px;
}

/* ============ Modals & Auth Screen ============ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(12, 20, 16, 0.58);
  backdrop-filter: blur(4px);
  z-index: 120;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-backdrop.open {
  display: flex;
}

.modal-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  max-width: 680px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 26px;
  box-shadow: var(--shadow-lg);
}

.toast-stack {
  position: fixed;
  bottom: 22px;
  right: 22px;
  z-index: 250;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast-item {
  background: var(--bg-elevated);
  color: var(--text-main);
  border-left: 4px solid var(--primary);
  border-radius: 12px;
  padding: 12px 16px;
  box-shadow: var(--shadow-lg);
  font-size: 13.5px;
  font-weight: 600;
  animation: fadeSlideIn 0.2s ease;
}

/* ============ Responsive Design (Tablet & Phone) ============ */
@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .reading-layout { grid-template-columns: 1fr; }
}

@media (max-width: 820px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.open {
    transform: translateX(0);
    box-shadow: var(--shadow-lg);
  }
  .main-area {
    margin-left: 0;
  }
  .mobile-menu-btn {
    display: inline-flex;
  }
  .topbar {
    padding: 10px 16px;
  }
  .page-content {
    padding: 18px 16px 60px;
  }
  .grid-2, .grid-3 {
    grid-template-columns: 1fr;
  }
  .filter-grid-4, .filter-grid-3 {
    grid-template-columns: 1fr !important;
  }
}

@media (max-width: 480px) {
  .grid-4 {
    grid-template-columns: 1fr;
  }
  .mizige-box {
    width: 248px;
    height: 248px;
  }
}

  <script data-bundle="js/cloud-sync.js">
/* -*- coding: utf-8 -*-
 * QChinese – Supabase Cloud Auth, Multi-Device Sessions & 24/7 Real-Time WSS Sync
 * Modeled on QEnglish & TKB ecosystem architecture (100% isolated `qchinese_*` tables).
 * ZERO secrets stored in frontend — reads public Supabase URL/Anon Key from /api/config.
 */

window.QCloud = (function () {
  const CLOUD_SESSION_KEY = "qchinese_cloud_session_v1";
  const DEVICE_ID_KEY = "qchinese_device_id_v1";
  const DEFAULT_CLOUD_ORIGIN = "https://q-chinese.vercel.app";

  let config = {
    loaded: false,
    authConfigured: false,
    aiConfigured: false,
    aiProvider: "pedagogical-engine",
    aiModel: "",
    supabaseUrl: "",
    supabaseAnonKey: ""
  };

  let session = null; // { access_token, refresh_token, expires_at, user }
  let recoveryAccessToken = null;
  let cloudRevision = 0;
  let ws = null;
  let wsHeartbeat = null;
  let wsReconnect = null;
  let wsRef = 0;
  let wsAttempts = 0;
  let wsManualClose = false;
  let fallbackPoll = null;
  let realtimeConnected = false;
  let schemaMissing = false;

  function safeParse(raw, fb = null) {
    try {
      return raw ? JSON.parse(raw) : fb;
    } catch (_) {
      return fb;
    }
  }

  function getDeviceId() {
    let id = localStorage.getItem(DEVICE_ID_KEY);
    if (!id) {
      id = "qcn-" + Math.random().toString(36).slice(2, 10) + "-" + Date.now().toString(36);
      localStorage.setItem(DEVICE_ID_KEY, id);
    }
    return id;
  }

  function detectDeviceMeta() {
    const ua = String(navigator.userAgent || "");
    let platform = "PC / Laptop";
    if (/Android/i.test(ua)) platform = "Android";
    else if (/iPad/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) platform = "iPad";
    else if (/iPhone|iPod/i.test(ua)) platform = "iPhone";
    else if (/Macintosh/i.test(ua)) platform = "Mac";
    else if (/Windows/i.test(ua)) platform = "Windows";
    else if (/Linux/i.test(ua)) platform = "Linux";

    let browser = "Browser";
    if (/Edg\//i.test(ua)) browser = "Edge";
    else if (/Chrome\//i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome";
    else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
    else if (/Firefox/i.test(ua)) browser = "Firefox";

    return {
      deviceName: `${platform} · ${browser}`,
      platform,
      userAgent: ua.slice(0, 240)
    };
  }

  function isCloudMode() {
    return Boolean(config.authConfigured && config.supabaseUrl && config.supabaseAnonKey);
  }

  function getHeaders(useAuth = true) {
    const h = {
      "Content-Type": "application/json",
      apikey: config.supabaseAnonKey
    };
    if (useAuth && session && session.access_token) {
      h.Authorization = `Bearer ${session.access_token}`;
    }
    return h;
  }

  function saveSession(obj) {
    session = obj || null;
    if (obj) localStorage.setItem(CLOUD_SESSION_KEY, JSON.stringify(obj));
    else localStorage.removeItem(CLOUD_SESSION_KEY);
  }

  function translateError(raw) {
    const msg = String(raw || "");
    if (/invalid login credentials/i.test(msg)) return "Email hoặc mật khẩu chưa chính xác.";
    if (/email not confirmed/i.test(msg)) return "Email chưa được xác minh. Vui lòng kiểm tra hộp thư để xác nhận.";
    if (/already registered|user already/i.test(msg)) return "Email này đã có tài khoản. Vui lòng chuyển sang Đăng nhập.";
    if (/rate limit/i.test(msg)) return "Thao tác quá nhanh, vui lòng chờ vài giây rồi thử lại.";
    if (/password/i.test(msg) && /weak|short|6/i.test(msg)) return "Mật khẩu cần tối thiểu 6 ký tự.";
    return msg || "Có lỗi xác thực đám mây.";
  }

  async function initConfig(apiBase = "") {
    const base = String(apiBase || "").trim().replace(/\/+$/, "");
    const host = (typeof window !== "undefined" && window.location && window.location.hostname) || "";
    const isStaticHost = typeof window !== "undefined" && (window.location.protocol === "file:" || /github\.io$/i.test(host));
    const candidates = [];
    if (base) candidates.push(`${base}/api/config`);
    else if (isStaticHost) candidates.push(`${DEFAULT_CLOUD_ORIGIN}/api/config`);
    else {
      candidates.push("/api/config");
      candidates.push(`${DEFAULT_CLOUD_ORIGIN}/api/config`);
    }

    for (const url of candidates) {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 7000);
        const res = await fetch(url, { method: "GET", cache: "no-store", signal: ctrl.signal });
        clearTimeout(t);
        if (res.ok) {
          const d = await res.json().catch(() => ({}));
          if (d && d.ok) {
            config = Object.assign({}, config, d, { loaded: true });
            return config;
          }
        }
      } catch (_) {}
    }
    config.loaded = true;
    return config;
  }

  function parseUrlAuthHash() {
    const hash = String(window.location.hash || "").replace(/^#/, "");
    const params = new URLSearchParams(hash);
    const accessToken = params.get("access_token");
    const refreshToken = params.get("refresh_token");
    const type = params.get("type");
    const errorDesc = params.get("error_description") || params.get("error");
    if (hash && (accessToken || errorDesc || type)) {
      try {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      } catch (_) {}
    }
    return { accessToken, refreshToken, type, errorDesc };
  }

  async function fetchAuthUser(accessToken) {
    try {
      const res = await fetch(`${config.supabaseUrl}/auth/v1/user`, {
        method: "GET",
        headers: {
          apikey: config.supabaseAnonKey,
          Authorization: `Bearer ${accessToken}`
        }
      });
      if (!res.ok) return null;
      return await res.json();
    } catch (_) {
      return null;
    }
  }

  async function refreshSessionToken(refreshTokenVal) {
    try {
      const res = await fetch(`${config.supabaseUrl}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: getHeaders(false),
        body: JSON.stringify({ refresh_token: refreshTokenVal })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.access_token || !data.user) {
        saveSession(null);
        return { ok: false };
      }
      const sess = {
        access_token: data.access_token,
        refresh_token: data.refresh_token || refreshTokenVal,
        expires_at: Math.floor(Date.now() / 1000) + (Number(data.expires_in) || 3600),
        user: data.user
      };
      saveSession(sess);
      return { ok: true, user: data.user };
    } catch (_) {
      return { ok: false };
    }
  }

  async function ensureValidSession() {
    if (!isCloudMode() || !session || !session.access_token) return false;
    const nowSec = Math.floor(Date.now() / 1000);
    if (session.expires_at && session.expires_at - 90 < nowSec && session.refresh_token) {
      const r = await refreshSessionToken(session.refresh_token);
      return r.ok;
    }
    return true;
  }

  function toQChineseUser(sbUser) {
    const email = sbUser.email || "";
    const meta = sbUser.user_metadata || {};
    const displayName = meta.display_name || meta.full_name || (email ? email.split("@")[0] : "Học viên");
    return {
      id: sbUser.id,
      username: email || sbUser.id,
      email,
      displayName,
      sessionId: getDeviceId(),
      cloudProvider: "supabase"
    };
  }

  async function restoreSession() {
    if (!isCloudMode()) return { restored: false };
    const urlAuth = parseUrlAuthHash();
    if (urlAuth.errorDesc) {
      return { restored: false, error: decodeURIComponent(urlAuth.errorDesc) };
    }
    if (urlAuth.type === "recovery" && urlAuth.accessToken) {
      recoveryAccessToken = urlAuth.accessToken;
      return { restored: false, recoveryMode: true };
    }
    if (urlAuth.accessToken && urlAuth.refreshToken) {
      const u = await fetchAuthUser(urlAuth.accessToken);
      if (u) {
        saveSession({
          access_token: urlAuth.accessToken,
          refresh_token: urlAuth.refreshToken,
          expires_at: Math.floor(Date.now() / 1000) + 3500,
          user: u
        });
        return { restored: true, user: toQChineseUser(u) };
      }
    }

    const saved = safeParse(localStorage.getItem(CLOUD_SESSION_KEY), null);
    if (saved && saved.access_token) {
      session = saved;
      const nowSec = Math.floor(Date.now() / 1000);
      if (saved.expires_at && saved.expires_at - 90 < nowSec && saved.refresh_token) {
        const ref = await refreshSessionToken(saved.refresh_token);
        if (ref.ok) return { restored: true, user: toQChineseUser(ref.user) };
      } else {
        const u = await fetchAuthUser(saved.access_token);
        if (u) {
          saved.user = u;
          saveSession(saved);
          return { restored: true, user: toQChineseUser(u) };
        }
        if (saved.refresh_token) {
          const ref = await refreshSessionToken(saved.refresh_token);
          if (ref.ok) return { restored: true, user: toQChineseUser(ref.user) };
        }
      }
      saveSession(null);
    }
    return { restored: false };
  }

  async function signUp(email, displayName, password) {
    const cleanEmail = String(email || "").trim().toLowerCase();
    const cleanName = String(displayName || "").trim() || cleanEmail.split("@")[0] || "Học viên";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
      throw new Error("Vui lòng nhập địa chỉ Email hợp lệ (vd: you@example.com).");
    }
    if (String(password || "").length < 6) {
      throw new Error("Mật khẩu cần tối thiểu 6 ký tự.");
    }
    const res = await fetch(`${config.supabaseUrl}/auth/v1/signup`, {
      method: "POST",
      headers: getHeaders(false),
      body: JSON.stringify({
        email: cleanEmail,
        password,
        data: { display_name: cleanName },
        options: { emailRedirectTo: window.location.origin + window.location.pathname }
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(translateError(data.msg || data.error_description || data.error));
    }
    if (data.access_token && data.user) {
      saveSession({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Math.floor(Date.now() / 1000) + (Number(data.expires_in) || 3600),
        user: data.user
      });
      await upsertProfile(data.user, cleanName);
      return { user: toQChineseUser(data.user), needsVerification: false };
    }
    return {
      user: null,
      needsVerification: true,
      message: `Đăng ký thành công! Hãy mở hộp thư ${cleanEmail} và bấm link xác minh trước khi đăng nhập.`
    };
  }

  async function signIn(email, password) {
    const cleanEmail = String(email || "").trim().toLowerCase();
    if (!cleanEmail || !password) {
      throw new Error("Vui lòng nhập đầy đủ Email và Mật khẩu.");
    }
    const res = await fetch(`${config.supabaseUrl}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: getHeaders(false),
      body: JSON.stringify({ email: cleanEmail, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.access_token || !data.user) {
      throw new Error(translateError(data.error_description || data.msg || data.error));
    }
    saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (Number(data.expires_in) || 3600),
      user: data.user
    });
    await upsertProfile(data.user);
    return toQChineseUser(data.user);
  }

  async function sendPasswordReset(email) {
    const cleanEmail = String(email || "").trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
      throw new Error("Vui lòng nhập địa chỉ Email hợp lệ.");
    }
    const redirectTo = window.location.origin + window.location.pathname;
    const res = await fetch(`${config.supabaseUrl}/auth/v1/recover`, {
      method: "POST",
      headers: getHeaders(false),
      body: JSON.stringify({ email: cleanEmail, redirect_to: redirectTo })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(translateError(d.msg || d.error_description || d.error));
    }
    return `Đã gửi liên kết đặt lại mật khẩu tới ${cleanEmail}. Vui lòng kiểm tra hộp thư (kể cả Spam).`;
  }

  async function updatePasswordWithRecovery(newPassword) {
    if (String(newPassword || "").length < 6) {
      throw new Error("Mật khẩu mới cần tối thiểu 6 ký tự.");
    }
    const tok = recoveryAccessToken || (session && session.access_token);
    if (!tok) throw new Error("Liên kết khôi phục đã hết hạn. Vui lòng gửi lại email khôi phục.");
    const res = await fetch(`${config.supabaseUrl}/auth/v1/user`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        apikey: config.supabaseAnonKey,
        Authorization: `Bearer ${tok}`
      },
      body: JSON.stringify({ password: newPassword })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(translateError(d.msg || d.error_description || d.error));
    recoveryAccessToken = null;
    return "Đặt lại mật khẩu thành công! Bạn có thể đăng nhập ngay bằng mật khẩu mới.";
  }

  async function updateAccountProfile(displayName, newPassword) {
    await ensureValidSession();
    const body = {};
    if (displayName) body.data = { display_name: displayName };
    if (newPassword) {
      if (newPassword.length < 6) throw new Error("Mật khẩu mới cần tối thiểu 6 ký tự.");
      body.password = newPassword;
    }
    if (Object.keys(body).length) {
      const res = await fetch(`${config.supabaseUrl}/auth/v1/user`, {
        method: "PUT",
        headers: getHeaders(true),
        body: JSON.stringify(body)
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(translateError(d.msg || d.error_description || d.error));
      if (session && d && d.id) {
        session.user = d;
        saveSession(session);
      }
    }
    if (session && session.user && displayName) {
      await upsertProfile(session.user, displayName);
    }
    return { ok: true };
  }

  async function signOut(localOnly = false) {
    disconnectRealtime();
    if (!localOnly && isCloudMode() && session && session.access_token) {
      try {
        // scope=local ensures signing out on 1 device NEVER logs out Laptop/Phone!
        await fetch(`${config.supabaseUrl}/auth/v1/logout?scope=local`, {
          method: "POST",
          headers: getHeaders(true)
        });
      } catch (_) {}
    }
    saveSession(null);
    cloudRevision = 0;
  }

  /* -------------------- QCHINESE ISOLATED TABLES -------------------- */
  async function upsertProfile(sbUser, displayNameOverride = "") {
    if (!isCloudMode() || !sbUser || !sbUser.id || !session || !session.access_token) return;
    try {
      const meta = sbUser.user_metadata || {};
      const res = await fetch(`${config.supabaseUrl}/rest/v1/qchinese_user_profiles?on_conflict=user_id`, {
        method: "POST",
        headers: Object.assign({}, getHeaders(true), { Prefer: "resolution=merge-duplicates,return=minimal" }),
        body: JSON.stringify({
          user_id: sbUser.id,
          display_name: displayNameOverride || meta.display_name || (sbUser.email || "").split("@")[0] || "Học viên",
          email: sbUser.email || "",
          updated_at: new Date().toISOString()
        })
      });
      if (res.status === 404) schemaMissing = true;
    } catch (_) {}
  }

  async function registerCurrentDevice(forceReactivate = false) {
    const uid = session && session.user && session.user.id;
    if (!isCloudMode() || !uid) return { ok: false };
    await ensureValidSession();
    const devId = getDeviceId();
    const meta = detectDeviceMeta();
    try {
      if (!forceReactivate) {
        const chk = await fetch(
          `${config.supabaseUrl}/rest/v1/qchinese_user_devices?user_id=eq.${encodeURIComponent(uid)}&device_id=eq.${encodeURIComponent(devId)}&select=is_revoked`,
          { method: "GET", headers: getHeaders(true) }
        );
        if (chk.status === 404) {
          schemaMissing = true;
          return { ok: false, schemaMissing: true };
        }
        if (chk.ok) {
          const rows = await chk.json().catch(() => []);
          if (Array.isArray(rows) && rows[0] && rows[0].is_revoked === true) {
            return { ok: true, revoked: true };
          }
        }
      }
      const res = await fetch(`${config.supabaseUrl}/rest/v1/qchinese_user_devices?on_conflict=user_id,device_id`, {
        method: "POST",
        headers: Object.assign({}, getHeaders(true), { Prefer: "resolution=merge-duplicates,return=representation" }),
        body: JSON.stringify({
          user_id: uid,
          device_id: devId,
          device_name: meta.deviceName,
          platform: meta.platform,
          user_agent: meta.userAgent,
          is_revoked: false,
          last_seen_at: new Date().toISOString()
        })
      });
      if (res.status === 404) {
        schemaMissing = true;
        return { ok: false, schemaMissing: true };
      }
      schemaMissing = false;
      return { ok: res.ok };
    } catch (_) {
      return { ok: false };
    }
  }

  async function listActiveDevices() {
    const uid = session && session.user && session.user.id;
    const curId = getDeviceId();
    if (!isCloudMode() || !uid) return [];
    await ensureValidSession();
    try {
      const res = await fetch(
        `${config.supabaseUrl}/rest/v1/qchinese_user_devices?user_id=eq.${encodeURIComponent(uid)}&is_revoked=eq.false&order=last_seen_at.desc`,
        { method: "GET", headers: getHeaders(true) }
      );
      if (res.status === 404) {
        schemaMissing = true;
        return [];
      }
      if (!res.ok) return [];
      const rows = await res.json();
      return (Array.isArray(rows) ? rows : []).map((r) => ({
        sessionId: r.device_id,
        deviceName: r.device_name || "Web Browser",
        ipAddress: r.platform || "Cloud",
        createdAt: r.created_at,
        lastActiveAt: r.last_seen_at || r.created_at,
        isCurrent: r.device_id === curId
      }));
    } catch (_) {
      return [];
    }
  }

  async function revokeDevice(targetDeviceId) {
    const uid = session && session.user && session.user.id;
    if (!isCloudMode() || !uid || !targetDeviceId) return { ok: false };
    await ensureValidSession();
    const res = await fetch(
      `${config.supabaseUrl}/rest/v1/qchinese_user_devices?user_id=eq.${encodeURIComponent(uid)}&device_id=eq.${encodeURIComponent(targetDeviceId)}`,
      {
        method: "PATCH",
        headers: Object.assign({}, getHeaders(true), { Prefer: "return=minimal" }),
        body: JSON.stringify({ is_revoked: true, last_seen_at: new Date().toISOString() })
      }
    );
    return { ok: res.ok, revokedCurrent: targetDeviceId === getDeviceId() };
  }

  async function revokeAllDevices(keepCurrent = true) {
    const uid = session && session.user && session.user.id;
    if (!isCloudMode() || !uid) return { ok: false, revokedCount: 0 };
    const list = await listActiveDevices();
    let count = 0;
    for (const d of list) {
      if (keepCurrent && d.isCurrent) continue;
      const r = await revokeDevice(d.sessionId);
      if (r.ok) count += 1;
    }
    return { ok: true, revokedCount: count };
  }

  async function fetchSnapshot() {
    const uid = session && session.user && session.user.id;
    if (!isCloudMode() || !uid) return { ok: false };
    await ensureValidSession();
    try {
      const res = await fetch(
        `${config.supabaseUrl}/rest/v1/qchinese_user_snapshots?user_id=eq.${encodeURIComponent(uid)}&select=*`,
        { method: "GET", headers: getHeaders(true) }
      );
      if (res.status === 404) {
        schemaMissing = true;
        return { ok: false, schemaMissing: true };
      }
      if (!res.ok) return { ok: false, status: res.status };
      schemaMissing = false;
      const rows = await res.json();
      if (Array.isArray(rows) && rows.length > 0) {
        const row = rows[0];
        cloudRevision = Math.max(cloudRevision, Number(row.revision) || 1);
        return { ok: true, state: row.state_json || null, revision: Number(row.revision) || 1, updatedAt: row.updated_at };
      }
      return { ok: true, state: null, revision: 0 };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  }

  async function pushSnapshot(stateObj) {
    const uid = session && session.user && session.user.id;
    if (!isCloudMode() || !uid || !stateObj) return { ok: false };
    await ensureValidSession();
    const nextRev = (cloudRevision || 0) + 1;
    const meta = detectDeviceMeta();
    const res = await fetch(`${config.supabaseUrl}/rest/v1/qchinese_user_snapshots?on_conflict=user_id`, {
      method: "POST",
      headers: Object.assign({}, getHeaders(true), { Prefer: "resolution=merge-duplicates,return=representation" }),
      body: JSON.stringify({
        user_id: uid,
        revision: nextRev,
        device_id: getDeviceId(),
        device_name: meta.deviceName,
        state_json: stateObj,
        updated_at: new Date().toISOString()
      })
    });
    if (res.status === 404) {
      schemaMissing = true;
      return { ok: false, schemaMissing: true };
    }
    if (!res.ok) throw new Error(`Supabase sync HTTP ${res.status}`);
    schemaMissing = false;
    cloudRevision = nextRev;
    return { ok: true, revision: nextRev };
  }

  function mergeStates(localSt, remoteSt) {
    if (!remoteSt) return localSt;
    if (!localSt) return remoteSt;
    const out = Object.assign({}, remoteSt, localSt);

    const lp = localSt.profile || {};
    const rp = remoteSt.profile || {};
    out.profile = Object.assign({}, rp, lp, {
      totalStudyMinutes: Math.max(Number(lp.totalStudyMinutes || 0), Number(rp.totalStudyMinutes || 0)),
      streakDays: Math.max(Number(lp.streakDays || 1), Number(rp.streakDays || 1)),
      unlockedHsk: Math.max(Number(lp.unlockedHsk || 1), Number(rp.unlockedHsk || 1))
    });

    for (const k of ["grammarCompleted", "listeningCompleted", "readingCompleted", "markedWords", "customHanzi", "favoriteVocab"]) {
      const merged = [];
      const seen = new Set();
      for (const item of [...(remoteSt[k] || []), ...(localSt[k] || [])]) {
        const key = typeof item === "string" ? item : JSON.stringify(item);
        if (!seen.has(key)) {
          seen.add(key);
          merged.push(item);
        }
      }
      out[k] = merged;
    }

    const mergeById = (a, b, field = "id") => {
      const map = new Map();
      for (const it of (b || [])) if (it && it[field]) map.set(String(it[field]), it);
      for (const it of (a || [])) if (it && it[field]) map.set(String(it[field]), it);
      return Array.from(map.values());
    };
    out.notebook = mergeById(localSt.notebook, remoteSt.notebook, "id");
    out.materials = mergeById(localSt.materials, remoteSt.materials, "id");
    out.customVocab = mergeById(localSt.customVocab, remoteSt.customVocab, "id");
    out.writingSubmissions = mergeById(localSt.writingSubmissions, remoteSt.writingSubmissions, "id");
    out.testHistory = mergeById(localSt.testHistory, remoteSt.testHistory, "id");

    for (const dk of ["srs", "hanziProgress", "vocabSubSkills", "phoneticErrors", "readingNotes", "lessonProgress", "dailyLogs"]) {
      out[dk] = Object.assign({}, remoteSt[dk] || {}, localSt[dk] || {});
    }
    return out;
  }

  /* -------------------- REAL-TIME WEBSOCKET SYNC (24/7) -------------------- */
  function connectRealtime(onRemoteSnapshot, onRevoked) {
    const uid = session && session.user && session.user.id;
    if (!isCloudMode() || !uid || !session.access_token || typeof WebSocket === "undefined") return;
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    wsManualClose = false;
    const wsBase = config.supabaseUrl.replace(/^http/i, "ws");
    const wsUrl = `${wsBase}/realtime/v1/websocket?apikey=${encodeURIComponent(config.supabaseAnonKey)}&vsn=1.0.0`;

    try {
      const sock = new WebSocket(wsUrl);
      ws = sock;
      const topic = `realtime:public:qchinese_${uid}`;

      sock.onopen = () => {
        wsAttempts = 0;
        realtimeConnected = true;
        sock.send(JSON.stringify({
          topic,
          event: "phx_join",
          payload: {
            config: {
              broadcast: { self: false },
              presence: { key: getDeviceId() },
              postgres_changes: [
                { event: "*", schema: "public", table: "qchinese_user_snapshots", filter: `user_id=eq.${uid}` },
                { event: "*", schema: "public", table: "qchinese_user_devices", filter: `user_id=eq.${uid}` }
              ]
            },
            access_token: session.access_token
          },
          ref: String(++wsRef)
        }));

        clearInterval(wsHeartbeat);
        wsHeartbeat = setInterval(() => {
          if (sock.readyState === WebSocket.OPEN) {
            sock.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(++wsRef) }));
          }
        }, 25000);
      };

      sock.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (!msg || msg.event !== "postgres_changes") return;
          const data = msg.payload && msg.payload.data;
          if (!data) return;
          const rec = data.record || data.new;
          if (!rec) return;

          if (data.table === "qchinese_user_devices") {
            if (rec.device_id === getDeviceId() && rec.is_revoked === true && typeof onRevoked === "function") {
              onRevoked();
            }
            return;
          }
          if (data.table === "qchinese_user_snapshots") {
            if (rec.device_id === getDeviceId()) return;
            const rev = Number(rec.revision) || 1;
            if (rev > cloudRevision && rec.state_json) {
              cloudRevision = rev;
              if (typeof onRemoteSnapshot === "function") onRemoteSnapshot(rec.state_json, rev);
            }
          }
        } catch (_) {}
      };

      sock.onclose = () => {
        clearInterval(wsHeartbeat);
        wsHeartbeat = null;
        realtimeConnected = false;
        if (!wsManualClose && session && session.user && session.user.id === uid) {
          const delay = Math.min(20000, 1500 * Math.pow(2, wsAttempts++));
          clearTimeout(wsReconnect);
          wsReconnect = setTimeout(() => {
            if (navigator.onLine) connectRealtime(onRemoteSnapshot, onRevoked);
          }, delay);
        }
      };

      sock.onerror = () => {
        try { sock.close(); } catch (_) {}
      };

      clearInterval(fallbackPoll);
      fallbackPoll = setInterval(async () => {
        if (document.hidden || !navigator.onLine || !session || !session.user) return;
        const snap = await fetchSnapshot();
        if (snap.ok && snap.state && snap.revision > cloudRevision && typeof onRemoteSnapshot === "function") {
          cloudRevision = snap.revision;
          onRemoteSnapshot(snap.state, snap.revision);
        }
      }, 30000);
    } catch (_) {}
  }

  function disconnectRealtime() {
    wsManualClose = true;
    clearInterval(wsHeartbeat);
    clearTimeout(wsReconnect);
    clearInterval(fallbackPoll);
    wsHeartbeat = null;
    wsReconnect = null;
    fallbackPoll = null;
    realtimeConnected = false;
    if (ws) {
      try { ws.close(); } catch (_) {}
      ws = null;
    }
  }

  return {
    initConfig,
    isCloudMode,
    getConfig: () => config,
    getDeviceId,
    isRealtimeConnected: () => realtimeConnected,
    isSchemaMissing: () => schemaMissing,
    hasRecoveryToken: () => Boolean(recoveryAccessToken),
    restoreSession,
    signUp,
    signIn,
    sendPasswordReset,
    updatePasswordWithRecovery,
    updateAccountProfile,
    signOut,
    registerCurrentDevice,
    listActiveDevices,
    revokeDevice,
    revokeAllDevices,
    fetchSnapshot,
    pushSnapshot,
    mergeStates,
    connectRealtime,
    disconnectRealtime
  };
})();

  <script data-bundle="js/core.js">
/* -*- coding: utf-8 -*-
 * QChinese – Core Engine: Multi-User Auth, Synced State, Putonghua Audio, Voice Recorder, SRS (SM-2) & Utilities
 */

window.QCore = (function () {
  let currentUser = null;
  let appState = null;
  let stateVersion = 1;
  let syncSource = null;
  let syncConnected = false;
  let syncTimer = null;
  let activeAudio = null;
  let studyInterval = null;
  let serverHealth = { ok: false, aiConfigured: false, aiProvider: "pedagogical-engine" };

  function todayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function createDefaultState(name = "Học viên") {
    const today = todayStr();
    return {
      version: 1,
      profile: {
        name: name,
        levelLabel: "Người mới bắt đầu",
        hskLevel: 1,
        unlockedHsk: 1,
        placementCompleted: false,
        lastTestScore: null,
        streakDays: 1,
        lastActiveDate: today,
        totalStudyMinutes: 0,
        theme: "light",
        uiLang: "en",
        showVietnameseHint: true,
        showPinyinDefault: true,
        enablePinyinIme: true,
        vocabVersion: "hsk2",
        audioSpeed: 1.0,
        dailyGoalMinutes: 30,
        dailyTargets: {
          newWords: 10,
          reviewWords: 15,
          grammarCount: 2,
          listeningCount: 1,
          hanziWriteCount: 5,
          speakingMinutes: 5
        }
      },
      srs: {},
      hanziProgress: {},
      grammarCompleted: [],
      listeningCompleted: [],
      readingCompleted: [],
      readingNotes: {},
      markedWords: [],
      customHanzi: [],
      favoriteVocab: [],
      customVocab: [],
      vocabSubSkills: {},
      phoneticErrors: {},
      pronunciationSessions: 0,
      materials: [],
      lessonProgress: {},
      aiHistory: [],
      writingSubmissions: [],
      speakingSessions: 0,
      skillScores: {
        pinyin: 0,
        vocab: 0,
        hanzi: 0,
        grammar: 0,
        listening: 0,
        speaking: 0,
        reading: 0,
        writing: 0
      },
      placementReport: null,
      testHistory: [],
      notebook: [],
      dailyLogs: {
        [today]: {
          minutes: 0,
          newWords: 0,
          reviewWords: 0,
          grammarCount: 0,
          listeningCount: 0,
          hanziWriteCount: 0,
          speakingMinutes: 0
        }
      }
    };
  }

  function ensureStateIntegrity(st, fallbackName) {
    const def = createDefaultState(fallbackName);
    if (!st || typeof st !== "object") return def;
    st.profile = Object.assign({}, def.profile, st.profile || {});
    st.profile.dailyTargets = Object.assign({}, def.profile.dailyTargets, (st.profile && st.profile.dailyTargets) || {});
    st.srs = st.srs || {};
    st.hanziProgress = st.hanziProgress || {};
    st.grammarCompleted = Array.isArray(st.grammarCompleted) ? st.grammarCompleted : [];
    st.listeningCompleted = Array.isArray(st.listeningCompleted) ? st.listeningCompleted : [];
    st.readingCompleted = Array.isArray(st.readingCompleted) ? st.readingCompleted : [];
    st.readingNotes = st.readingNotes || {};
    st.markedWords = Array.isArray(st.markedWords) ? st.markedWords : [];
    st.customHanzi = Array.isArray(st.customHanzi) ? st.customHanzi : [];
    st.favoriteVocab = Array.isArray(st.favoriteVocab) ? st.favoriteVocab : [];
    st.customVocab = Array.isArray(st.customVocab) ? st.customVocab : [];
    st.vocabSubSkills = st.vocabSubSkills && typeof st.vocabSubSkills === "object" ? st.vocabSubSkills : {};
    st.phoneticErrors = st.phoneticErrors && typeof st.phoneticErrors === "object" ? st.phoneticErrors : {};
    st.pronunciationSessions = Number(st.pronunciationSessions || 0);
    st.materials = Array.isArray(st.materials) ? st.materials : [];
    st.lessonProgress = st.lessonProgress && typeof st.lessonProgress === "object" ? st.lessonProgress : {};
    st.aiHistory = Array.isArray(st.aiHistory) ? st.aiHistory : [];
    st.writingSubmissions = Array.isArray(st.writingSubmissions) ? st.writingSubmissions : [];
    st.skillScores = Object.assign({}, def.skillScores, st.skillScores || {});
    st.testHistory = Array.isArray(st.testHistory) ? st.testHistory : [];
    st.notebook = Array.isArray(st.notebook) ? st.notebook : [];
    st.dailyLogs = st.dailyLogs || {};

    const today = todayStr();
    if (!st.dailyLogs[today]) {
      st.dailyLogs[today] = {
        minutes: 0,
        newWords: 0,
        reviewWords: 0,
        grammarCount: 0,
        listeningCount: 0,
        hanziWriteCount: 0,
        speakingMinutes: 0
      };
    }

    // Update streak accurately by calendar days
    if (st.profile.lastActiveDate && st.profile.lastActiveDate !== today) {
      const prev = new Date(st.profile.lastActiveDate + "T00:00:00");
      const curr = new Date(today + "T00:00:00");
      const diffDays = Math.round((curr - prev) / 86400000);
      if (diffDays === 1) {
        st.profile.streakDays = (st.profile.streakDays || 1) + 1;
      } else if (diffDays > 1) {
        st.profile.streakDays = 1;
      }
      st.profile.lastActiveDate = today;
    } else if (!st.profile.lastActiveDate) {
      st.profile.lastActiveDate = today;
    }

    return st;
  }

  function getAuthToken() {
    return localStorage.getItem("qchinese_auth_token") || "";
  }

  function setAuthToken(tok) {
    if (tok) localStorage.setItem("qchinese_auth_token", tok);
    else localStorage.removeItem("qchinese_auth_token");
  }

  const DEFAULT_CLOUD_API_BASE = "https://q-chinese.vercel.app";
  let autoCloudBase = "";

  function getApiBase() {
    const custom = (localStorage.getItem("qchinese_api_base") || "").trim().replace(/\/+$/, "");
    if (custom) return custom;
    if (autoCloudBase) return autoCloudBase;
    const host = (typeof window !== "undefined" && window.location && window.location.hostname) || "";
    const isStatic = typeof window !== "undefined" && (window.location.protocol === "file:" || /github\.io$/i.test(host));
    return isStatic ? DEFAULT_CLOUD_API_BASE : "";
  }

  function setApiBase(url) {
    const clean = String(url || "").trim().replace(/\/+$/, "");
    if (clean) localStorage.setItem("qchinese_api_base", clean);
    else localStorage.removeItem("qchinese_api_base");
  }

  function resolveApiUrl(url) {
    const base = getApiBase();
    const rel = String(url).replace(/^\//, "");
    return base ? `${base}/${rel}` : `/${rel}`;
  }

  async function apiFetch(url, options = {}) {
    const headers = Object.assign({}, options.headers || {});
    const tok = getAuthToken();
    if (tok) headers["Authorization"] = `Bearer ${tok}`;
    if (options.body && typeof options.body === "object" && !(options.body instanceof FormData)) {
      headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(options.body);
    }
    options.headers = headers;
    if (!serverHealth.ok && /^\/?api\/(ai|user|tournament|materials|sync|pdf|system)\//.test(String(url))) {
      throw new Error("Tính năng này cần kết nối Backend Server 24/7 (python server.py hoặc URL Render trong Cài đặt).");
    }
    const res = await fetch(resolveApiUrl(url), options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || `Lỗi kết nối (${res.status})`);
    }
    return data;
  }

  function localUserKey(username) {
    return `qchinese_local_state_${String(username || "guest").toLowerCase()}`;
  }

  function offlineQueueKey(username) {
    return `qchinese_offline_sync_${String(username || "guest").toLowerCase()}`;
  }

  function isCloudAuthMode() {
    return Boolean(window.QCloud && QCloud.isCloudMode());
  }

  function disconnectRealtimeSync() {
    if (window.QCloud) QCloud.disconnectRealtime();
    if (syncSource) {
      try { syncSource.close(); } catch (_) {}
      syncSource = null;
    }
    syncConnected = false;
  }

  function applyRemoteState(remoteState, remoteVersion, notify = true) {
    if (!currentUser || !remoteState) return;
    if (remoteVersion && remoteVersion <= stateVersion) return;
    stateVersion = remoteVersion || stateVersion + 1;
    const merged = (window.QCloud && appState) ? QCloud.mergeStates(appState, remoteState) : remoteState;
    appState = ensureStateIntegrity(merged, currentUser.displayName);
    localStorage.setItem(localUserKey(currentUser.username), JSON.stringify(appState));
    applyTheme(appState.profile.theme);
    if (window.QApp && typeof window.QApp.refreshTopbar === "function") {
      window.QApp.refreshTopbar();
    }
    // Live UI refresh without reload (skip disrupting active typing in input/textarea)
    const activeTag = document.activeElement && document.activeElement.tagName;
    if (window.QApp && typeof window.QApp.refreshCurrentView === "function" && activeTag !== "INPUT" && activeTag !== "TEXTAREA") {
      window.QApp.refreshCurrentView();
    }
    if (notify) {
      showToast("🔄 Đã đồng bộ dữ liệu mới nhất từ thiết bị khác!");
    }
  }

  async function pullLatestState() {
    if (!currentUser) return;
    if (isCloudAuthMode()) {
      try {
        const snap = await QCloud.fetchSnapshot();
        if (snap.ok && snap.state && (snap.revision || 0) > stateVersion) {
          applyRemoteState(snap.state, snap.revision, false);
        }
      } catch (_) {}
      return;
    }
    if (!serverHealth.ok || !getAuthToken()) return;
    try {
      const res = await apiFetch("/api/user/state");
      if (res && res.state && (res.version || 0) > stateVersion) {
        applyRemoteState(res.state, res.version, false);
      }
    } catch (_) {}
  }

  async function flushOfflineQueue() {
    if (!currentUser || !navigator.onLine) return;
    const qKey = offlineQueueKey(currentUser.username);
    const pending = JSON.parse(localStorage.getItem(qKey) || "null");
    if (!pending || !pending.state) return;
    if (isCloudAuthMode()) {
      try {
        const res = await QCloud.pushSnapshot(pending.state);
        if (res.ok) {
          localStorage.removeItem(qKey);
          if (res.revision) stateVersion = res.revision;
          showToast("☁️ Đã đồng bộ thay đổi offline lên Supabase Cloud!");
        }
      } catch (_) {}
      return;
    }
    if (!serverHealth.ok) return;
    try {
      const res = await apiFetch("/api/user/state", {
        method: "POST",
        body: { state: pending.state, baseVersion: pending.baseVersion, clientMutationId: pending.mutationId }
      });
      localStorage.removeItem(qKey);
      if (res.version) stateVersion = res.version;
      if (res.merged && res.state) {
        applyRemoteState(res.state, res.version, false);
      }
      showToast("☁️ Đã đồng bộ các thay đổi offline lên Cloud!");
    } catch (_) {}
  }

  function connectRealtimeSync() {
    disconnectRealtimeSync();
    if (!currentUser) return;
    if (isCloudAuthMode()) {
      QCloud.connectRealtime(
        (remoteState, rev) => applyRemoteState(remoteState, rev, true),
        async () => {
          showToast("⚠️ Thiết bị này đã được đăng xuất từ thiết bị khác.");
          await logoutAccount(true);
          if (window.QApp && typeof window.QApp.showAuthGate === "function") {
            window.QApp.showAuthGate();
          }
        }
      );
      syncConnected = true;
      return;
    }
    if (!serverHealth.ok || !window.EventSource) return;
    const tok = getAuthToken();
    if (!tok) return;
    const url = resolveApiUrl(`api/sync/stream?token=${encodeURIComponent(tok)}`);
    try {
      syncSource = new EventSource(url);
      syncSource.addEventListener("connected", () => {
        syncConnected = true;
        flushOfflineQueue();
      });
      syncSource.addEventListener("state_update", (ev) => {
        try {
          const payload = JSON.parse(ev.data || "{}");
          if (payload.originSessionId && currentUser && payload.originSessionId === currentUser.sessionId) {
            if (payload.version && payload.version > stateVersion) stateVersion = payload.version;
            return;
          }
          if (payload.state) {
            applyRemoteState(payload.state, payload.version, true);
          }
        } catch (_) {}
      });
      syncSource.onerror = () => {
        syncConnected = false;
      };
    } catch (_) {}
  }

  if (typeof window !== "undefined") {
    window.addEventListener("online", () => {
      flushOfflineQueue();
      pullLatestState();
      connectRealtimeSync();
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && currentUser && (serverHealth.ok || isCloudAuthMode())) {
        flushOfflineQueue();
        pullLatestState();
      }
    });
  }

  async function hydrateCloudWorkspace(userObj, forceReactivateDevice = false) {
    currentUser = userObj;
    const devRes = await QCloud.registerCurrentDevice(forceReactivateDevice);
    if (devRes && devRes.revoked) {
      await QCloud.signOut(true);
      currentUser = null;
      return { authenticated: false, error: "Phiên thiết bị này đã bị đăng xuất từ xa. Vui lòng đăng nhập lại." };
    }
    const localRaw = JSON.parse(localStorage.getItem(localUserKey(userObj.username)) || "null");
    const snap = await QCloud.fetchSnapshot();
    let baseState = null;
    if (snap.ok && snap.state) {
      stateVersion = snap.revision || 1;
      baseState = localRaw ? QCloud.mergeStates(localRaw, snap.state) : snap.state;
    } else {
      stateVersion = 1;
      baseState = localRaw || createDefaultState(userObj.displayName);
    }
    appState = ensureStateIntegrity(baseState, userObj.displayName);
    if (userObj.displayName && (!appState.profile.name || appState.profile.name === "Học viên")) {
      appState.profile.name = userObj.displayName;
    }
    localStorage.setItem(localUserKey(userObj.username), JSON.stringify(appState));
    applyTheme(appState.profile.theme);
    startStudyTimer();
    connectRealtimeSync();
    if (snap.ok && !snap.state) {
      QCloud.pushSnapshot(appState).catch(() => {});
    }
    return { authenticated: true, user: currentUser };
  }

  async function initSession() {
    if (window.QCloud) {
      await QCloud.initConfig(getApiBase());
    }
    try {
      serverHealth = await apiFetch("/api/health");
    } catch (_) {
      // Auto-fallback to 24/7 Vercel Cloud Backend if opened on a static host/dev server without Python backend
      if (getApiBase() !== DEFAULT_CLOUD_API_BASE) {
        autoCloudBase = DEFAULT_CLOUD_API_BASE;
        if (window.QCloud && !QCloud.isCloudMode()) {
          await QCloud.initConfig(DEFAULT_CLOUD_API_BASE);
        }
        try {
          serverHealth = await apiFetch("/api/health");
        } catch (__) {
          serverHealth = { ok: false, aiConfigured: false, aiProvider: "local-offline" };
        }
      } else {
        serverHealth = { ok: false, aiConfigured: false, aiProvider: "local-offline" };
      }
    }

    if (isCloudAuthMode()) {
      const res = await QCloud.restoreSession();
      if (res.recoveryMode) {
        return { authenticated: false, recoveryMode: true };
      }
      if (res.restored && res.user) {
        return await hydrateCloudWorkspace(res.user, false);
      }
      return { authenticated: false, error: res.error || "" };
    }

    if (serverHealth.ok) {
      try {
        const me = await apiFetch("/api/auth/me");
        if (me.authenticated && me.user) {
          currentUser = me.user;
          stateVersion = me.version || 1;
          appState = ensureStateIntegrity(me.state, me.user.displayName);
          applyTheme(appState.profile.theme);
          startStudyTimer();
          connectRealtimeSync();
          return { authenticated: true, user: currentUser };
        }
        return { authenticated: false };
      } catch (_) {
        return { authenticated: false };
      }
    } else {
      // Pure static deployment fallback (e.g., GitHub Pages) with multi-account local storage
      const savedUser = JSON.parse(localStorage.getItem("qchinese_static_active_user") || "null");
      if (savedUser && savedUser.username) {
        currentUser = savedUser;
        const raw = JSON.parse(localStorage.getItem(localUserKey(savedUser.username)) || "null");
        appState = ensureStateIntegrity(raw, savedUser.displayName);
        applyTheme(appState.profile.theme);
        startStudyTimer();
        return { authenticated: true, user: currentUser };
      }
      return { authenticated: false };
    }
  }

      setAuthToken(res.token);
      currentUser = res.user;
      if (res.recoveryKey) currentUser.recoveryKey = res.recoveryKey;

      localStorage.setItem(localUserKey(username), JSON.stringify(appState));
      applyTheme(appState.profile.theme);
      startStudyTimer();
      connectRealtimeSync();
      return res.user;
    } else {
      // Static fallback multi-account registry

      localStorage.setItem("qchinese_static_accounts", JSON.stringify(accounts));
      currentUser = { username: username.trim(), displayName: displayName || username.trim() };
      localStorage.setItem("qchinese_static_active_user", JSON.stringify(currentUser));

  function saveState(immediate = false) {
    if (!appState || !currentUser) return;
    localStorage.setItem(localUserKey(currentUser.username), JSON.stringify(appState));
    if (window.QApp && typeof window.QApp.refreshTopbar === "function") {
      window.QApp.refreshTopbar();
    }
    if (!isCloudAuthMode() && !serverHealth.ok) return;

    if (syncTimer) clearTimeout(syncTimer);
    const mutationId = "mut_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
    const qKey = offlineQueueKey(currentUser.username);
    const pushFn = async () => {
      if (isCloudAuthMode()) {
        try {
          const res = await QCloud.pushSnapshot(appState);
          if (res.ok) {
            localStorage.removeItem(qKey);
            if (res.revision) stateVersion = res.revision;
          }
        } catch (e) {
          localStorage.setItem(qKey, JSON.stringify({ state: appState, baseVersion: stateVersion, mutationId, savedAt: Date.now() }));
          console.warn("Cloud offline sync queued:", e.message);
        }
        return;
      }
      try {
        const res = await apiFetch("/api/user/state", {
          method: "POST",
          body: { state: appState, baseVersion: stateVersion, clientMutationId: mutationId }
        });
        localStorage.removeItem(qKey);
        if (res && res.version) stateVersion = res.version;
        if (res && res.merged && res.state) {
          appState = ensureStateIntegrity(res.state, currentUser.displayName);
          localStorage.setItem(localUserKey(currentUser.username), JSON.stringify(appState));
        }
      } catch (e) {
        // Queue for automatic sync once network returns (offline resilience)
        localStorage.setItem(qKey, JSON.stringify({ state: appState, baseVersion: stateVersion, mutationId, savedAt: Date.now() }));
        console.warn("Offline sync queued:", e.message);
      }
    };
    if (immediate) pushFn();
    else syncTimer = setTimeout(pushFn, 450);
  }

  /* Spaced Repetition System (SM-2) for Vocabulary */
  function reviewWordSRS(wordId, quality /* 1: Quên, 3: Khó, 4: Nhớ, 5: Rất chắc */) {
    if (!appState) return;
    const now = Date.now();
    const isNew = !appState.srs[wordId];
    const card = appState.srs[wordId] || {
      ease: 2.5,
      intervalDays: 0,
      reps: 0,
      lapses: 0,
      nextReview: now,
      lastQuality: 0
    };

    if (quality < 3) {
      card.reps = 0;
      card.intervalDays = 0.01; // Show again soon in session (~15 mins)
      card.lapses += 1;
    } else {
      if (card.reps === 0) card.intervalDays = 1;
      else if (card.reps === 1) card.intervalDays = 3;
      else card.intervalDays = Math.round(card.intervalDays * card.ease);
      card.reps += 1;
    }

    card.ease = Math.max(1.3, card.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
    card.lastQuality = quality;
    card.nextReview = now + card.intervalDays * 86400000;
    appState.srs[wordId] = card;

    if (isNew) logDailyActivity("newWords", 1);
    else logDailyActivity("reviewWords", 1);

    const learnedIds = Object.keys(appState.srs);
    const masteredCount = learnedIds.filter((id) => appState.srs[id].lastQuality >= 3).length;
    const ratio = learnedIds.length ? Math.round((masteredCount / learnedIds.length) * 100) : 0;
    appState.skillScores.vocab = Math.max(appState.skillScores.vocab || 0, ratio);
    saveState(false);
    return card;
  }

    prev.bestScore = Math.max(prev.bestScore || 0, s);

    prev.updatedAt = new Date().toISOString();
    prev.history = Array.isArray(prev.history) ? prev.history : [];
    prev.history.unshift({ date: prev.updatedAt, score: s, wrongFocuses });
    if (prev.history.length > 10) prev.history = prev.history.slice(0, 10);
    appState.lessonProgress[exId] = prev;
    saveState(true);
    return prev;
  }

  /* Mandarin Putonghua Audio Synthesis (Server Cached MP3 + Web Speech zh-CN Fallback) */
  function speakChinese(text, opts = {}) {
    if (!text) return;
    const cleanText = String(text).trim();
    if (!cleanText) return;

    const baseRate = appState ? appState.profile.audioSpeed || 1.0 : 1.0;
    const rate = opts.rate || (opts.slow ? 0.65 : baseRate);
    const slowFlag = opts.slow || rate <= 0.7 ? "1" : "0";

    if (activeAudio) {
      try { activeAudio.pause(); } catch (_) {}
      activeAudio = null;
    }
    if (window.speechSynthesis) {
      try { window.speechSynthesis.cancel(); } catch (_) {}
    }

    const fallbackWebSpeech = () => {
      if (!window.speechSynthesis) {
        showToast("Trình duyệt không hỗ trợ phát âm thanh.");
        return;
      }
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = "zh-CN";
      utter.rate = Math.max(0.45, Math.min(1.4, rate));
      const voices = window.speechSynthesis.getVoices() || [];
      const zhVoice =
        voices.find((v) => v.lang === "zh-CN" && /Xiaoxiao|Yunxi|Huihui|Kangkang|Google|Putonghua/i.test(v.name)) ||
        voices.find((v) => /^zh(-|_)?CN/i.test(v.lang)) ||
        voices.find((v) => /^zh/i.test(v.lang));
      if (zhVoice) utter.voice = zhVoice;
      if (opts.onEnd) utter.onend = opts.onEnd;
      window.speechSynthesis.speak(utter);
    };

    if (serverHealth.ok) {
      const audio = new Audio(`api/tts?text=${encodeURIComponent(cleanText)}&slow=${slowFlag}`);
      audio.playbackRate = slowFlag === "1" ? 0.92 : Math.max(0.5, Math.min(1.4, rate));
      activeAudio = audio;
      audio.onended = () => {
        if (opts.onEnd) opts.onEnd();
      };
      audio.onerror = () => fallbackWebSpeech();
      audio.play().catch(() => fallbackWebSpeech());
    } else {
      fallbackWebSpeech();
    }
  }

  /* Voice Recording + Speech Recognition (zh-CN) for Tone & Speaking Comparison */
  async function captureLearnerVoice({ durationMs = 4000, onTranscript, onAudioReady, onStatus } = {}) {
    let recognition = null;
    let transcript = "";
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRec) {
      recognition = new SpeechRec();
      recognition.lang = "zh-CN";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.onresult = (ev) => {
        if (ev.results && ev.results[0] && ev.results[0][0]) {
          transcript = ev.results[0][0].transcript;
          if (onTranscript) onTranscript(transcript, ev.results[0][0].confidence || 0.8);
        }
      };
      recognition.onerror = () => {};
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const recorder = new MediaRecorder(stream);
      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };
      recorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        if (recognition) {
          try { recognition.stop(); } catch (_) {}
        }
        const blob = new Blob(chunks, { type: "audio/webm" });
        const url = URL.createObjectURL(blob);
        if (onAudioReady) onAudioReady(url, transcript);
        if (onStatus) onStatus("idle");
      };

      if (onStatus) onStatus("recording");
      if (recognition) {
        try { recognition.start(); } catch (_) {}
      }
      recorder.start();
      setTimeout(() => {
        if (recorder.state === "recording") recorder.stop();
      }, durationMs);

      return () => {
        if (recorder.state === "recording") recorder.stop();
      };
    } catch (err) {
      if (onStatus) onStatus("error");
      showToast("Không thể mở Microphone. Vui lòng cấp quyền Micro trên trình duyệt nhé!");
      return null;
    }
  }

  /* Resolve Deep Character Detail (15 fields) for ANY Simplified Chinese Character */
  function resolveHanziDetail(char) {
    const clean = String(char || "").trim().charAt(0);
    const curated = (window.QCHINESE_HANZI_LIST || []).find((h) => h.hanzi === clean);
    if (curated) return curated;

    // Synthesize rich character profile from vocabulary & IME dictionary
    const matchingVocab = (window.QCHINESE_VOCAB || []).filter((v) => v.hanzi.includes(clean));
    const exactVocab = matchingVocab.find((v) => v.hanzi === clean);
    const imeMatch = (window.PINYIN_IME_EXTRAS || []).find((x) => x.hanzi === clean);

    const py = exactVocab ? exactVocab.pinyin : imeMatch ? imeMatch.pinyin : (matchingVocab[0] ? matchingVocab[0].pinyin : "");
    const pyNum = exactVocab ? exactVocab.pinyin_number : py;
    const viMean = exactVocab
      ? exactVocab.meanings.vietnamese.join("; ")
      : imeMatch
      ? imeMatch.vi
      : matchingVocab.length
      ? `Xuất hiện trong từ: ${matchingVocab.map((m) => `${m.hanzi} (${m.meanings.vietnamese[0]})`).join(", ")}`
      : "Chữ Hán Giản thể thông dụng (bấm nghe phát âm & xem hoạt ảnh thứ tự nét chuẩn bên cạnh).";

    const enMean = exactVocab
      ? exactVocab.meanings.english.join("; ")
      : matchingVocab.length
      ? `Used in: ${matchingVocab.map((m) => `${m.hanzi} (${m.meanings.english[0]})`).join(", ")}`
      : "Standard Simplified Chinese character.";

    return {
      hanzi: clean,
      hsk_level: exactVocab ? exactVocab.hsk_level : (matchingVocab[0] ? matchingVocab[0].hsk_level : 1),
      pinyin: py || "Tra âm trực tiếp",
      pinyin_number: pyNum || "",
      vietnamese_hint: exactVocab ? exactVocab.vietnamese_pronunciation_hint : "Ưu tiên bấm nút Loa để nghe chuẩn âm tiếng Trung phổ thông.",
      part_of_speech: exactVocab ? exactVocab.part_of_speech : "汉字 · Chữ Hán Giản thể",
      meanings: {
        chinese: exactVocab ? exactVocab.meanings.chinese[0] : `现代汉语常用简体字“${clean}”。`,
        english: enMean,
        vietnamese: viMean
      },
      radical: "Xem phần nét màu xanh ngọc (Bộ thủ) trên khung phân tích nét",
      decomposition: "Chữ Hán Giản thể chuẩn — hệ thống tải dữ liệu nét chuẩn xác từ Make Me a Hanzi.",
      stroke_count: exactVocab ? exactVocab.stroke_count : null,
      stroke_names: [],
      compounds: matchingVocab.slice(0, 4).map((m) => ({
        word: m.hanzi,
        pinyin: m.pinyin,
        vi: m.meanings.vietnamese[0],
        en: m.meanings.english[0]
      })),
      examples: exactVocab
        ? exactVocab.examples
        : matchingVocab[0]
        ? matchingVocab[0].examples
        : [{ chinese: clean, pinyin: py, english: enMean, vietnamese: viMean }],
      common_mistakes: "Chú ý viết đúng quy tắc bút thuận cơ bản: Ngang trước sổ sau, phẩy trước mác sau, từ trên xuống dưới, từ trái sang phải, vào nhà trước đóng cửa sau."
    };
  }

  /* Fetch Verified Stroke Data (Make Me a Hanzi) */
  const strokeMemCache = {};
  async function fetchStrokeData(char) {
    if (strokeMemCache[char]) return strokeMemCache[char];
    const urls = serverHealth.ok
      ? [`api/strokes?char=${encodeURIComponent(char)}`, `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${encodeURIComponent(char)}.json`]
      : [`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${encodeURIComponent(char)}.json`];

    for (const u of urls) {
      try {
        const r = await fetch(u);
        if (r.ok) {
          const data = await r.json();
          if (data && Array.isArray(data.strokes)) {
            strokeMemCache[char] = data;
            return data;
          }
        }
      } catch (_) {}
    }
    return null;
  }

  function getUiLang() {
    const saved = localStorage.getItem("qchinese_ui_lang");
    if (saved === "en" || saved === "vi") return saved;
    if (appState && appState.profile && (appState.profile.uiLang === "en" || appState.profile.uiLang === "vi")) {
      return appState.profile.uiLang;
    }
    return "en";
  }

  function setUiLang(lang) {
    const clean = lang === "vi" ? "vi" : "en";
    localStorage.setItem("qchinese_ui_lang", clean);
    if (appState && appState.profile) {
      appState.profile.uiLang = clean;
      saveState(false);
    }
    return clean;
  }

  function toggleUiLang() {
    return setUiLang(getUiLang() === "en" ? "vi" : "en");
  }

  function applyTheme(theme) {
    const t = theme === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    if (appState) appState.profile.theme = t;
  }

  function toggleTheme() {
    const curr = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(curr);
    saveState(false);
    return curr;
  }

  function showToast(msg) {
    let stack = document.getElementById("toast-stack");
    if (!stack) {
      stack = document.createElement("div");
      stack.id = "toast-stack";
      stack.className = "toast-stack";
      document.body.appendChild(stack);
    }
    const item = document.createElement("div");
    item.className = "toast-item";
    item.textContent = msg;
    stack.appendChild(item);
    setTimeout(() => {
      item.style.opacity = "0";
      setTimeout(() => item.remove(), 220);
    }, 3200);
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  return {
    todayStr,
    initSession,
    isCloudAuthMode,
    registerAccount,
    loginAccount,
    logoutAccount,
    listDeviceSessions,
    revokeDeviceSession,
    revokeAllDeviceSessions,
    updateUserProfile,
    apiFetch,
    getApiBase,
    setApiBase,
    resolveApiUrl,
    getAuthToken,
    getUser: () => currentUser,
    getState: () => appState,
    setState: (st) => { appState = ensureStateIntegrity(st, currentUser ? currentUser.displayName : "Học viên"); saveState(true); },
    getServerHealth: () => serverHealth,
    saveState,
    logDailyActivity,
    updateSkillScore,
    reviewWordSRS,
    recordVocabSubSkill,
    toggleFavoriteVocab,
    addCustomVocab,
    recordPhoneticAttempt,
    addMaterial,
    updateMaterial,
    deleteMaterial,
    recordMaterialPractice,
    recordLessonExercise,
    logAiHistory,
    recordHanziPractice,
    addToNotebook,
    speakChinese,
    captureLearnerVoice,
    resolveHanziDetail,
    fetchStrokeData,
    getUiLang,
    setUiLang,
    toggleUiLang,
    applyTheme,
    toggleTheme,
    showToast,
    escapeHtml
  };
})();
