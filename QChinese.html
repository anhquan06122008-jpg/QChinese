        <div class="hanzi-calligraphy" style="font-size:66px;line-height:1.15;">${QCore.escapeHtml(w.hanzi)}</div>
        <div class="pinyin-text" style="font-size:24px;font-weight:700;color:var(--primary);margin:6px 0;">${QCore.escapeHtml(w.pinyin)}</div>
        <div style="font-size:15px;color:var(--text-secondary);margin-bottom:14px;">${QCore.escapeHtml(getPrimaryVi(w))}</div>
      `;
      bodyHTML = `
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
          <button class="btn btn-outline" id="ex-speak">🔊 Nghe mẫu</button>
          <button class="btn btn-outline" id="ex-slow">🐢 Nghe chậm</button>
          <button class="btn btn-primary" id="ex-rec">🎙️ Ghi âm giọng đọc (3.5s)</button>
        </div>
        <div id="ex-rec-out" class="card-subtle" style="text-align:left;font-size:13.5px;color:var(--text-secondary);">
          Bấm "Ghi âm giọng đọc", đọc rõ <strong>${QCore.escapeHtml(w.pinyin)}</strong>. Hệ thống sẽ ghi lại audio để bạn nghe đối chiếu và dùng nhận diện giọng nói <code>zh-CN</code> (lưu ý: trình duyệt không đo chính xác cao độ từng thanh điệu, hãy luôn đối chiếu bằng tai với âm mẫu).
        </div>
      `;

      promptHTML = `
        <div style="margin-bottom:12px;">
          <span class="badge badge-jade">Từ mục tiêu</span>
          <div class="hanzi-text" style="font-size:44px;font-weight:700;margin:6px 0;">${QCore.escapeHtml(w.hanzi)} <span class="pinyin-text" style="font-size:20px;color:var(--primary);">${QCore.escapeHtml(w.pinyin)}</span></div>
          <div style="font-size:14.5px;color:var(--text-secondary);">${QCore.escapeHtml(getPrimaryVi(w))}</div>
        </div>
      `;
      bodyHTML = `
        <div style="text-align:left;">
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Đặt 1 câu tiếng Trung Giản thể có chứa từ <strong>${QCore.escapeHtml(w.hanzi)}</strong>:</label>
          <textarea class="textarea-field hanzi-text" id="ex-sent-inp" rows="3" data-pinyin-ime="true" placeholder="Ví dụ gõ Pinyin rồi chọn chữ Hán..."></textarea>
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-primary" id="ex-sent-check">👩‍🏫 Chấm câu với AI Tutor</button>
            <button class="btn btn-outline" id="ex-sent-explain">🤖 Xem cách dùng từ này</button>
          </div>
        </div>
      `;
    }

    stage.innerHTML = `
      <div class="card" style="max-width:740px;margin:0 auto;padding:28px;text-align:center;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <span class="badge badge-jade">Câu ${currentIdx + 1} / ${list.length}</span>
          <span class="badge badge-blue">HSK ${w.hsk_level === 7 ? "7–9" : w.hsk_level}</span>
        </div>
        ${promptHTML}
        ${bodyHTML}
        <div id="ex-feedback" style="margin-top:16px;text-align:left;"></div>
        <div style="display:flex;justify-content:space-between;margin-top:18px;padding-top:12px;border-top:1px solid var(--border-color);">
          <button class="btn btn-outline btn-sm" id="ex-prev">← Từ trước</button>
          <button class="btn btn-primary btn-sm" id="ex-next">Từ tiếp theo →</button>
        </div>
      </div>
    `;

    const speakBtn = stage.querySelector("#ex-speak");
    if (speakBtn) speakBtn.onclick = () => QCore.speakChinese(w.hanzi);
    const slowBtn = stage.querySelector("#ex-slow");
    if (slowBtn) slowBtn.onclick = () => QCore.speakChinese(w.hanzi, { slow: true });
    if (studyMode === "audio_pick" || studyMode === "audio_py") {
      setTimeout(() => QCore.speakChinese(w.hanzi), 180);
    }

    const fb = stage.querySelector("#ex-feedback");
    stage.querySelectorAll("[data-ex-ans]").forEach((btn) => {
      btn.onclick = () => {
        const ok = btn.getAttribute("data-ex-ans") === "1";
        const dim = btn.getAttribute("data-dim") || "meaning";
        QCore.reviewWordSRS(w.id, ok ? 4 : 1);
        QCore.recordVocabSubSkill(w.id, dim, ok);
        QCore.speakChinese(w.hanzi);
        fb.innerHTML = `
          <div class="card-subtle" style="border-color:${ok ? "var(--primary)" : "var(--accent-red)"};">
            <strong style="color:${ok ? "var(--primary)" : "var(--accent-red)"};">${ok ? "✅ Chính xác!" : "❌ Chưa chính xác — đã đưa vào danh sách ôn lại!"}</strong>
            <div style="margin-top:6px;">
              <strong class="hanzi-text" style="font-size:20px;">${QCore.escapeHtml(w.hanzi)}</strong>
              <span class="pinyin-text" style="color:var(--primary);font-weight:700;margin-left:6px;">${QCore.escapeHtml(w.pinyin)}</span>
              — ${QCore.escapeHtml(getPrimaryVi(w))}
              ${w.han_viet ? ` <span style="color:var(--text-muted);">(Hán Việt: ${QCore.escapeHtml(w.han_viet)})</span>` : ""}
            </div>
          </div>
        `;
      };
    });

    const pyCheck = stage.querySelector("#ex-py-check");
    if (pyCheck) {
      const checkFn = () => {
        const raw = (stage.querySelector("#ex-py-inp").value || "").trim().toLowerCase();
        if (!raw) return;
        const normIn = QVocabStore.stripTone(raw).replace(/[^a-z0-9]/g, "");
        const normNoTone = normIn.replace(/[0-9]/g, "");
        const targetPlain = QVocabStore.stripTone(w.pinyin).replace(/[^a-z]/g, "");
        const targetNum = (w.pinyin_number || "").toLowerCase().replace(/\s+/g, "");
        const exactMatch = raw.replace(/\s+/g, "") === w.pinyin.toLowerCase().replace(/\s+/g, "") || (targetNum && normIn === targetNum);
        const plainMatch = normNoTone === targetPlain;
        const ok = exactMatch || plainMatch;
        QCore.reviewWordSRS(w.id, exactMatch ? 5 : plainMatch ? 3 : 1);
        QCore.recordVocabSubSkill(w.id, "pinyin", ok);
        QCore.speakChinese(w.hanzi);
        fb.innerHTML = `
          <div class="card-subtle" style="border-color:${ok ? "var(--primary)" : "var(--accent-red)"};">
            <strong style="color:${ok ? "var(--primary)" : "var(--accent-red)"};">${exactMatch ? "✅ Tuyệt vời! Chính xác cả Pinyin và thanh điệu!" : plainMatch ? "🟡 Đúng âm tiết! Chú ý thêm thanh điệu chuẩn:" : "❌ Chưa đúng Pinyin!"}</strong>
            <div style="margin-top:6px;">Đáp án chuẩn: <strong class="pinyin-text" style="color:var(--primary);font-size:18px;">${QCore.escapeHtml(w.pinyin)}</strong> (${QCore.escapeHtml(w.pinyin_number || "")})</div>
          </div>
        `;
      };
      pyCheck.onclick = checkFn;
      stage.querySelector("#ex-py-inp").onkeydown = (e) => { if (e.key === "Enter") checkFn(); };
    }

    const recBtn = stage.querySelector("#ex-rec");
    if (recBtn) {
      recBtn.onclick = () => {
        const out = stage.querySelector("#ex-rec-out");
        out.innerHTML = `🔴 Đang thu âm... Hãy đọc to: <strong>${QCore.escapeHtml(w.hanzi)} (${QCore.escapeHtml(w.pinyin)})</strong>`;
        QCore.captureLearnerVoice({
          durationMs: 3500,
          onAudioReady: (url, transcript) => {
            const matched = transcript && transcript.includes(w.hanzi);
            QCore.recordVocabSubSkill(w.id, "listening", Boolean(matched));
            out.innerHTML = `
              <audio controls src="${url}" style="width:100%;height:38px;margin-bottom:8px;"></audio>
              <div>${
                transcript
                  ? matched
                    ? `✅ Trình duyệt nhận diện: "<strong>${QCore.escapeHtml(transcript)}</strong>" — Khớp chữ mục tiêu! Hãy bấm nghe lại bản ghi âm để tự kiểm tra thêm độ chuẩn thanh điệu.`
                    : `🎙️ Trình duyệt nhận diện: "<strong>${QCore.escapeHtml(transcript)}</strong>" (mục tiêu: ${QCore.escapeHtml(w.hanzi)} · ${QCore.escapeHtml(w.pinyin)}). Hãy bấm nghe âm mẫu rồi thử lại nhé!`
                  : "🎧 Đã lưu bản thu âm. Bấm Play ở trên để tự đối chiếu với âm mẫu Putonghua."
              }</div>
            `;
          }
        });
      };
    }

    const sentBtn = stage.querySelector("#ex-sent-check");
    if (sentBtn) {
      if (window.QPinyinIME) QPinyinIME.attachAll(stage);
      stage.querySelector("#ex-sent-explain").onclick = () => window.QApp.navigate("ai-tutor", { tab: "explain_word", word: w.hanzi });
      sentBtn.onclick = async () => {
        const txt = (stage.querySelector("#ex-sent-inp").value || "").trim();
        if (!txt) {
          QCore.showToast("Vui lòng nhập câu tiếng Trung trước khi chấm.");
          return;
        }
        fb.innerHTML = `<div class="card-subtle">⏳ AI Giáo viên đang phân tích câu của bạn...</div>`;
        const res = await window.QAiTutor.evaluateSentenceSmart({
          text: txt,
          targetWord: w.hanzi,
          prompt: `Đặt câu với từ ${w.hanzi} (${w.pinyin} - ${getPrimaryVi(w)})`,
          hskLevel: w.hsk_level
        });
        const ok = (res.score || 0) >= 75;
        QCore.reviewWordSRS(w.id, ok ? 4 : 2);
        QCore.recordVocabSubSkill(w.id, "usage", ok);
        fb.innerHTML = window.QAiTutor.renderSentenceEvaluationCard(res);
      };
    }

    stage.querySelector("#ex-prev").onclick = () => {
      currentIdx = (currentIdx - 1 + list.length) % list.length;
      renderExerciseMode(stage, list, parentContainer);
    };
    stage.querySelector("#ex-next").onclick = () => {
      currentIdx = (currentIdx + 1) % list.length;
      renderExerciseMode(stage, list, parentContainer);
    };
  }

  /* ==================== CREATE CUSTOM FLASHCARD MODAL ==================== */
  function openCreateFlashcardModal(parentContainer) {
    let modal = document.getElementById("custom-vocab-modal");
    if (!modal) {
      modal = document.createElement("div");
      modal.id = "custom-vocab-modal";
      modal.className = "modal-backdrop";
      document.body.appendChild(modal);
    }
    modal.classList.add("open");
    modal.innerHTML = `
      <div class="modal-card" style="max-width:520px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h3 style="margin:0;">➕ Tạo Flashcard từ vựng cá nhân</h3>
          <button class="icon-btn" id="cv-close">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div>
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">Chữ Hán Giản thể *</label>
            <div style="display:flex;gap:8px;">
              <input class="input-field hanzi-text" id="cv-hanzi" placeholder="Ví dụ: 办公室" style="font-size:18px;" />
              <button class="btn btn-soft btn-sm" id="cv-autofill" style="white-space:nowrap;">✨ Tự điền từ kho HSK</button>
            </div>
          </div>
          <div>
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">Pinyin có dấu thanh *</label>
            <input class="input-field pinyin-text" id="cv-pinyin" placeholder="Ví dụ: bàn gōng shì" />
          </div>
          <div>
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">Nghĩa tiếng Việt *</label>
            <input class="input-field" id="cv-vi" placeholder="Ví dụ: văn phòng" />
          </div>
          <div>
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">Nghĩa tiếng Anh (tùy chọn)</label>
            <input class="input-field" id="cv-en" placeholder="Ví dụ: office" />
          </div>
          <div>
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">Câu ví dụ (tùy chọn)</label>
            <input class="input-field hanzi-text" id="cv-ex" placeholder="Ví dụ: 我在办公室工作。" />
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
            <button class="btn btn-outline" id="cv-cancel">Hủy</button>
            <button class="btn btn-primary" id="cv-save">Lưu Flashcard</button>
          </div>
        </div>
      </div>
    `;
    const close = () => modal.classList.remove("open");
    modal.querySelector("#cv-close").onclick = close;
    modal.querySelector("#cv-cancel").onclick = close;

    modal.querySelector("#cv-autofill").onclick = () => {
      const hz = (modal.querySelector("#cv-hanzi").value || "").trim();
      if (!hz) return;
      const found = QVocabStore.lookupHanzi(hz);
      if (found) {
        modal.querySelector("#cv-pinyin").value = found.pinyin || "";
        modal.querySelector("#cv-vi").value = (found.meanings.vietnamese || []).join("; ") || "";
        modal.querySelector("#cv-en").value = (found.meanings.english || []).slice(0, 2).join("; ") || "";
        QCore.showToast("✨ Đã tự điền dữ liệu từ từ điển HSK!");
      } else {
        QCore.showToast("Từ này chưa có trong các cấp HSK đang tải — bạn có thể nhập thủ công nhé.");
      }
    };

    modal.querySelector("#cv-save").onclick = async () => {
      const hz = (modal.querySelector("#cv-hanzi").value || "").trim();
      const py = (modal.querySelector("#cv-pinyin").value || "").trim();
      const vi = (modal.querySelector("#cv-vi").value || "").trim();
      const en = (modal.querySelector("#cv-en").value || "").trim();
      const ex = (modal.querySelector("#cv-ex").value || "").trim();
      if (!hz || !vi) {
        QCore.showToast("Vui lòng nhập ít nhất Chữ Hán và Nghĩa tiếng Việt!");
        return;
      }
      QCore.addCustomVocab({
        hanzi: hz,
        pinyin: py,
        vietnamese: vi,
        english: en,
        examples: ex ? [{ chinese: ex, pinyin: "", vietnamese: "" }] : []
      });
      close();
      QCore.showToast(`✅ Đã tạo Flashcard "${hz}"!`);
      await ensureLoaded();
      renderVocab(parentContainer);
    };
  }

  /* ==================== SECTION 12: 12-STEP AI WORD TEACHER MODAL (PRESERVED) ==================== */
  function openStepByStepWordModal(startWordId) {
    const allVocab = window.QCHINESE_VOCAB || [];
    if (!allVocab.length) return;
    let wIdx = Math.max(0, allVocab.findIndex((x) => x.id === startWordId));
    let stepStage = 1;
    let recordedUrl = null;

    let backdrop = document.getElementById("step12-modal");
    if (!backdrop) {
      backdrop = document.createElement("div");
      backdrop.id = "step12-modal";
      backdrop.className = "modal-backdrop";
      document.body.appendChild(backdrop);
    }
    backdrop.classList.add("open");

    function renderStep() {
      const v = allVocab[wIdx % allVocab.length];
      const firstChar = v.hanzi.charAt(0);
      const ex = v.examples[0] || { chinese: v.hanzi, pinyin: v.pinyin, english: v.meanings.english[0], vietnamese: v.meanings.vietnamese[0] };

      backdrop.innerHTML = `
        <div class="modal-card" style="max-width:760px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div>
              <span class="badge badge-jade">👩‍🏫 GIÁO VIÊN AI DẠY TỪNG TỪ THEO 12 BƯỚC</span>
              <strong style="margin-left:8px;font-size:14px;">Từ ${wIdx + 1}/${allVocab.length} · HSK ${v.hsk_level}</strong>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-outline btn-sm" id="s12-skip-word">Đổi từ khác ↻</button>
              <button class="icon-btn" id="s12-close">✕</button>
            </div>
          </div>

          <div class="tabs-bar" style="margin-bottom:16px;">
            <button class="tab-pill ${stepStage === 1 ? "active" : ""}" data-s12-tab="1">Bước 1–8: Nghe · Nghĩa · Ví dụ</button>
            <button class="tab-pill ${stepStage === 2 ? "active" : ""}" data-s12-tab="2">Bước 9–10: Xem nét & Đọc theo</button>
            <button class="tab-pill ${stepStage === 3 ? "active" : ""}" data-s12-tab="3">Bước 11: Tự viết chữ</button>
            <button class="tab-pill ${stepStage === 4 ? "active" : ""}" data-s12-tab="4">Bước 12: Kiểm tra nhớ</button>
          </div>

          <div id="s12-body"></div>
        </div>
      `;

      backdrop.querySelector("#s12-close").onclick = () => backdrop.classList.remove("open");
      backdrop.querySelector("#s12-skip-word").onclick = () => {
        wIdx = (wIdx + 1) % allVocab.length;
        stepStage = 1;
        recordedUrl = null;
        renderStep();
      };
      backdrop.querySelectorAll("[data-s12-tab]").forEach((b) => {
        b.onclick = () => { stepStage = Number(b.getAttribute("data-s12-tab")); renderStep(); };
      });

      const body = backdrop.querySelector("#s12-body");

      if (stepStage === 1) {
        QCore.speakChinese(v.hanzi);
        body.innerHTML = `
          <div style="text-align:center;margin-bottom:14px;">
            <div class="hanzi-calligraphy" style="font-size:68px;line-height:1.1;">${QCore.escapeHtml(v.hanzi)}</div>

        `;
        if (window.HanziWriter) {
          const sw = HanziWriter.create("s12-anim-box", firstChar, {
            width: 200, height: 200, padding: 12, strokeColor: "#2d6a4f", radicalColor: "#d94343",

          sw.animateCharacter();
          body.querySelector("#s12-replay-stroke").onclick = () => sw.animateCharacter();
        }
        body.querySelector("#s12-model-voice").onclick = () => QCore.speakChinese(v.hanzi);
        body.querySelector("#s12-rec-btn").onclick = () => {
          const fbEl = body.querySelector("#s12-rec-feedback");
          fbEl.textContent = "🔴 Đang thu âm...";
          QCore.captureLearnerVoice({
            durationMs: 3500,
            onAudioReady: (url, transcript) => {
              recordedUrl = url;
              fbEl.innerHTML = `<audio controls src="${url}" style="width:100%;height:36px;margin-bottom:6px;"></audio><div>${transcript ? `Nhận diện: "${QCore.escapeHtml(transcript)}"` : "Đã thu âm xong!"}</div>`;

          });
        };
        body.querySelector("#s12-back-1").onclick = () => { stepStage = 1; renderStep(); };
        body.querySelector("#s12-next-3").onclick = () => { stepStage = 3; renderStep(); };
      } else if (stepStage === 3) {
        body.innerHTML = `
          <div style="text-align:center;margin-bottom:14px;">
            <strong>Thực hành tự viết chữ "${QCore.escapeHtml(firstChar)}"</strong>
            <div class="mizige-box" style="width:220px;height:220px;margin:10px auto;"><div id="s12-quiz-box" class="mizige-target"></div></div>

          </div>
          <div style="display:flex;justify-content:space-between;">
            <button class="btn btn-outline" id="s12-back-2">← Quay lại</button>
            <button class="btn btn-primary" id="s12-next-4">Sang Bước 12 →</button>
          </div>
        `;
        if (window.HanziWriter) {
          const qw = HanziWriter.create("s12-quiz-box", firstChar, {
            width: 220, height: 220, padding: 14, showCharacter: false, showOutline: true, showHintAfterMisses: 2,
            charDataLoader: (ch, onComplete) => QCore.fetchStrokeData(ch).then((d) => d && onComplete(d))
          });
          qw.quiz({
            onMistake: (sd) => { const el = body.querySelector("#s12-quiz-status"); if (el) el.textContent = `⚠️ Nét ${sd.strokeNum + 1} chưa đúng hướng!`; },
            onComplete: (sum) => {
              const acc = Math.max(60, 100 - sum.totalMistakes * 10);
              QCore.recordHanziPractice(firstChar, acc);
              const el = body.querySelector("#s12-quiz-status");
              if (el) el.textContent = `🎉 Hoàn thành! Độ chính xác: ${acc}%`;
            }
          });
        }
        body.querySelector("#s12-back-2").onclick = () => { stepStage = 2; renderStep(); };
        body.querySelector("#s12-next-4").onclick = () => { stepStage = 4; renderStep(); };
      } else {
        const opts = pickDistractors(v, allVocab, 3);
        body.innerHTML = `
          <div style="text-align:center;">
            <div class="hanzi-calligraphy" style="font-size:62px;margin:8px 0;">${QCore.escapeHtml(v.hanzi)}</div>
            <p style="color:var(--text-secondary);">Chọn phát âm và nghĩa đúng:</p>
            <div class="grid-2" style="margin-bottom:14px;">
              ${opts.map((o) => `<button class="btn btn-outline" style="padding:12px;" data-s12-ans="${o.id === v.id ? "1" : "0"}"><strong>${QCore.escapeHtml(o.pinyin)}</strong> — ${QCore.escapeHtml(o.meanings.vietnamese[0])}</button>`).join("")}
            </div>
            <div id="s12-final-msg"></div>
          </div>
        `;
        body.querySelectorAll("[data-s12-ans]").forEach((btn) => {
          btn.onclick = () => {
            const ok = btn.getAttribute("data-s12-ans") === "1";
            const msg = body.querySelector("#s12-final-msg");
            if (ok) {
              QCore.reviewWordSRS(v.id, 5);
              QCore.speakChinese(v.hanzi);
              msg.innerHTML = `<div class="card-subtle" style="border-color:var(--primary);"><strong style="color:var(--primary);">🎉 Hoàn thành 12 bước cho "${QCore.escapeHtml(v.hanzi)}"!</strong><div style="margin-top:8px;"><button class="btn btn-primary" id="s12-go-next">Học từ tiếp theo →</button></div></div>`;
              msg.querySelector("#s12-go-next").onclick = () => { wIdx = (wIdx + 1) % allVocab.length; stepStage = 1; recordedUrl = null; renderStep(); };
            } else {
              msg.innerHTML = `<div class="card-subtle" style="color:var(--accent-red);">Chưa chính xác! Thử chọn lại nhé.</div>`;
            }
          };
        });
      }
    }
    renderStep();
  }

  return {
    renderVocab,
    openStepByStepWordModal
  };
})();

</script>
  <script data-bundle="js/modules/hanzi-studio.js">
/* -*- coding: utf-8 -*-
 * QChinese – Module 4: Deep Hanzi Character Studio (PHẦN 4.1, 4.2, 4.3)
 * Features:
 * - All 15 linguistic & structural character fields in Simplified Chinese (简体中文)
 * - Verified Make-Me-a-Hanzi SVG stroke animation with Play, Pause, Replay, Slow, Step-by-Step + Numbered Medians & Direction Arrows
 * - Progressive Red-Highlight Stroke Breakdown Strip (inspired by traditional character practice sheets)
 * - Dual Interactive Writing Board:
 *     (1) Guided/Blind Stroke-by-Stroke Validator (HanziWriter Quiz)
 *     (2) Freehand HTML5 Canvas Calligraphy Pad with 5-Criteria Geometric & Stroke-Order Evaluation
 */

window.QHanziStudio = (function () {
  let activeChar = "你";
  let practiceTab = "guided"; // "guided" | "freehand"
  let showGhostOutline = true;
  let animWriter = null;
  let quizWriter = null;
  let stepIndex = 0;
  let isPaused = false;
  let currentStrokeData = null;

  function transformMakeMeAHanziPoint(pt, boxSize = 280) {
    // Make Me a Hanzi coordinate system: x in [0..1024], y in [-124..900] flipped vertically (y_svg = 900 - y)
    const scale = boxSize / 1024;
    return {
      x: pt[0] * scale,
      y: (900 - pt[1]) * scale
    };
  }

  function buildStepStripSVG(strokeData, upToIndex) {
    const strokes = strokeData.strokes || [];
    const radStrokes = strokeData.radStrokes || [];
    const paths = strokes
      .map((d, idx) => {
        let fill = "rgba(140,155,145,0.18)";
        if (idx < upToIndex) {
          fill = radStrokes.includes(idx) ? "#2d6a4f" : "#1e2923";
        } else if (idx === upToIndex) {
          fill = "#d94343"; // Vermilion highlight for the current stroke!
        }
        return `<path d="${d}" fill="${fill}"></path>`;
      })
      .join("");

    return `
      <svg class="stroke-step-svg" viewBox="0 0 1024 1024">
        <line x1="512" y1="0" x2="512" y2="1024" stroke="var(--grid-line)" stroke-width="14" stroke-dasharray="28,28"/>
        <line x1="0" y1="512" x2="1024" y2="512" stroke="var(--grid-line)" stroke-width="14" stroke-dasharray="28,28"/>
        <g transform="scale(1, -1) translate(0, -900)">
          ${paths}
        </g>
      </svg>
    `;
  }

  function buildDirectionOverlaySVG(strokeData, highlightIdx = null) {
    if (!strokeData || !Array.isArray(strokeData.medians)) return "";
    const items = [];
    strokeData.medians.forEach((med, idx) => {
      if (highlightIdx !== null && idx !== highlightIdx) return;
      if (!med || med.length < 2) return;
      const start = transformMakeMeAHanziPoint(med[0], 280);
      const end = transformMakeMeAHanziPoint(med[med.length - 1], 280);
      const pts = med.map((p) => {
        const tp = transformMakeMeAHanziPoint(p, 280);
        return `${tp.x.toFixed(1)},${tp.y.toFixed(1)}`;
      });

      // Arrowhead at end
      const prev = transformMakeMeAHanziPoint(med[med.length - 2], 280);
      const angle = Math.atan2(end.y - prev.y, end.x - prev.x);
      const aLen = 7;
      const ax1 = end.x - aLen * Math.cos(angle - Math.PI / 6);
      const ay1 = end.y - aLen * Math.sin(angle - Math.PI / 6);
      const ax2 = end.x - aLen * Math.cos(angle + Math.PI / 6);
      const ay2 = end.y - aLen * Math.sin(angle + Math.PI / 6);

      items.push(`
        <polyline points="${pts.join(" ")}" fill="none" stroke="#d94343" stroke-width="1.6" stroke-dasharray="3,3" opacity="0.85"/>
        <polygon points="${end.x.toFixed(1)},${end.y.toFixed(1)} ${ax1.toFixed(1)},${ay1.toFixed(1)} ${ax2.toFixed(1)},${ay2.toFixed(1)}" fill="#d94343"/>
        <circle cx="${start.x.toFixed(1)}" cy="${start.y.toFixed(1)}" r="8.5" fill="#d94343"/>
        <text x="${start.x.toFixed(1)}" y="${(start.y + 3.5).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">${idx + 1}</text>
      `);
    });
    return items.join("");
  }

  async function renderHanzi(container, params = {}) {

      customChars
        .filter((c) => !builtinList.some((b) => b.hanzi === c))
        .map((c) => {
          const d = QCore.resolveHanziDetail(c);
          return { hanzi: c, pinyin: /^[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/.test(d.pinyin) && d.pinyin !== "Tra âm trực tiếp" ? d.pinyin : "" };

        </div>
      </div>

      <!-- Quick Core Character Selector Strip -->
      <div class="card" style="padding:14px 18px;margin-bottom:20px;">

        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${charList
            .map((item) => {

              return `
                <button class="btn ${item.hanzi === activeChar ? "btn-primary" : done ? "btn-soft" : "btn-outline"} btn-sm" data-pick-hz="${QCore.escapeHtml(item.hanzi)}" style="min-width:58px;flex-direction:column;gap:1px;padding:6px 10px;">
                  <span class="hanzi-calligraphy" style="font-size:22px;line-height:1.1;">${QCore.escapeHtml(item.hanzi)}</span>
                  <span style="font-size:11px;opacity:0.88;">${QCore.escapeHtml(item.pinyin)}</span>
                </button>
              `;
            })
            .join("")}
        </div>
      </div>

      <!-- 4.1. Character Detail Hero & 15 Information Fields -->
      <div class="grid-2" style="margin-bottom:20px;">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
            <div style="display:flex;gap:8px;align-items:center;">
              <span class="badge badge-jade">Từ vựng đang học · HSK ${detail.hsk_level}</span>
              <span class="badge" id="hz-stroke-badge">${detail.stroke_count ? `${detail.stroke_count} nét` : "Đang tải số nét..."}</span>
              ${prog.memorized ? `<span class="badge badge-jade">✓ Đã ghi nhớ (${prog.bestScore}%)</span>` : ""}
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${
                isBuiltin
                  ? ""
                  : `<button class="btn ${isPinned ? "btn-danger" : "btn-soft"} btn-sm" id="hz-pin-btn">${isPinned ? "✕ Bỏ khỏi danh sách chọn nhanh" : "➕ Thêm vào danh sách chọn nhanh"}</button>`
              }
              <button class="btn btn-outline btn-sm" id="hz-save-notebook">📒 Lưu chữ khó vào Sổ tay</button>
            </div>
          </div>

          <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:14px;">
            <div class="hanzi-calligraphy" style="font-size:92px;line-height:1.05;padding:8px 18px;border-radius:20px;background:var(--bg-subtle);border:1.5px solid var(--border-strong);">
              ${QCore.escapeHtml(detail.hanzi)}
            </div>
            <div style="flex:1;min-width:200px;">
              <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">

              </div>

              <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">Từ loại: ${QCore.escapeHtml(detail.part_of_speech)}</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">

          ${

            <div class="vi-hint-banner" style="margin-bottom:14px;">

          <!-- Trilingual Meaning Table -->

          <div style="display:flex;flex-direction:column;gap:8px;">
            ${(detail.examples || [])

                <button class="btn btn-soft btn-sm" data-speak-word="${QCore.escapeHtml(ex.chinese)}">🔊</button>
              </div>
            `
              )
              .join("")}
          </div>
        </div>

        <!-- RIGHT COLUMN: 4.2 Stroke Order Animation + 4.3 Interactive Handwriting Practice -->
        <div style="display:flex;flex-direction:column;gap:18px;">
          <!-- 4.2. Stroke Animation Player -->
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
              <div>
                <h3 style="margin:0;font-size:17px;">🎬 4.2. Hoạt ảnh hướng dẫn viết từng nét</h3>
                <small style="color:var(--text-muted);">Dữ liệu bút thuận chuẩn xác từ Make Me a Hanzi (màu xanh ngọc = bộ thủ)</small>
              </div>
              <label style="font-size:12.5px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;">
                <input type="checkbox" id="hz-toggle-arrows" checked> Hiện số nét & hướng bút
              </label>
            </div>

            <div class="mizige-box" id="hz-anim-wrapper">
              <svg class="mizige-guides" viewBox="0 0 280 280">
                <line x1="140" y1="0" x2="140" y2="280" stroke="var(--grid-guide)" stroke-width="1.2" stroke-dasharray="5,5"/>
                <line x1="0" y1="140" x2="280" y2="140" stroke="var(--grid-guide)" stroke-width="1.2" stroke-dasharray="5,5"/>
                <line x1="0" y1="0" x2="280" y2="280" stroke="var(--grid-line)" stroke-width="1" stroke-dasharray="6,6"/>
                <line x1="280" y1="0" x2="0" y2="280" stroke="var(--grid-line)" stroke-width="1" stroke-dasharray="6,6"/>
                <g id="hz-direction-layer"></g>
              </svg>
              <div id="hz-anim-target" class="mizige-target"></div>
            </div>

            <div id="hz-step-caption" style="text-align:center;font-size:13.5px;font-weight:600;color:var(--primary);margin:10px 0;">
              Đang tải dữ liệu nét chuẩn...
            </div>

            <div style="display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:14px;">
              <button class="btn btn-primary btn-sm" id="hz-ctl-play">▶️ Phát quy trình</button>
              <button class="btn btn-outline btn-sm" id="hz-ctl-pause">⏸️ Tạm dừng</button>
              <button class="btn btn-outline btn-sm" id="hz-ctl-replay">🔁 Phát lại</button>
              <button class="btn btn-outline btn-sm" id="hz-ctl-slow">🐢 Xem chậm</button>
              <button class="btn btn-soft btn-sm" id="hz-ctl-step">⏭️ Xem từng nét</button>
            </div>

            <!-- Progressive Red-Stroke Breakdown Strip (like Image 3!) -->
            <div>
              <strong style="font-size:13px;color:var(--text-secondary);">📏 Bảng phân tách thứ tự từng nét (nét màu đỏ là nét đang viết):</strong>
              <div class="stroke-strip" id="hz-stroke-strip"></div>
            </div>
          </div>

          <!-- 4.3. Direct Interactive Writing Practice Area -->
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
              <div>
                <h3 style="margin:0;font-size:17px;">✍️ 4.3. Khu vực thực hành tự viết chữ "${QCore.escapeHtml(detail.hanzi)}"</h3>
                <small style="color:var(--text-muted);">Hỗ trợ chuột máy tính, ngón tay điện thoại và bút cảm ứng</small>
              </div>
              <div class="tabs-bar">
                <button class="tab-pill ${practiceTab === "guided" ? "active" : ""}" data-ptab="guided">Theo từng nét chuẩn</button>
                <button class="tab-pill ${practiceTab === "freehand" ? "active" : ""}" data-ptab="freehand">Viết tự do & Chấm 5 tiêu chí</button>
              </div>
            </div>

            <div id="hz-practice-stage"></div>
          </div>
        </div>
      </div>
    `;

    // Bind audio & navigation events
    container.querySelector("#hz-btn-audio").onclick = () => QCore.speakChinese(detail.hanzi);
    container.querySelector("#hz-btn-slow").onclick = () => QCore.speakChinese(detail.hanzi, { slow: true });
    container.querySelectorAll("[data-speak-word]").forEach((b) => {
      b.onclick = () => QCore.speakChinese(b.getAttribute("data-speak-word"));
    });
    const pinBtn = container.querySelector("#hz-pin-btn");
    if (pinBtn) {
      pinBtn.onclick = () => {
        st.customHanzi = Array.isArray(st.customHanzi) ? st.customHanzi : [];
        const i = st.customHanzi.indexOf(activeChar);
        if (i >= 0) {
          st.customHanzi.splice(i, 1);
          QCore.showToast(`Đã bỏ "${activeChar}" khỏi danh sách chọn nhanh.`);
        } else {
          st.customHanzi.push(activeChar);
          QCore.showToast(`Đã thêm "${activeChar}" vào danh sách chọn nhanh!`);
        }
        QCore.saveState(true);
        renderHanzi(container);
      };
    }

    container.querySelector("#hz-save-notebook").onclick = () => {
      QCore.addToNotebook({
        category: "hard_hanzi",
        hanzi: detail.hanzi,
        pinyin: detail.pinyin,
        english: detail.meanings.english,
        vietnamese: detail.meanings.vietnamese,
        example: detail.examples && detail.examples[0] ? detail.examples[0].chinese : "",
        note: detail.common_mistakes
      });
    };

    container.querySelectorAll("[data-pick-hz]").forEach((btn) => {
      btn.onclick = () => {
        activeChar = btn.getAttribute("data-pick-hz");
        renderHanzi(container);
      };
    });

    container.querySelector("#hz-load-btn").onclick = () => {
      const raw = container.querySelector("#hz-custom-input").value.trim();
      const m = raw.match(/[\u3400-\u9fff]/);
      if (!m) {
        QCore.showToast("Hãy chọn chữ Hán từ thanh gợi ý Pinyin hoặc nhập ít nhất 1 chữ Hán Giản thể nhé!");
        return;
      }
      activeChar = m[0];
      renderHanzi(container);
    };

    container.querySelectorAll("[data-ptab]").forEach((b) => {
      b.onclick = () => {
        practiceTab = b.getAttribute("data-ptab");
        setupPracticeBoard(container, detail);
      };
    });

    // Load verified Make-Me-a-Hanzi stroke data
    currentStrokeData = await QCore.fetchStrokeData(detail.hanzi);
    const captionEl = container.querySelector("#hz-step-caption");
    const badgeEl = container.querySelector("#hz-stroke-badge");
    const stripEl = container.querySelector("#hz-stroke-strip");
    const dirLayer = container.querySelector("#hz-direction-layer");
    const toggleArrows = container.querySelector("#hz-toggle-arrows");

    if (!currentStrokeData) {
      captionEl.textContent = "Không tải được dữ liệu nét cho ký tự này.";
      return;
    }

    const totalStrokes = currentStrokeData.strokes.length;
    badgeEl.textContent = `${totalStrokes} nét chuẩn`;
    stepIndex = 0;
    isPaused = false;

    const refreshArrows = (onlyIdx = null) => {
      if (!dirLayer) return;
      dirLayer.innerHTML = toggleArrows.checked ? buildDirectionOverlaySVG(currentStrokeData, onlyIdx) : "";
    };
    refreshArrows(null);
    toggleArrows.onchange = () => refreshArrows(null);

    // Render progressive stroke breakdown strip (Image 3 style!)
    stripEl.innerHTML = currentStrokeData.strokes
      .map(
        (_, i) => `
      <div class="stroke-step-cell" data-step-cell="${i}" title="Bấm xem nét số ${i + 1}">
        <div class="stroke-step-head">Nét ${i + 1}/${totalStrokes}</div>
        ${buildStepStripSVG(currentStrokeData, i)}
      </div>
    `
      )
      .join("");

    // Initialize HanziWriter Animation Player
    if (window.HanziWriter) {
      const makeWriter = (speed = 0.95) => {
        const target = container.querySelector("#hz-anim-target");
        target.innerHTML = "";
        return HanziWriter.create("hz-anim-target", detail.hanzi, {
          width: 280,
          height: 280,
          padding: 16,
          strokeColor: document.documentElement.getAttribute("data-theme") === "dark" ? "#edf4ef" : "#1e2923",
          radicalColor: "#2d6a4f",
          outlineColor: "rgba(130, 148, 138, 0.24)",
          showOutline: true,
          strokeAnimationSpeed: speed,
          delayBetweenStrokes: speed < 0.6 ? 520 : 260,
          charDataLoader: (_, onComplete) => onComplete(currentStrokeData)
        });
      };

      animWriter = makeWriter(0.95);
      captionEl.textContent = `Chữ "${detail.hanzi}" gồm ${totalStrokes} nét. Bấm Phát quy trình hoặc Xem từng nét!`;

      const playFull = (slow = false) => {
        animWriter = makeWriter(slow ? 0.35 : 0.95);
        isPaused = false;
        container.querySelector("#hz-ctl-pause").textContent = "⏸️ Tạm dừng";
        refreshArrows(null);
        captionEl.textContent = slow
          ? `🐢 Đang phát chậm từng nét của chữ "${detail.hanzi}" (0.35x)...`
          : `▶️ Đang mô phỏng thứ tự ${totalStrokes} nét của chữ "${detail.hanzi}"...`;
        animWriter.hideCharacter();
        animWriter.animateCharacter({
          onComplete: () => {
            captionEl.textContent = `✅ Hoàn thiện ${totalStrokes} nét chữ "${detail.hanzi}"! Bây giờ bạn hãy tự viết ở khung bên dưới nhé.`;
          }
        });
      };

      container.querySelector("#hz-ctl-play").onclick = () => playFull(false);
      container.querySelector("#hz-ctl-replay").onclick = () => playFull(false);
      container.querySelector("#hz-ctl-slow").onclick = () => playFull(true);

      container.querySelector("#hz-ctl-pause").onclick = () => {
        if (!animWriter) return;
        if (!isPaused) {
          animWriter.pauseAnimation();
          isPaused = true;
          container.querySelector("#hz-ctl-pause").textContent = "▶️ Tiếp tục";
          captionEl.textContent = "⏸️ Đã tạm dừng hoạt ảnh.";
        } else {
          animWriter.resumeAnimation();
          isPaused = false;
          container.querySelector("#hz-ctl-pause").textContent = "⏸️ Tạm dừng";
          captionEl.textContent = "▶️ Đang tiếp tục phát hoạt ảnh...";
        }
      };

      const showSingleStep = (idx) => {
        stepIndex = idx;
        stripEl.querySelectorAll(".stroke-step-cell").forEach((c, ci) => c.classList.toggle("active", ci === idx));
        refreshArrows(idx);
        const guideName =
          detail.stroke_names && detail.stroke_names[idx]
            ? detail.stroke_names[idx]
            : `Nét số ${idx + 1} / ${totalStrokes}: bắt đầu từ chấm tròn số ${idx + 1} kéo theo hướng mũi tên đỏ.`;
        captionEl.textContent = guideName;
        if (animWriter) {
          animWriter.hideCharacter();
          // Reveal strokes 0..idx-1 and animate stroke idx
          for (let k = 0; k < idx; k++) {
            // Use SVG path visibility via animateStroke chain
          }
          animWriter.animateStroke(idx);
        }
      };

      container.querySelector("#hz-ctl-step").onclick = () => {
        showSingleStep(stepIndex);
        stepIndex = (stepIndex + 1) % totalStrokes;
      };

      stripEl.querySelectorAll("[data-step-cell]").forEach((cell) => {
        cell.onclick = () => {
          const i = Number(cell.getAttribute("data-step-cell"));
          showSingleStep(i);
          stepIndex = (i + 1) % totalStrokes;
        };
      });
    }

    setupPracticeBoard(container, detail);
  }

  function setupPracticeBoard(container, detail) {
    const stage = container.querySelector("#hz-practice-stage");
    if (!stage || !currentStrokeData) return;

    if (practiceTab === "guided") {
      stage.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <label style="font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="quiz-ghost-chk" ${showGhostOutline ? "checked" : ""}>
            Hiện chữ mẫu mờ để viết đè (bỏ chọn để luyện "Nhớ rồi tự viết")
          </label>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-outline btn-sm" id="quiz-reset-btn">🔄 Xóa / Viết lại</button>
            <button class="btn btn-soft btn-sm" id="quiz-hint-btn">💡 Xem gợi ý nét</button>
            <button class="btn btn-outline btn-sm" id="quiz-ans-btn">👁️ Xem đáp án</button>
          </div>
        </div>

        <div class="mizige-box">
          <svg class="mizige-guides" viewBox="0 0 280 280">
            <line x1="140" y1="0" x2="140" y2="280" stroke="var(--grid-guide)" stroke-width="1.2" stroke-dasharray="5,5"/>
            <line x1="0" y1="140" x2="280" y2="140" stroke="var(--grid-guide)" stroke-width="1.2" stroke-dasharray="5,5"/>
            <line x1="0" y1="0" x2="280" y2="280" stroke="var(--grid-line)" stroke-width="1" stroke-dasharray="6,6"/>
            <line x1="280" y1="0" x2="0" y2="280" stroke="var(--grid-line)" stroke-width="1" stroke-dasharray="6,6"/>
          </svg>
          <div id="hz-quiz-target" class="mizige-target"></div>
        </div>

        <div class="card-subtle" id="hz-quiz-feedback" style="margin-top:12px;text-align:center;font-size:13.5px;">
          ✏️ Hãy dùng chuột hoặc ngón tay viết <strong>Nét 1</strong> của chữ <strong>${QCore.escapeHtml(detail.hanzi)}</strong>!
        </div>
      `;

      const startGuidedQuiz = () => {
        const target = stage.querySelector("#hz-quiz-target");
        target.innerHTML = "";
        const fb = stage.querySelector("#hz-quiz-feedback");
        let currentStrokeIdx = 0;

        quizWriter = HanziWriter.create("hz-quiz-target", detail.hanzi, {
          width: 280,
          height: 280,
          padding: 16,
          showCharacter: false,
          showOutline: showGhostOutline,
          strokeColor: "#2d6a4f",
          drawingColor: "#d94343",
          drawingWidth: 22,
          showHintAfterMisses: 2,
          highlightOnComplete: true,
          charDataLoader: (_, onComplete) => onComplete(currentStrokeData)
        });

        quizWriter.quiz({
          onCorrectStroke: (data) => {
            currentStrokeIdx = data.strokeNum + 1;
            const total = currentStrokeData.strokes.length;
            if (currentStrokeIdx < total) {
              fb.innerHTML = `✅ Nét ${data.strokeNum + 1} rất chuẩn! Tiếp tục viết <strong>Nét ${currentStrokeIdx + 1}/${total}</strong> nhé.`;
            }
          },
          onMistake: (data) => {
            const sName =
              detail.stroke_names && detail.stroke_names[data.strokeNum]
                ? detail.stroke_names[data.strokeNum]
                : `Nét số ${data.strokeNum + 1}`;
            fb.innerHTML = `<span style="color:var(--accent-red);font-weight:600;">⚠️ Viết lệch thứ tự hoặc hướng ở ${QCore.escapeHtml(sName)}!</span><br><small>Hướng dẫn sửa: Chú ý điểm bắt đầu và kéo đúng hướng từ trên xuống / từ trái sang phải (sai 2 lần hệ thống sẽ nhấp nháy nét mẫu cho bạn).</small>`;
          },
          onComplete: (summary) => {
            const total = currentStrokeData.strokes.length;
            const penalty = summary.totalMistakes * Math.round(70 / Math.max(3, total));
            const score = Math.max(45, 100 - penalty + (showGhostOutline ? 0 : 5));
            const cappedScore = Math.min(100, score);
            QCore.recordHanziPractice(detail.hanzi, cappedScore);
            QCore.speakChinese(detail.hanzi);
            fb.innerHTML = `
              <div style="color:var(--primary);font-weight:700;font-size:15px;">🎉 Hoàn thành chữ "${QCore.escapeHtml(detail.hanzi)}"! Điểm chính xác thứ tự & vị trí nét: ${cappedScore}/100</div>
              <div style="font-size:12.5px;color:var(--text-secondary);margin-top:4px;">Tổng số lần lệch nét: ${summary.totalMistakes} · Chế độ: ${showGhostOutline ? "Có chữ mẫu mờ" : "Tự nhớ không nhìn mẫu"}</div>
            `;
          }
        });

        stage.querySelector("#quiz-hint-btn").onclick = () => {
          quizWriter.highlightStroke(currentStrokeIdx);
        };
        stage.querySelector("#quiz-ans-btn").onclick = () => {
          quizWriter.showCharacter();
          fb.innerHTML = `👁️ Đang hiển thị đáp án chữ mẫu. Bấm <strong>Xóa / Viết lại</strong> để tự thực hành lại từ đầu nhé!`;
        };
      };

      stage.querySelector("#quiz-ghost-chk").onchange = (e) => {
        showGhostOutline = e.target.checked;
        startGuidedQuiz();
      };
      stage.querySelector("#quiz-reset-btn").onclick = startGuidedQuiz;
      startGuidedQuiz();
    } else {
      // Freehand HTML5 Canvas Calligraphy Board + 5-Criteria Geometric & Order Evaluator
      stage.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <label style="font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="fh-ghost-chk" ${showGhostOutline ? "checked" : ""}>
            Hiện chữ mẫu mờ bên dưới
          </label>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn btn-outline btn-sm" id="fh-undo">↩️ Xóa nét vừa viết</button>
            <button class="btn btn-outline btn-sm" id="fh-clear">🗑️ Viết lại</button>
            <button class="btn btn-outline btn-sm" id="fh-show-ans">👁️ Xem đáp án</button>
            <button class="btn btn-primary btn-sm" id="fh-grade">✅ Kiểm tra kết quả</button>
          </div>
        </div>

        <div class="mizige-box" style="width:280px;height:280px;">
          <svg class="mizige-guides" viewBox="0 0 1024 1024" id="fh-bg-svg">
            <line x1="512" y1="0" x2="512" y2="1024" stroke="var(--grid-guide)" stroke-width="8" stroke-dasharray="22,22"/>
            <line x1="0" y1="512" x2="1024" y2="512" stroke="var(--grid-guide)" stroke-width="8" stroke-dasharray="22,22"/>
            <line x1="0" y1="0" x2="1024" y2="1024" stroke="var(--grid-line)" stroke-width="6" stroke-dasharray="24,24"/>
            <line x1="1024" y1="0" x2="0" y2="1024" stroke="var(--grid-line)" stroke-width="6" stroke-dasharray="24,24"/>
            <g id="fh-ghost-group" transform="scale(1, -1) translate(0, -900)" style="opacity:${showGhostOutline ? "0.18" : "0"};">
              ${currentStrokeData.strokes.map((d) => `<path d="${d}" fill="#2d6a4f"></path>`).join("")}
            </g>
          </svg>
          <canvas id="fh-canvas" width="280" height="280" style="position:relative;z-index:3;cursor:crosshair;touch-action:none;"></canvas>
        </div>

        <div id="fh-eval-box" style="margin-top:12px;">
          <div class="card-subtle" style="font-size:12.5px;color:var(--text-secondary);">
            ℹ️ <strong>Chế độ viết tự do:</strong> Hãy tự viết đầy đủ các nét của chữ <strong>${QCore.escapeHtml(detail.hanzi)}</strong> rồi bấm <strong>Kiểm tra kết quả</strong>. Hệ thống sẽ đối chiếu tọa độ vector các nét bạn vẽ với dữ liệu chuẩn Make Me a Hanzi theo 5 tiêu chí (lưu ý: đây là đánh giá hình học tham khảo trên nét vẽ tay, không thay thế giám khảo thư pháp).
          </div>
        </div>
      `;

      const canvas = stage.querySelector("#fh-canvas");
      const ctx = canvas.getContext("2d");
      const ghostGroup = stage.querySelector("#fh-ghost-group");
      let userStrokes = [];
      let drawing = false;
      let currPts = [];

      function redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 10;
        ctx.strokeStyle = document.documentElement.getAttribute("data-theme") === "dark" ? "#52b788" : "#1b2a22";

        userStrokes.forEach((stroke) => {
          if (stroke.length < 2) return;
          ctx.beginPath();
          ctx.moveTo(stroke[0].x, stroke[0].y);
          for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
          ctx.stroke();
        });
      }

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: ((clientX - r.left) / r.width) * 280,
          y: ((clientY - r.top) / r.height) * 280
        };
      }

      canvas.addEventListener("pointerdown", (e) => {
        drawing = true;
        currPts = [getPos(e)];
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const p = getPos(e);
        currPts.push(p);
        redrawCanvas();
        if (currPts.length >= 2) {
          ctx.beginPath();
          ctx.moveTo(currPts[0].x, currPts[0].y);
          for (let i = 1; i < currPts.length; i++) ctx.lineTo(currPts[i].x, currPts[i].y);
          ctx.stroke();
        }
      });
      const finishStroke = () => {
        if (!drawing) return;
        drawing = false;
        if (currPts.length >= 2) {
          const dx = currPts[currPts.length - 1].x - currPts[0].x;
          const dy = currPts[currPts.length - 1].y - currPts[0].y;
          if (Math.hypot(dx, dy) > 4) userStrokes.push(currPts);
        }
        currPts = [];
        redrawCanvas();
      };
      canvas.addEventListener("pointerup", finishStroke);
      canvas.addEventListener("pointercancel", finishStroke);

      stage.querySelector("#fh-ghost-chk").onchange = (e) => {
        showGhostOutline = e.target.checked;
        ghostGroup.style.opacity = showGhostOutline ? "0.18" : "0";
      };
      stage.querySelector("#fh-undo").onclick = () => {
        userStrokes.pop();
        redrawCanvas();
      };
      stage.querySelector("#fh-clear").onclick = () => {
        userStrokes = [];
        redrawCanvas();
      };
      stage.querySelector("#fh-show-ans").onclick = () => {
        ghostGroup.style.opacity = "0.75";
        setTimeout(() => {
          ghostGroup.style.opacity = showGhostOutline ? "0.18" : "0";
        }, 2200);
      };

      stage.querySelector("#fh-grade").onclick = () => {
        const evalBox = stage.querySelector("#fh-eval-box");
        if (!userStrokes.length) {
          QCore.showToast("Bạn chưa viết nét nào trên bảng! Hãy viết chữ trước khi chấm nhé.");
          return;
        }

        const expectedMedians = currentStrokeData.medians.map((m) =>
          m.map((pt) => transformMakeMeAHanziPoint(pt, 280))
        );
        const expCount = expectedMedians.length;
        const usrCount = userStrokes.length;

        // 1. Stroke Count & Order Score
        const countDiff = Math.abs(usrCount - expCount);
        let orderScore = Math.max(20, 100 - countDiff * 24);
        const compareN = Math.min(usrCount, expCount);

        let posDistSum = 0;
        let dirMatchSum = 0;
        const wrongStrokes = [];

        for (let i = 0; i < compareN; i++) {
          const u = userStrokes[i];
          const e = expectedMedians[i];
          const uStart = u[0], uEnd = u[u.length - 1];
          const eStart = e[0], eEnd = e[e.length - 1];

          const dStart = Math.hypot(uStart.x - eStart.x, uStart.y - eStart.y);
          const dEnd = Math.hypot(uEnd.x - eEnd.x, uEnd.y - eEnd.y);
          const avgDist = (dStart + dEnd) / 2;
          posDistSum += avgDist;

          const uAngle = Math.atan2(uEnd.y - uStart.y, uEnd.x - uStart.x);
          const eAngle = Math.atan2(eEnd.y - eStart.y, eEnd.x - eStart.x);
          let angleDiff = Math.abs(uAngle - eAngle);
          if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
          const dirScore = Math.max(0, 100 - (angleDiff / Math.PI) * 140);
          dirMatchSum += dirScore;

          if (avgDist > 58 || dirScore < 55) {
            wrongStrokes.push(i + 1);
          }
        }

        const posScore = Math.round(Math.max(15, 100 - (posDistSum / Math.max(1, compareN)) * 1.15));
        const shapeDirScore = Math.round(dirMatchSum / Math.max(1, compareN));
        orderScore = Math.round((orderScore + shapeDirScore) / 2);

        // Bounding-box proportion & centering check
        const allUserPts = userStrokes.flat();
        const allExpPts = expectedMedians.flat();
        const bbox = (pts) => {
          const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
          const minX = Math.min(...xs), maxX = Math.max(...xs);
          const minY = Math.min(...ys), maxY = Math.max(...ys);
          return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, w: Math.max(10, maxX - minX), h: Math.max(10, maxY - minY) };
        };
        const ub = bbox(allUserPts), eb = bbox(allExpPts);
        const centerShift = Math.hypot(ub.cx - eb.cx, ub.cy - eb.cy);
        const scaleDiff = Math.abs(ub.w / eb.w - 1) + Math.abs(ub.h / eb.h - 1);
        const layoutScore = Math.round(Math.max(20, 100 - centerShift * 0.9 - scaleDiff * 35));

        // Never give 100% absolute perfection in freehand heuristic mode (honest engineering per Section 4.3!)
        const rawOverall = Math.round(orderScore * 0.28 + shapeDirScore * 0.24 + posScore * 0.24 + layoutScore * 0.24);
        const overall = Math.min(96, Math.max(18, rawOverall));

        QCore.recordHanziPractice(detail.hanzi, overall);

        const adviceList = [];
        if (usrCount !== expCount) {
          adviceList.push(`Bạn viết <strong>${usrCount} nét</strong> trong khi chữ "${detail.hanzi}" chuẩn có <strong>${expCount} nét</strong> (${usrCount < expCount ? "bị thiếu hoặc nối gộp nét" : "bị thừa nét"}).`);
        }
        if (wrongStrokes.length) {
          adviceList.push(`Các nét số <strong>${wrongStrokes.join(", ")}</strong> đang lệch vị trí điểm đặt bút hoặc ngược hướng kéo bút. Hãy đối chiếu với ô phân tách nét màu đỏ phía trên.`);
        }
        if (centerShift > 28) {
          adviceList.push("Chữ hơi lệch khỏi tâm giao điểm chữ thập của ô vuông 米字格 — hãy căn trọng tâm chữ vào giữa ô.");
        }
        if (!adviceList.length) {
          adviceList.push("Thứ tự nét, hướng đi của bút và tỷ lệ bố cục trong ô vuông rất cân đối!");
        }

        evalBox.innerHTML = `
          <div class="card-subtle" style="border-left:4px solid ${overall >= 75 ? "var(--primary)" : "var(--accent-amber)"};">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <strong style="font-size:15px;">📊 Đánh giá tham khảo chữ viết tay: ${overall}/100 điểm</strong>
              <span class="badge ${overall >= 75 ? "badge-jade" : "badge-amber"}">${overall >= 75 ? "Đạt yêu cầu" : "Cần chỉnh nét"}</span>
            </div>
            <div class="grid-2" style="gap:6px;font-size:12.5px;margin-bottom:8px;">
              <div>• Thứ tự & số nét (${usrCount}/${expCount}): <strong>${orderScore}%</strong></div>
              <div>• Hướng & hình dạng nét: <strong>${shapeDirScore}%</strong></div>
              <div>• Vị trí các nét: <strong>${posScore}%</strong></div>
              <div>• Tỷ lệ & bố cục ô vuông: <strong>${layoutScore}%</strong></div>
            </div>
            <div style="font-size:13px;margin-bottom:6px;">💡 <strong>Chỉ dẫn sửa lỗi:</strong> ${adviceList.join(" ")}</div>
            <div style="font-size:11.5px;color:var(--text-muted);">
              * Lưu ý minh bạch: Điểm số ở chế độ vẽ tự do được tính bằng thuật toán so khớp vector tọa độ với dữ liệu chuẩn Make Me a Hanzi nên mang tính tham khảo hỗ trợ luyện tập. Để kiểm tra chính xác tuyệt đối từng nét một, hãy kết hợp thêm tab "Theo từng nét chuẩn".
            </div>
          </div>
        `;
      };
    }
  }

  return {
    renderHanzi
  };
})();

</script>
  <script data-bundle="js/modules/pinyin-listening.js">
/* -*- coding: utf-8 -*-
 * QChinese – Module 5 (Flagship Interactive Pinyin Pronunciation Lab: 21 Initials, 38 Finals, 16 Whole Syllables,
 * SVG Articulation Diagrams, Aspirated/Retroflex/Nasal Contrast Room, 4-Tier Discrimination Challenge)
 * & Module 7 (Listening Replay + Custom Personal Material Audio/Video Listening Studio)
 */

window.QPinyinListening = (function () {
  /* ==================== PHẦN 5: INTERACTIVE PINYIN LAB ==================== */
  let pyTab = "chart"; // "chart" | "contrast" | "tones" | "combiner" | "challenge"
  let selectedSound = null;
  let selectedKind = "initial"; // "initial" | "final" | "whole"
  let activeContrastGroup = "aspirated";
  let activePairKey = "b/p";
  let challengeGroup = "all"; // all | aspirated | retroflex | nasals | tones
  let challengeTier = "easy"; // easy | medium | hard | advanced
  let currentChallenge = null;
  let challengeAnswered = false;
  let challengeStreak = 0;
  let lastVoiceUrl = null;
  let lastTranscript = "";

  /* SVG Vocal-Tract & Lip/Tongue Diagram for Vietnamese Learners */
  function getArticulationType(sym) {
    const s = String(sym || "").toLowerCase();
    if (["b", "m"].includes(s)) return "bilabial";
    if (s === "p") return "bilabial_asp";
    if (s === "f") return "labiodental";
    if (["d", "n", "l"].includes(s)) return "alveolar";
    if (s === "t") return "alveolar_asp";
    if (["g", "h"].includes(s)) return "velar";
    if (s === "k") return "velar_asp";
    if (["j", "x"].includes(s)) return "palatal";
    if (s === "q") return "palatal_asp";
    if (["z", "s", "zi", "si"].includes(s)) return "dental";
    if (["c", "ci"].includes(s)) return "dental_asp";
    if (["zh", "sh", "r", "zhi", "shi", "ri", "er"].includes(s)) return "retroflex";
    if (["ch", "chi"].includes(s)) return "retroflex_asp";
    if (/(ang|eng|ing|ong|iang|uang|ueng|iong|ying)/.test(s)) return "nasal_back";
    if (/(an|en|in|un|ün|ian|uan|üan|yin|yun|yuan)/.test(s)) return "nasal_front";
    if (/(ü|yu|yue|u|wu)/.test(s)) return "rounded_u";
    return "open";
  }

  function renderArticulationSVG(symbol, compact = false) {
    const type = getArticulationType(symbol);
    const isAsp = type.endsWith("_asp");
    const base = type.replace("_asp", "");
    const h = compact ? 112 : 146;

    // Tongue path shapes inside vocal tract (viewBox 0 0 240 140)
    let tonguePath = "M 65 112 Q 115 94 172 104"; // neutral open
    let highlightDot = "";
    let caption = "Khẩu hình mở tự nhiên";

    if (base === "bilabial") {
      tonguePath = "M 70 112 Q 120 100 175 106";
      highlightDot = `<circle cx="48" cy="78" r="9" fill="var(--accent-red)" opacity="0.28"/><circle cx="48" cy="78" r="4" fill="var(--accent-red)"/>`;
      caption = isAsp ? "Khép 2 môi → BẬT MẠNH luồng hơi ra!" : "Khép 2 môi mở nhanh — KHÔNG bật hơi";
    } else if (base === "labiodental") {
      tonguePath = "M 70 112 Q 120 100 175 106";
      highlightDot = `<circle cx="56" cy="74" r="8" fill="var(--accent-blue)" opacity="0.28"/>`;
      caption = "Răng cửa trên chạm nhẹ môi dưới";
    } else if (base === "alveolar") {
      tonguePath = "M 72 64 Q 110 88 175 104";
      highlightDot = `<circle cx="72" cy="58" r="8" fill="var(--accent-red)" opacity="0.28"/>`;
      caption = isAsp ? "Đầu lưỡi chạm lợi trên → BẬT HƠI mạnh" : "Đầu lưỡi chạm lợi trên — KHÔNG bật hơi";
    } else if (base === "velar") {
      tonguePath = "M 75 104 Q 132 54 176 92";
      highlightDot = `<circle cx="136" cy="56" r="9" fill="var(--accent-red)" opacity="0.28"/>`;
      caption = isAsp ? "Gốc lưỡi nâng chạm ngạc mềm → BẬT HƠI từ họng" : "Gốc lưỡi chạm ngạc mềm — KHÔNG bật hơi";
    } else if (base === "palatal") {
      tonguePath = "M 66 94 Q 104 54 174 96";
      highlightDot = `<circle cx="102" cy="54" r="9" fill="var(--primary)" opacity="0.3"/>`;
      caption = isAsp ? "Đầu lưỡi chạm răng dưới, mặt lưỡi nâng → BẬT HƠI" : "Đầu lưỡi chạm răng dưới, mặt lưỡi nâng (không hơi)";
    } else if (base === "dental") {
      tonguePath = "M 62 72 Q 108 92 175 102";
      highlightDot = `<circle cx="62" cy="70" r="8" fill="var(--accent-blue)" opacity="0.32"/>`;
      caption = isAsp ? "Lưỡi THẲNG sát răng cửa → BẬT HƠI xì mạnh" : "Lưỡi THẲNG sát răng cửa — KHÔNG cong lưỡi";
    } else if (base === "retroflex") {
      tonguePath = "M 92 52 Q 80 76 116 92 Q 150 96 176 102";
      highlightDot = `<circle cx="92" cy="50" r="10" fill="var(--accent-red)" opacity="0.3"/>`;
      caption = isAsp ? "Đầu lưỡi UỐN CONG lên ngạc cứng → BẬT HƠI mạnh!" : "Đầu lưỡi UỐN CONG lên ngạc cứng (âm dày)";
    } else if (base === "nasal_front") {
      tonguePath = "M 70 60 Q 112 92 175 102";
      highlightDot = `<path d="M 142 42 Q 105 18 52 38" fill="none" stroke="var(--accent-blue)" stroke-width="2.5" stroke-dasharray="4,3"/>`;
      caption = "Mũi trước (-n): Đầu lưỡi chạm lợi trên, kết gọn";
    } else if (base === "nasal_back") {
      tonguePath = "M 76 104 Q 134 52 176 92";
      highlightDot = `<path d="M 150 42 Q 112 14 52 36" fill="none" stroke="var(--accent-amber)" stroke-width="3" stroke-dasharray="4,3"/>`;
      caption = "Mũi sau (-ng): Gốc lưỡi nâng, vang sâu khoang mũi";
    } else if (base === "rounded_u") {
      tonguePath = "M 74 96 Q 124 80 175 96";
      highlightDot = `<ellipse cx="44" cy="78" rx="6" ry="11" fill="none" stroke="var(--primary)" stroke-width="3"/>`;
      caption = "Giữ hai môi CHỤM TRÒN cố định (như huýt sáo)";
    }

    const puffArrows = isAsp
      ? `<g stroke="var(--accent-red)" stroke-width="2.5" stroke-linecap="round">
           <line x1="38" y1="74" x2="10" y2="66"/><polyline points="16,62 10,66 15,71" fill="none"/>
           <line x1="38" y1="80" x2="8" y2="80"/><polyline points="14,76 8,80 14,84" fill="none"/>
           <line x1="38" y1="86" x2="12" y2="94"/><polyline points="17,89 12,94 18,97" fill="none"/>
         </g>`
      : `<text x="10" y="84" font-size="10" fill="var(--text-muted)">Hơi êm</text>`;

    return `
      <div style="background:var(--bg-subtle);border:1px solid var(--border-color);border-radius:12px;padding:8px;text-align:center;">
        <svg viewBox="0 0 240 132" style="width:100%;max-width:260px;height:${h}px;display:block;margin:0 auto;">
          <!-- Nasal cavity & palate outline -->
          <path d="M 52 40 Q 95 26 148 36 Q 178 44 186 78" fill="none" stroke="var(--border-strong)" stroke-width="2"/>
          <!-- Hard & soft palate -->
          <path d="M 58 62 Q 92 44 136 48 Q 162 52 174 72" fill="none" stroke="var(--text-secondary)" stroke-width="3" stroke-linecap="round"/>
          <!-- Upper & lower teeth -->
          <rect x="54" y="62" width="6" height="10" rx="2" fill="var(--bg-surface)" stroke="var(--text-secondary)" stroke-width="1.5"/>
          <rect x="54" y="84" width="6" height="9" rx="2" fill="var(--bg-surface)" stroke="var(--text-secondary)" stroke-width="1.5"/>
          <!-- Lips -->
          <path d="M 46 66 Q 52 72 48 75" fill="none" stroke="var(--text-main)" stroke-width="3" stroke-linecap="round"/>
          <path d="M 46 92 Q 52 86 48 83" fill="none" stroke="var(--text-main)" stroke-width="3" stroke-linecap="round"/>
          <!-- Tongue -->
          <path d="${tonguePath}" fill="none" stroke="var(--primary)" stroke-width="6" stroke-linecap="round"/>
          ${highlightDot}
          ${puffArrows}
          <text x="182" y="34" font-size="9" fill="var(--text-muted)">Khoang mũi</text>
          <text x="104" y="126" font-size="9.5" fill="var(--text-secondary)" text-anchor="middle">Lưỡi</text>
        </svg>
        <div style="font-size:12px;font-weight:600;color:var(--primary);margin-top:2px;">${QCore.escapeHtml(caption)}</div>
      </div>
    `;
  }

  function renderPinyin(container, params = {}) {
    const data = window.QCHINESE_PINYIN;
    if (params && params.tab) pyTab = params.tab;
    if (params && params.pair) {
      activePairKey = params.pair;
      pyTab = "contrast";
      for (const g of data.contrastGroups || []) {
        if (g.pairs.some((p) => p.key === params.pair)) {
          activeContrastGroup = g.id;
          break;
        }
      }
    }

    const st = QCore.getState();
    const weakPairs = Object.entries((st && st.phoneticErrors) || {})
      .filter(([, v]) => (v.wrong || 0) > 0)
      .sort((a, b) => b[1].wrong - a[1].wrong)
      .slice(0, 4);

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2>🎵 Phòng Luyện Phát Âm Pinyin Chuyên Sâu (Thanh mẫu · Vận mẫu · Thanh điệu)</h2>
          <p>Thiết kế riêng cho người Việt: Sơ đồ lưỡi – môi trực quan, phân biệt chính xác âm bật hơi, cong lưỡi, mũi -n/-ng và bài luyện nghe 4 cấp độ.</p>
        </div>
        ${weakPairs.length ? `
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            <span style="font-size:12.5px;color:var(--text-muted);">Âm bạn hay nhầm:</span>
            ${weakPairs.map(([k, v]) => `<button class="btn btn-outline btn-sm" style="border-color:var(--accent-red);color:var(--accent-red);" data-jump-pair="${QCore.escapeHtml(k)}">⚠️ ${QCore.escapeHtml(k)} (${v.wrong} lỗi)</button>`).join("")}
          </div>
        ` : ""}
      </div>

      <div class="tabs-bar" style="margin-bottom:20px;flex-wrap:wrap;">
        <button class="tab-pill ${pyTab === "chart" ? "active" : ""}" data-pytab="chart">1. Bảng Pinyin Tương Tác (21+38+16)</button>
        <button class="tab-pill ${pyTab === "contrast" ? "active" : ""}" data-pytab="contrast">2. Đối chiếu Âm Khó (b/p · zh/z · an/ang)</button>
        <button class="tab-pill ${pyTab === "tones" ? "active" : ""}" data-pytab="tones">3. 4 Thanh điệu & Biến điệu</button>
        <button class="tab-pill ${pyTab === "combiner" ? "active" : ""}" data-pytab="combiner">4. Bảng Ghép Âm</button>
        <button class="tab-pill ${pyTab === "challenge" ? "active" : ""}" data-pytab="challenge">5. CHALLENGE Nghe & Phân biệt</button>
      </div>

      <div id="pinyin-stage"></div>
    `;

    container.querySelectorAll("[data-jump-pair]").forEach((b) => {
      b.onclick = () => renderPinyin(container, { pair: b.getAttribute("data-jump-pair") });
    });

    container.querySelectorAll("[data-pytab]").forEach((btn) => {
      btn.onclick = () => {
        pyTab = btn.getAttribute("data-pytab");
        renderPinyin(container);
      };
    });

    const stage = container.querySelector("#pinyin-stage");
    if (pyTab === "chart") renderInteractiveChart(stage, data, container);
    else if (pyTab === "contrast") renderContrastLab(stage, data, container);
    else if (pyTab === "tones") renderTonesTab(stage, data);
    else if (pyTab === "combiner") renderCombinerTab(stage, data);
    else renderChallengeTab(stage, data, container);
  }

  /* ---------- TAB 1: FULL INTERACTIVE PINYIN CHART ---------- */
  function renderInteractiveChart(stage, data, container) {
    const allFinals = [...data.finals.single, ...data.finals.compound, ...data.finals.nasal];
    const wholes = data.wholeSyllables || [];
    if (!selectedSound) {
      selectedSound = data.initials[0];
      selectedKind = "initial";
    }
    const curr = selectedSound;
    const groups = [...new Set(data.initials.map((i) => i.group))];

    stage.innerHTML = `
      <div class="grid-2" style="align-items:start;">
        <div style="display:flex;flex-direction:column;gap:14px;">
          <!-- 21 Initials + y/w -->
          <div class="card" style="padding:18px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
              <h3 style="margin:0;font-size:16px;">🟦 Thanh mẫu (声母 · 21 âm đầu + 2 quy ước y/w)</h3>
              <span class="badge badge-jade">Bấm để nghe</span>
            </div>
            ${groups.map((g) => `
              <div style="margin-bottom:10px;">
                <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:5px;">${QCore.escapeHtml(g)}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  ${data.initials.filter((i) => i.group === g).map((i) => `
                    <button class="btn ${selectedKind === "initial" && curr.symbol === i.symbol ? "btn-primary" : "btn-outline"} btn-sm" style="min-width:48px;font-size:16px;font-weight:700;" data-pick-kind="initial" data-pick-sym="${QCore.escapeHtml(i.symbol)}">
                      ${QCore.escapeHtml(i.symbol)}
                    </button>
                  `).join("")}
                </div>
              </div>
            `).join("")}
          </div>

          <!-- 38 Finals -->
          <div class="card" style="padding:18px;">
            <h3 style="margin:0 0 10px;font-size:16px;">🟩 Vận mẫu (韵母 · Đơn · Kép · Mũi -n/-ng)</h3>
            ${[
              ["Đơn vận mẫu (6)", data.finals.single],
              ["Phức vận mẫu (13)", data.finals.compound],
              ["Vận mẫu mũi trước (-n), mũi sau (-ng) & er", data.finals.nasal]
            ].map(([title, arr]) => `
              <div style="margin-bottom:10px;">
                <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:5px;">${title}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  ${arr.map((f) => `
                    <button class="btn ${selectedKind === "final" && curr.symbol === f.symbol ? "btn-primary" : "btn-outline"} btn-sm" style="font-size:14.5px;font-weight:700;" data-pick-kind="final" data-pick-sym="${QCore.escapeHtml(f.symbol)}">
                      ${QCore.escapeHtml(f.symbol)}
                    </button>
                  `).join("")}
                </div>
              </div>
            `).join("")}
          </div>

          <!-- 16 Whole-Reading Syllables -->
          <div class="card" style="padding:18px;">
            <h3 style="margin:0 0 8px;font-size:16px;">🟨 16 Âm tiết đọc liền (整体认读音节)</h3>
            <p style="margin:0 0 10px;font-size:12.5px;color:var(--text-secondary);">Đọc trực tiếp nguyên âm tiết, KHÔNG tách ghép đánh vần:</p>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${wholes.map((w) => `
                <button class="btn ${selectedKind === "whole" && curr.symbol === w.symbol ? "btn-primary" : "btn-outline"} btn-sm" style="font-size:14.5px;font-weight:700;" data-pick-kind="whole" data-pick-sym="${QCore.escapeHtml(w.symbol)}">
                  ${QCore.escapeHtml(w.symbol)}
                </button>
              `).join("")}
            </div>
          </div>
        </div>

        <!-- Sticky Articulation Inspector -->

  /* ---------- TAB 5: 4-TIER LISTENING DISCRIMINATION CHALLENGE ---------- */
  function buildChallengeQuestion(data) {
    if (challengeGroup === "tones") {
      const drills = data.listeningDrills || [];
      const d = drills[Math.floor(Math.random() * drills.length)];
      return {
        pairKey: `tone_${d.correctTone}`,
        audioText: d.audioText,
        prompt: "Nghe thật kỹ đường cao độ và chọn đúng Thanh điệu:",
        options: d.options.map((opt, idx) => ({ label: opt, isCorrect: idx + 1 === d.correctTone })),
        explain: d.hint,
        contrastPair: null
      };
    }

    const groups = (data.contrastGroups || []).filter((g) => challengeGroup === "all" || g.id === challengeGroup);
    const allPairs = groups.flatMap((g) => g.pairs);
    const pair = allPairs[Math.floor(Math.random() * allPairs.length)];
    const pickA = Math.random() < 0.5;

    let itemPair = null;
    if (challengeTier === "easy" || challengeTier === "medium") {
      itemPair = pair.syllables[Math.floor(Math.random() * pair.syllables.length)];
    } else if (challengeTier === "hard" && pair.words && pair.words.length) {
      itemPair = pair.words[Math.floor(Math.random() * pair.words.length)];
    } else if (challengeTier === "advanced" && pair.sentences && pair.sentences.length) {
      itemPair = pair.sentences[Math.floor(Math.random() * pair.sentences.length)];
    } else {
      itemPair = pair.syllables[0];
    }

    const target = pickA ? itemPair.a : itemPair.b;
    const other = pickA ? itemPair.b : itemPair.a;
    const labelA = challengeTier === "easy"
      ? `Âm "${pair.a}" — ${itemPair.a.py}`
      : `${itemPair.a.py} (${itemPair.a.hz} · ${itemPair.a.vi})`;
    const labelB = challengeTier === "easy"
      ? `Âm "${pair.b}" — ${itemPair.b.py}`
      : `${itemPair.b.py} (${itemPair.b.hz} · ${itemPair.b.vi})`;

    return {
      pairKey: pair.key,
      audioText: target.hz,
      otherAudio: other.hz,
      prompt: `Bạn vừa nghe thấy âm "${pair.a}" hay "${pair.b}"?`,
      options: [
        { label: labelA, isCorrect: pickA },
        { label: labelB, isCorrect: !pickA }

      explain: `${pair.explain} | Âm đúng: ${target.hz} (${target.py} – ${target.vi}) vs âm đối chiếu: ${other.hz} (${other.py} – ${other.vi}).`,
      target,
      other
    };
  }
