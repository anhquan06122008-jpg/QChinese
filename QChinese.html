        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn ${matRdShowGloss ? "btn-primary" : "btn-outline"} btn-sm" id="mrd-tog-gloss">👁️ ${matRdShowGloss ? "Đang hiện Chú thích dưới từ" : "Ẩn chú thích (Tự luyện đọc)"}</button>
          <button class="btn btn-soft btn-sm" id="mrd-speak-all">🔊 Đọc toàn bài</button>
          <button class="btn btn-outline btn-sm" id="mrd-back-std">← Về bài đọc HSK</button>
          <button class="btn btn-outline btn-sm" id="mrd-back-lib">📁 Kho tài liệu</button>
        </div>
      </div>

      <div class="reading-layout">
        <div class="card">
          <div style="display:flex;flex-wrap:wrap;gap:6px 4px;align-items:flex-end;line-height:1.4;">
            ${tokens.map((tk, idx) => {
              if (!tk.isHanzi) {
                return tk.text === "\n" ? `<div style="flex-basis:100%;height:8px;"></div>` : `<span style="font-size:22px;padding:0 2px;">${QCore.escapeHtml(tk.text)}</span>`;
              }
              const isMarked = markedSet.has(tk.text);
              const gloss = tk.entry ? (tk.entry.meanings.vietnamese[0] || tk.entry.meanings.english[0] || "").split(/[;,]/)[0].slice(0, 18) : "";
              const py = tk.entry ? tk.entry.pinyin : "";
              return `
                <button type="button" data-mrd-tok="${idx}" style="background:${isMarked ? "var(--bg-warn-soft)" : "transparent"};border:none;border-bottom:2px solid ${isMarked ? "var(--accent-amber)" : tk.entry ? "var(--primary-light)" : "var(--border-color)"};border-radius:6px;padding:4px 5px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;color:var(--text-main);">
                  ${matRdShowGloss && py ? `<span class="pinyin-text" style="font-size:11px;color:var(--primary);">${QCore.escapeHtml(py)}</span>` : ""}
                  <span class="hanzi-text" style="font-size:24px;font-weight:500;">${QCore.escapeHtml(tk.text)}</span>
                  ${matRdShowGloss && gloss ? `<span style="font-size:10.5px;color:var(--text-muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${QCore.escapeHtml(gloss)}</span>` : ""}

              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <div>
                  <span class="hanzi-text" style="font-size:34px;font-weight:700;">${QCore.escapeHtml(sel.text)}</span>
                  ${sel.entry ? `<span class="pinyin-text" style="font-size:18px;color:var(--primary);font-weight:700;margin-left:8px;">${QCore.escapeHtml(sel.entry.pinyin)}</span>` : ""}

                <button class="btn btn-primary btn-sm" id="mrd-speak-tok">🔊 Nghe</button>
              </div>
              <div class="card-subtle" style="margin-bottom:10px;font-size:13.5px;">
                ${sel.entry ? `
                  ${sel.entry.meanings.vietnamese.length ? `<div><strong>🇻🇳 Việt:</strong> ${QCore.escapeHtml(sel.entry.meanings.vietnamese.join("; "))}</div>` : ""}
                  ${sel.entry.meanings.english.length ? `<div style="margin-top:4px;color:var(--text-secondary);"><strong>🇬🇧 Anh:</strong> ${QCore.escapeHtml(sel.entry.meanings.english.slice(0, 3).join("; "))}</div>` : ""}
                  ${sel.entry.han_viet ? `<div style="margin-top:4px;"><strong>Hán Việt:</strong> ${QCore.escapeHtml(sel.entry.han_viet.toUpperCase())}</div>` : ""}
                ` : `<div>Chưa có trong cấp HSK đang nạp — bấm "AI giải thích sâu" hoặc mở Kho từ vựng cấp cao hơn.</div>`}
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn btn-soft btn-sm" id="mrd-mark-tok">🖍️ Đánh dấu từ mới</button>
                <button class="btn btn-outline btn-sm" id="mrd-save-nb">📒 Lưu Sổ tay</button>
                <button class="btn btn-outline btn-sm" id="mrd-ask-ai">🤖 AI giải thích</button>
              </div>
            ` : `<div class="card-subtle" style="font-size:13px;color:var(--text-muted);">Bấm vào bất kỳ từ chữ Hán nào bên trái để nghe phát âm & tra nghĩa ngay lập tức!</div>`}
          </div>

          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <h3 style="margin:0;font-size:16px;">📝 Tự kiểm tra Đọc hiểu</h3>
              <span class="badge badge-amber">AI Generated</span>
            </div>
            <p style="font-size:13px;color:var(--text-secondary);margin:0 0 8px;">Tóm tắt ý chính của đoạn văn trên bằng 1–2 câu tiếng Trung hoặc tiếng Việt để hoàn thành bài đọc:</p>
            <textarea class="textarea-field" id="mrd-summary" rows="3" placeholder="Nhập câu tóm tắt nội dung bài đọc..."></textarea>
            <button class="btn btn-primary btn-sm" style="margin-top:8px;" id="mrd-complete">✅ Ghi nhận hoàn thành bài đọc</button>
            ${sentences.length ? `<div style="margin-top:10px;font-size:12px;color:var(--text-muted);">Số câu trong bài gốc: ${sentences.length} câu · Đã tách thành ${tokens.filter((t) => t.isHanzi).length} cụm từ.</div>` : ""}
          </div>
        </div>
      </div>
    `;

    container.querySelector("#mrd-tog-gloss").onclick = () => { matRdShowGloss = !matRdShowGloss; renderMaterialReadingStudio(container, mat); };
    container.querySelector("#mrd-speak-all").onclick = () => QCore.speakChinese((mat.content || "").slice(0, 260));
    container.querySelector("#mrd-back-std").onclick = () => { activeReadMatId = null; renderReading(container); };
    container.querySelector("#mrd-back-lib").onclick = () => window.QApp.navigate("materials");

    container.querySelectorAll("[data-mrd-tok]").forEach((btn) => {
      btn.onclick = () => {
        const tk = tokens[Number(btn.getAttribute("data-mrd-tok"))];
        matRdSelectedWord = tk;
        QCore.speakChinese(tk.text);
        renderMaterialReadingStudio(container, mat);
      };
    });

    if (sel) {
      container.querySelector("#mrd-speak-tok").onclick = () => QCore.speakChinese(sel.text);
      container.querySelector("#mrd-mark-tok").onclick = () => {
        const idx = st.markedWords.indexOf(sel.text);
        if (idx >= 0) st.markedWords.splice(idx, 1);
        else st.markedWords.push(sel.text);
        QCore.saveState(false);
        renderMaterialReadingStudio(container, mat);
      };
      container.querySelector("#mrd-save-nb").onclick = () => {
        QCore.addToNotebook({
          category: "vocab",
          hanzi: sel.text,
          pinyin: sel.entry ? sel.entry.pinyin : "",
          english: sel.entry ? (sel.entry.meanings.english || []).slice(0, 2).join("; ") : "",
          vietnamese: sel.entry ? (sel.entry.meanings.vietnamese[0] || sel.entry.meanings.english[0] || "") : ""
        });
      };
      container.querySelector("#mrd-ask-ai").onclick = () => window.QApp.navigate("ai-tutor", { tab: "explain_word", word: sel.text });
    }

    container.querySelector("#mrd-complete").onclick = () => {
      const sum = (container.querySelector("#mrd-summary").value || "").trim();
      QCore.recordMaterialPractice(mat.id, { mode: "Đọc hiểu tương tác", score: 100, answer: sum || "Đã hoàn thành đọc hiểu", status: "completed" });
      QCore.updateSkillScore("reading", 90);
      QCore.showToast("🎉 Đã lưu hoàn thành bài đọc vào Kho tài liệu!");
    };
  }

    if (window.QPinyinIME) QPinyinIME.attachAll(container);
    container.querySelector("#mspk-back-std").onclick = () => { activeSpkMatId = null; renderSpeaking(container); };
    container.querySelector("#mspk-back-lib").onclick = () => window.QApp.navigate("materials");
    container.querySelector("#mspk-listen").onclick = () => QCore.speakChinese(mat.content || mat.title);

    container.querySelector("#mspk-rec").onclick = () => {
      const out = container.querySelector("#mspk-rec-out");
      out.innerHTML = `<div class="card-subtle" style="color:var(--accent-red);">🔴 Đang thu âm 6 giây... Hãy trả lời bằng tiếng Trung!</div>`;
      QCore.captureLearnerVoice({
        durationMs: 6000,
        onAudioReady: (url, transcript) => {
          if (transcript) {
            const ta = container.querySelector("#mspk-script");
            ta.value = (ta.value ? ta.value + " " : "") + transcript;
          }
          out.innerHTML = `
            <div class="card-subtle">
              <audio controls src="${url}" style="width:100%;height:36px;margin-bottom:6px;"></audio>
              <div style="font-size:12.5px;color:var(--text-secondary);">${transcript ? `✅ Nhận diện: "${QCore.escapeHtml(transcript)}" (đã chép sang ô kịch bản bên phải để AI sửa ngữ pháp!).` : "🎧 Đã lưu băng thu âm. Nghe lại để tự kiểm tra độ rõ ràng & thanh điệu."}</div>
            </div>
          `;
        }
      });
    };

    container.querySelector("#mspk-eval").onclick = async () => {
      const text = (container.querySelector("#mspk-script").value || "").trim();
      if (!text) { QCore.showToast("Vui lòng thu âm hoặc nhập câu trả lời trước!"); return; }
      const out = container.querySelector("#mspk-eval-out");
      out.innerHTML = `<div class="card-subtle">⏳ AI đang chấm bài nói theo chủ đề "${QCore.escapeHtml(mat.title)}"...</div>`;
      const res = await window.QAiTutor.evaluateSentenceSmart({
        text,
        prompt: mat.content || mat.title,
        hskLevel: mat.hskLevel || 1
      });
      QCore.recordMaterialPractice(mat.id, { mode: "Luyện Nói", score: res.score, answer: text, status: (res.score || 0) >= 70 ? "completed" : "in_progress" });
      QCore.logDailyActivity("speakingMinutes", 2);
      QCore.updateSkillScore("speaking", res.score || 75);
      out.innerHTML = window.QAiTutor.renderSentenceEvaluationCard(res);
    };
  }

  return {
    renderGrammar,
    renderSpeaking,
    renderReading,
    renderWriting
  };
})();

</script>
  <script data-bundle="js/modules/notebook-analytics-settings.js">
/* -*- coding: utf-8 -*-
 * QChinese – Modules 11, 12, 13:
 * - Personal Chinese Notebook (PHẦN 8)
 * - Progress Analytics & AI Diagnosis Charts by Day/Week/Month (PHẦN 9)
 * - Settings, Multi-User Account Security & Backup/Restore (PHẦN 10 & 11)
 */

window.QNotebookAnalyticsSettings = (function () {
  /* ==================== PHẦN 8: CHINESE NOTEBOOK ==================== */
  const NB_CATEGORIES = [
    { id: "all", label: "Tất cả mục lưu" },
    { id: "vocab", label: "📖 Từ vựng mới" },
    { id: "hard_hanzi", label: "✍️ Chữ Hán khó nhớ" },
    { id: "grammar", label: "🧩 Ngữ pháp quan trọng" },
    { id: "sentence", label: "💬 Câu ví dụ" },
    { id: "wrong_write", label: "⚠️ Thường viết sai" },
    { id: "wrong_pron", label: "🎙️ Thường phát âm sai" },
    { id: "note", label: "📝 Ghi chú cá nhân" }
  ];

  let nbCat = "all";
  let nbSearch = "";
  let nbReviewMode = false;
  let nbReviewIdx = 0;
  let nbRevealed = false;
  let editingId = null;

  function renderNotebook(container) {
    const st = QCore.getState();
    const allItems = st.notebook || [];

    const filtered = allItems.filter((item) => {
      if (nbCat !== "all" && item.category !== nbCat) return false;

        const q = nbSearch.toLowerCase();
        const hay = `${item.hanzi} ${item.pinyin} ${item.english} ${item.vietnamese} ${item.note} ${item.example}`.toLowerCase();

      }

    });

    container.innerHTML = `

        </div>
      </div>

      ${
        nbReviewMode
          ? renderNotebookReviewHTML(filtered)
          : `
        <!-- Add / Edit Form -->
        <div class="card" style="margin-bottom:18px;">
          <h3 style="margin:0 0 12px;font-size:16px;">${editingId ? "✏️ Chỉnh sửa mục Sổ tay" : "➕ Thêm mục mới vào Sổ tay"}</h3>
          <div class="grid-3" style="gap:10px;margin-bottom:10px;">
            <select class="select-field" id="nb-f-cat">
              ${NB_CATEGORIES.filter((c) => c.id !== "all")
                .map((c) => `<option value="${c.id}">${c.label}</option>`)
                .join("")}
            </select>
            <input class="input-field hanzi-text" id="nb-f-hz" data-pinyin-ime="true" placeholder="Chữ Hán Giản thể (gõ Pinyin để gợi ý)...">
            <input class="input-field pinyin-text" id="nb-f-py" data-pinyin-ime="true" data-pinyin-mode="pinyin-only" placeholder="Pinyin có dấu (vd: xǐhuan)...">
            <input class="input-field" id="nb-f-vi" placeholder="Nghĩa tiếng Việt...">
            <input class="input-field" id="nb-f-en" placeholder="Nghĩa tiếng Anh...">
            <input class="input-field hanzi-text" id="nb-f-ex" data-pinyin-ime="true" placeholder="Câu ví dụ thực tế...">
          </div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <input class="input-field" id="nb-f-note" style="flex:1;min-width:220px;" placeholder="Ghi chú cá nhân / mẹo nhớ...">
            <select class="select-field" id="nb-f-mem" style="width:170px;">
              <option value="1">Mức nhớ: ★☆☆☆☆ (1)</option>
              <option value="2">Mức nhớ: ★★☆☆☆ (2)</option>
              <option value="3" selected>Mức nhớ: ★★★☆☆ (3)</option>
              <option value="4">Mức nhớ: ★★★★☆ (4)</option>
              <option value="5">Mức nhớ: ★★★★★ (5)</option>
            </select>
            ${editingId ? `<button class="btn btn-outline" id="nb-cancel-edit">Hủy</button>` : ""}
            <button class="btn btn-primary" id="nb-save-btn">${editingId ? "Cập nhật" : "Lưu vào Sổ tay"}</button>
          </div>
        </div>

        <!-- Search & Category Filter -->
        <div class="card" style="padding:14px 18px;margin-bottom:18px;">
          <div style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;">
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${NB_CATEGORIES.map(
                (c) => `<button class="btn ${nbCat === c.id ? "btn-primary" : "btn-outline"} btn-sm" data-nbcat="${c.id}">${c.label}</button>`
              ).join("")}
            </div>
            <input class="input-field" id="nb-search-inp" style="max-width:280px;padding:7px 12px;" placeholder="🔍 Tìm chữ Hán, Pinyin, nghĩa Việt..." value="${QCore.escapeHtml(nbSearch)}">
          </div>

        <!-- Entries List -->
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${
            !filtered.length
              ? `<div class="card" style="text-align:center;padding:34px;color:var(--text-muted);">Chưa có mục nào trong phân mục này. Bạn có thể lưu trực tiếp từ trang Học từ vựng, Học chữ Hán, Luyện đọc hoặc thêm ở khung phía trên!</div>`
              : filtered
                  .map((item) => {
                    const catObj = NB_CATEGORIES.find((c) => c.id === item.category) || NB_CATEGORIES[1];
                    const stars = "★".repeat(item.memoryLevel || 1) + "☆".repeat(5 - (item.memoryLevel || 1));
                    return `
                    <div class="card" style="padding:16px 20px;">
                      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;">
                        <div>
                          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">
                            <span class="badge badge-jade">${catObj.label}</span>
                            <span class="badge badge-amber" title="Mức độ ghi nhớ">${stars}</span>
                            <span style="font-size:12px;color:var(--text-muted);">Ngày lưu: ${QCore.escapeHtml(item.savedAt || "")}</span>
                          </div>
                          <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">
                            <span class="hanzi-calligraphy" style="font-size:32px;">${QCore.escapeHtml(item.hanzi)}</span>
                            <span class="pinyin-text" style="font-size:18px;font-weight:700;color:var(--primary);">${QCore.escapeHtml(item.pinyin)}</span>
                          </div>
                          <div style="font-size:14px;margin-top:4px;">🇻🇳 <strong>${QCore.escapeHtml(item.vietnamese)}</strong> ${item.english ? `· 🇬🇧 ${QCore.escapeHtml(item.english)}` : ""}</div>
                          ${item.example ? `<div style="font-size:13px;color:var(--text-secondary);margin-top:4px;" class="hanzi-text">💬 Ví dụ: ${QCore.escapeHtml(item.example)}</div>` : ""}
                          ${item.note ? `<div style="font-size:13px;color:var(--accent-amber);margin-top:4px;">📝 Ghi chú: ${QCore.escapeHtml(item.note)}</div>` : ""}
                        </div>

                        <div style="display:flex;gap:6px;flex-wrap:wrap;">
                          <button class="btn btn-soft btn-sm" data-nb-speak="${QCore.escapeHtml(item.hanzi)}">🔊 Phát âm</button>
                          <button class="btn btn-outline btn-sm" data-nb-edit="${item.id}">✏️ Sửa</button>
                          <button class="btn btn-danger btn-sm" data-nb-del="${item.id}">🗑️ Xóa</button>
                        </div>
                      </div>
                    </div>

                  })
                  .join("")
          }
        </div>
      `
      }
    `;

    container.querySelector("#nb-tog-review").onclick = () => {
      nbReviewMode = !nbReviewMode;
      nbReviewIdx = 0;
      nbRevealed = false;
      renderNotebook(container);
    };

    container.querySelector("#nb-export-json").onclick = () => {
      const blob = new Blob([JSON.stringify(allItems, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `qchinese_notebook_${QCore.todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    if (nbReviewMode) {
      bindNotebookReviewEvents(container, filtered);
      return;
    }

    // Populate form if editing
    if (editingId) {
      const target = allItems.find((x) => x.id === editingId);
      if (target) {
        container.querySelector("#nb-f-cat").value = target.category || "vocab";
        container.querySelector("#nb-f-hz").value = target.hanzi || "";
        container.querySelector("#nb-f-py").value = target.pinyin || "";
        container.querySelector("#nb-f-vi").value = target.vietnamese || "";
        container.querySelector("#nb-f-en").value = target.english || "";
        container.querySelector("#nb-f-ex").value = target.example || "";
        container.querySelector("#nb-f-note").value = target.note || "";
        container.querySelector("#nb-f-mem").value = String(target.memoryLevel || 3);
      }
      const cancelBtn = container.querySelector("#nb-cancel-edit");
      if (cancelBtn) {
        cancelBtn.onclick = () => {
          editingId = null;
          renderNotebook(container);
        };
      }
    }

    container.querySelector("#nb-save-btn").onclick = () => {
      const hz = container.querySelector("#nb-f-hz").value.trim();
      if (!hz) {
        QCore.showToast("Vui lòng nhập Chữ Hán hoặc tiêu đề ghi chú!");
        return;
      }
      const payload = {
        category: container.querySelector("#nb-f-cat").value,
        hanzi: hz,
        pinyin: container.querySelector("#nb-f-py").value.trim(),
        vietnamese: container.querySelector("#nb-f-vi").value.trim(),
        english: container.querySelector("#nb-f-en").value.trim(),
        example: container.querySelector("#nb-f-ex").value.trim(),
        note: container.querySelector("#nb-f-note").value.trim(),
        memoryLevel: Number(container.querySelector("#nb-f-mem").value) || 3
      };

      if (editingId) {
        const idx = st.notebook.findIndex((x) => x.id === editingId);
        if (idx >= 0) {
          st.notebook[idx] = Object.assign({}, st.notebook[idx], payload);
        }
        editingId = null;
        QCore.saveState(true);
        QCore.showToast("Đã cập nhật mục Sổ tay!");
      } else {
        QCore.addToNotebook(payload);
      }
      renderNotebook(container);
    };

    container.querySelectorAll("[data-nbcat]").forEach((b) => {
      b.onclick = () => {
        nbCat = b.getAttribute("data-nbcat");
        renderNotebook(container);
      };
    });

    const searchInp = container.querySelector("#nb-search-inp");
    searchInp.oninput = (e) => {
      nbSearch = e.target.value;
      renderNotebook(container);
      const ni = container.querySelector("#nb-search-inp");
      ni.focus();
      ni.setSelectionRange(ni.value.length, ni.value.length);
    };

    container.querySelectorAll("[data-nb-speak]").forEach((b) => {
      b.onclick = () => QCore.speakChinese(b.getAttribute("data-nb-speak"));
    });
    container.querySelectorAll("[data-nb-edit]").forEach((b) => {
      b.onclick = () => {
        editingId = b.getAttribute("data-nb-edit");
        renderNotebook(container);
      };
    });
    container.querySelectorAll("[data-nb-del]").forEach((b) => {
      b.onclick = () => {
        const id = b.getAttribute("data-nb-del");
        st.notebook = st.notebook.filter((x) => x.id !== id);
        QCore.saveState(true);
        renderNotebook(container);
      };
    });
  }

  function renderNotebookReviewHTML(list) {
    if (!list.length) {
      return `<div class="card" style="text-align:center;padding:34px;">Sổ tay hiện chưa có mục nào để ôn tập.</div>`;
    }
    const item = list[nbReviewIdx % list.length];
    return `
      <div class="card" style="max-width:640px;margin:0 auto;text-align:center;">
        <span class="badge badge-jade">Ôn tập Sổ tay (${(nbReviewIdx % list.length) + 1}/${list.length})</span>
        <div class="hanzi-calligraphy" style="font-size:66px;margin:14px 0 8px;">${QCore.escapeHtml(item.hanzi)}</div>
        <button class="btn btn-soft btn-sm" id="nbr-speak" style="margin-bottom:14px;">🔊 Nghe phát âm</button>
        ${
          !nbRevealed
            ? `<div><button class="btn btn-primary" id="nbr-reveal">👁️ Hiện Pinyin & Nghĩa</button></div>`
            : `
            <div class="card-subtle" style="text-align:left;margin-bottom:14px;">
              <div style="font-size:20px;font-weight:700;color:var(--primary);">${QCore.escapeHtml(item.pinyin)}</div>
              <div>🇻🇳 <strong>${QCore.escapeHtml(item.vietnamese)}</strong></div>
              <div>🇬🇧 ${QCore.escapeHtml(item.english)}</div>
              ${item.example ? `<div style="margin-top:4px;">💬 ${QCore.escapeHtml(item.example)}</div>` : ""}
            </div>
            <div style="display:flex;justify-content:center;gap:8px;">
              <button class="btn btn-outline btn-sm" data-nbr-mem="2">Cần ôn thêm (★★)</button>
              <button class="btn btn-primary btn-sm" data-nbr-mem="5">Đã thuộc lòng (★★★★★)</button>
            </div>
          `
        }
      </div>
    `;
  }

  function bindNotebookReviewEvents(container, list) {
    if (!list.length) return;
    const item = list[nbReviewIdx % list.length];
    const spk = container.querySelector("#nbr-speak");
    if (spk) spk.onclick = () => QCore.speakChinese(item.hanzi);
    const rev = container.querySelector("#nbr-reveal");
    if (rev) {
      rev.onclick = () => {
        nbRevealed = true;
        QCore.speakChinese(item.hanzi);
        renderNotebook(container);
      };
    }
    container.querySelectorAll("[data-nbr-mem]").forEach((b) => {
      b.onclick = () => {
        item.memoryLevel = Number(b.getAttribute("data-nbr-mem"));
        nbRevealed = false;
        nbReviewIdx = (nbReviewIdx + 1) % list.length;
        QCore.saveState(true);
        renderNotebook(container);
      };
    });
  }

  /* ==================== PHẦN 9: ANALYTICS & AI PROGRESS DIAGNOSIS ==================== */
  let chartRange = "day"; // "day" | "week" | "month"
  let cachedAiAdvice = null;

  function buildTimeSeries(dailyLogs, mode) {
    const today = new Date();
    const points = [];
    if (mode === "day") {
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        const log = dailyLogs[key] || {};
        points.push({ label: `${d.getDate()}/${d.getMonth() + 1}`, minutes: log.minutes || 0, words: (log.newWords || 0) + (log.reviewWords || 0) });
      }
    } else if (mode === "week") {
      for (let w = 3; w >= 0; w--) {
        let mins = 0, words = 0;
        for (let k = 0; k < 7; k++) {
          const d = new Date(today);
          d.setDate(today.getDate() - (w * 7 + k));
          const key = d.toISOString().slice(0, 10);
          const log = dailyLogs[key] || {};
          mins += log.minutes || 0;
          words += (log.newWords || 0) + (log.reviewWords || 0);
        }
        points.push({ label: w === 0 ? "Tuần này" : `${w} tuần trước`, minutes: mins, words });
      }
    } else {
      for (let m = 5; m >= 0; m--) {
        const d = new Date(today.getFullYear(), today.getMonth() - m, 1);
        const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        let mins = 0, words = 0;
        Object.entries(dailyLogs).forEach(([k, v]) => {
          if (k.startsWith(ym)) {
            mins += v.minutes || 0;
            words += (v.newWords || 0) + (v.reviewWords || 0);
          }
        });
        points.push({ label: `T${d.getMonth() + 1}`, minutes: mins, words });
      }
    }
    return points;
  }

  function renderAnalytics(container) {
    const st = QCore.getState();
    const srsEntries = Object.values(st.srs);
    const vocabLearned = srsEntries.length;
    const vocabRemembered = srsEntries.filter((x) => x.lastQuality >= 3).length;
    const retentionRate = vocabLearned ? Math.round((vocabRemembered / vocabLearned) * 100) : 0;

    const hanziEntries = Object.values(st.hanziProgress);
    const hanziLearned = hanziEntries.length;
    const hanziRight = hanziEntries.filter((x) => x.memorized).length;

    const todayLog = st.dailyLogs[QCore.todayStr()] || { minutes: 0 };
    const goalRate = Math.min(100, Math.round(((todayLog.minutes || 0) / Math.max(1, st.profile.dailyGoalMinutes)) * 100));

    const series = buildTimeSeries(st.dailyLogs, chartRange);
    const maxMin = Math.max(30, ...series.map((s) => s.minutes));

    const sc = st.skillScores;

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2>📊 Thống Kê & AI Phân Tích Tiến Độ Học Tập</h2>
          <p>Theo dõi đầy đủ 12 chỉ số chuyên sâu, biểu đồ theo Ngày / Tuần / Tháng và nhận lộ trình điều chỉnh từ AI Giáo viên.</p>
        </div>
        <button class="btn btn-primary btn-sm" id="ana-refresh-ai">🤖 Phân tích tiến độ bằng AI ngay</button>
      </div>

      <!-- 12 Required Metrics -->
      <div class="grid-4" style="margin-bottom:20px;">
        <div class="kpi-card"><span class="kpi-label">1. Số từ đã học</span><span class="kpi-value">${vocabLearned}</span></div>
        <div class="kpi-card"><span class="kpi-label">2. Số chữ Hán đã học</span><span class="kpi-value">${hanziLearned}</span></div>
        <div class="kpi-card"><span class="kpi-label">3. Số chữ viết đúng</span><span class="kpi-value">${hanziRight}</span></div>
        <div class="kpi-card"><span class="kpi-label">4. Tỷ lệ nhớ từ vựng</span><span class="kpi-value">${retentionRate}%</span></div>
        <div class="kpi-card"><span class="kpi-label">5. Điểm Nghe</span><span class="kpi-value">${sc.listening || 0}/100</span></div>
        <div class="kpi-card"><span class="kpi-label">6. Điểm Nói</span><span class="kpi-value">${sc.speaking || 0}/100</span></div>
        <div class="kpi-card"><span class="kpi-label">7. Điểm Đọc</span><span class="kpi-value">${sc.reading || 0}/100</span></div>
        <div class="kpi-card"><span class="kpi-label">8. Điểm Viết</span><span class="kpi-value">${sc.writing || 0}/100</span></div>
        <div class="kpi-card"><span class="kpi-label">9. Điểm Ngữ pháp</span><span class="kpi-value">${sc.grammar || 0}/100</span></div>
        <div class="kpi-card"><span class="kpi-label">10. Thời gian học hôm nay</span><span class="kpi-value">${todayLog.minutes || 0} phút</span></div>
        <div class="kpi-card"><span class="kpi-label">11. Hoàn thành mục tiêu giờ</span><span class="kpi-value">${goalRate}%</span></div>
        <div class="kpi-card"><span class="kpi-label">12. Cấp HSK hiện tại</span><span class="kpi-value">HSK ${st.profile.hskLevel}</span></div>
      </div>

      <div class="grid-2" style="margin-bottom:20px;">
        <!-- SVG Bar Chart by Day / Week / Month -->
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
            <h3 style="margin:0;font-size:17px;">📈 Biểu đồ thời gian học & từ vựng</h3>
            <div class="tabs-bar">
              <button class="tab-pill ${chartRange === "day" ? "active" : ""}" data-crange="day">Theo Ngày</button>
              <button class="tab-pill ${chartRange === "week" ? "active" : ""}" data-crange="week">Theo Tuần</button>
              <button class="tab-pill ${chartRange === "month" ? "active" : ""}" data-crange="month">Theo Tháng</button>
            </div>
          </div>

          <svg viewBox="0 0 460 210" style="width:100%;height:210px;background:var(--bg-subtle);border-radius:14px;padding:10px;">
            ${series
              .map((pt, i) => {
                const slotW = 420 / series.length;
                const barW = Math.min(36, slotW * 0.55);
                const x = 24 + i * slotW + (slotW - barW) / 2;
                const barH = Math.max(4, Math.round((pt.minutes / maxMin) * 130));
                const y = 165 - barH;
                return `
                  <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="6" fill="var(--primary)"/>
                  <text x="${x + barW / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="var(--text-main)" font-weight="700">${pt.minutes}p</text>
                  <text x="${x + barW / 2}" y="186" text-anchor="middle" font-size="11" fill="var(--text-muted)">${pt.label}</text>
                `;
              })
              .join("")}
          </svg>
        </div>

        <!-- AI Progress Diagnosis Card -->
        <div class="card" id="ana-ai-card">
          <h3 style="margin:0 0 10px;font-size:17px;">👩‍🏫 AI Giáo viên nhận xét & đề xuất lộ trình</h3>
          <div id="ana-ai-body">
            ${cachedAiAdvice ? renderAiAdviceHTML(cachedAiAdvice) : `<div style="color:var(--text-muted);font-size:13.5px;">Đang tổng hợp dữ liệu học tập thực tế của bạn...</div>`}
          </div>
        </div>
      </div>

      <!-- Test History by Level -->
      <div class="card">
        <h3 style="margin:0 0 12px;font-size:17px;">🏆 Lịch sử kết quả kiểm tra theo từng cấp độ</h3>
        ${
          !st.testHistory.length
            ? `<p style="margin:0;color:var(--text-muted);">Bạn chưa có bài kiểm tra nào. Hãy vào mục <strong>Đánh giá trình độ</strong> để làm bài kiểm tra đầu tiên nhé!</p>`
            : `
            <table class="tri-table">
              <thead><tr><th>Ngày</th><th>Bài kiểm tra</th><th>Điểm số</th><th>Kết quả cấp độ</th></tr></thead>
              <tbody>
                ${st.testHistory
                  .map(
                    (h) => `<tr><td>${QCore.escapeHtml(h.date)}</td><td>${QCore.escapeHtml(h.type)}</td><td><strong>${h.score}/100</strong></td><td><span class="badge badge-jade">${QCore.escapeHtml(h.level)}</span></td></tr>`
                  )
                  .join("")}
              </tbody>
            </table>
          `
        }
      </div>
    `;

    container.querySelectorAll("[data-crange]").forEach((b) => {
      b.onclick = () => {
        chartRange = b.getAttribute("data-crange");
        renderAnalytics(container);
      };
    });

    const loadAdvice = async () => {
      const bodyEl = container.querySelector("#ana-ai-body");
      if (bodyEl) bodyEl.innerHTML = `<div style="font-size:13.5px;">⏳ AI đang phân tích kết quả thực tế...</div>`;
      try {
        cachedAiAdvice = await QCore.apiFetch("/api/ai/analytics", {
          method: "POST",
          body: {
            stats: {
              vocabLearned,
              hanziMemorized: hanziRight,
              retentionRate,
              hskLevel: st.profile.hskLevel,
              skillScores: sc
            }
          }
        });
        if (bodyEl) bodyEl.innerHTML = renderAiAdviceHTML(cachedAiAdvice);
      } catch (e) {
        if (bodyEl) bodyEl.textContent = e.message;
      }
    };

    container.querySelector("#ana-refresh-ai").onclick = loadAdvice;
    if (!cachedAiAdvice) loadAdvice();
  }

  function renderAiAdviceHTML(adv) {
    return `
      <div class="card-subtle" style="border-left:4px solid var(--primary);margin-bottom:12px;font-size:14px;">
        “${QCore.escapeHtml(adv.summary)}”
      </div>
      <div style="font-size:13px;margin-bottom:8px;">
        <strong style="color:var(--primary);">✅ Điểm mạnh:</strong>
        <ul style="margin:4px 0 0;padding-left:18px;">${(adv.strengths || []).map((s) => `<li>${QCore.escapeHtml(s)}</li>`).join("")}</ul>
      </div>
      <div style="font-size:13px;margin-bottom:8px;">
        <strong style="color:var(--accent-amber);">⚠️ Cần khắc phục:</strong>
        <ul style="margin:4px 0 0;padding-left:18px;">${(adv.weaknesses || []).map((w) => `<li>${QCore.escapeHtml(w)}</li>`).join("")}</ul>
      </div>
      <div style="font-size:13px;">
        <strong style="color:var(--accent-blue);">🎯 Đề xuất ưu tiên tuần tới:</strong>
        <ul style="margin:4px 0 0;padding-left:18px;">${(adv.recommendations || []).map((r) => `<li>${QCore.escapeHtml(r)}</li>`).join("")}</ul>
      </div>
    `;
  }

  /* ==================== PHẦN 10 & 11: SETTINGS & MULTI-USER ACCOUNT ==================== */
  function renderSettings(container) {
    const st = QCore.getState();
    const p = st.profile;
    const user = QCore.getUser() || { username: "guest", displayName: p.name };
    const health = QCore.getServerHealth();

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2>⚙️ Cài Đặt Hệ Thống & Quản Lý Tài Khoản</h2>
          <p>Mỗi người học có một tài khoản và mật khẩu riêng biệt để khi chia sẻ website không bị học trùng tiến độ lên nhau.</p>
        </div>
        <button class="btn btn-danger btn-sm" id="set-logout-btn">🚪 Đăng xuất / Đổi sang tài khoản khác</button>
      </div>

      <div class="grid-2">
        <!-- Multi-User Account & Password Security -->
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:17px;">👤 Tài khoản cá nhân & Mật khẩu</h3>
          <div class="card-subtle" style="margin-bottom:14px;">
            <div>Tên đăng nhập (ID riêng): <strong>@${QCore.escapeHtml(user.username)}</strong></div>
            <div>Chế độ lưu trữ: <strong>${health.ok ? "SQLite Database trên Server + Sao lưu trình duyệt" : "Lưu trữ độc lập theo tài khoản trên trình duyệt"}</strong></div>
            <div>Trạng thái AI Backend: <strong>${health.aiConfigured ? `Đã kết nối ${health.aiProvider.toUpperCase()} (${health.aiModel})` : "Động cơ Sư phạm Tiếng Trung tích hợp sẵn (Cấu hình thêm GEMINI_API_KEY trong .env nếu muốn mở rộng)"}</strong></div>
          </div>

          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">Tên hiển thị của người học</label>
          <input class="input-field" id="set-disp-name" value="${QCore.escapeHtml(p.name)}" style="margin-bottom:12px;">

          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">Đổi mật khẩu (bỏ trống nếu không đổi)</label>
          <input type="password" class="input-field" id="set-curr-pw" placeholder="Mật khẩu hiện tại..." style="margin-bottom:8px;">
          <input type="password" class="input-field" id="set-new-pw" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)..." style="margin-bottom:12px;">

          <button class="btn btn-primary btn-sm" id="set-save-account">Lưu thông tin tài khoản</button>
        </div>

        <!-- Learning Preferences & Backup/Restore -->
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:17px;">🎨 Tùy chọn học tập & Sao lưu dữ liệu</h3>

          <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:18px;">
            <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
              <span>🌗 Giao diện Tối (Dark Mode)</span>
              <input type="checkbox" id="set-dark-chk" ${p.theme === "dark" ? "checked" : ""}>
            </label>

            <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
              <span>⌨️ Tự động gợi ý chữ Hán Giản thể khi gõ Pinyin</span>
              <input type="checkbox" id="set-ime-chk" ${p.enablePinyinIme !== false ? "checked" : ""}>
            </label>

            <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
              <span>🇻🇳 Hiển thị phiên âm hỗ trợ người Việt mới bắt đầu</span>
              <input type="checkbox" id="set-vihint-chk" ${p.showVietnameseHint !== false ? "checked" : ""}>
            </label>

            <label style="display:flex;justify-content:space-between;align-items:center;">
              <span>🔊 Tốc độ phát âm tiếng Trung mặc định</span>
              <select class="select-field" id="set-speed-sel" style="width:150px;padding:6px 10px;">
                <option value="0.75" ${p.audioSpeed === 0.75 ? "selected" : ""}>Chậm (0.75x)</option>
                <option value="1" ${!p.audioSpeed || p.audioSpeed === 1 ? "selected" : ""}>Chuẩn (1.0x)</option>
                <option value="1.15" ${p.audioSpeed === 1.15 ? "selected" : ""}>Khá nhanh (1.15x)</option>
              </select>
            </label>
          </div>

          <hr style="border:none;border-top:1px solid var(--border-color);margin:14px 0;">

          <h4 style="margin:0 0 8px;font-size:15px;">💾 Sao lưu & Phục hồi tiến độ an toàn</h4>
          <p style="font-size:12.5px;color:var(--text-secondary);margin:0 0 10px;">
            Đảm bảo không bao giờ mất tiến độ khi đổi máy tính hoặc cập nhật website.
          </p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-soft btn-sm" id="set-export-backup">⬇️ Tải file Sao lưu toàn bộ (.json)</button>
            <label class="btn btn-outline btn-sm" style="cursor:pointer;">
              ⬆️ Khôi phục từ file Sao lưu
              <input type="file" id="set-import-file" accept=".json" style="display:none;">
            </label>
          </div>
        </div>
      </div>

      <!-- Hạng mục 2 & 3: Multi-Device Sessions, Recovery Key & Cloud Server Config -->
      <div class="grid-2" style="margin-top:16px;">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
            <h3 style="margin:0;font-size:17px;">📱 Thiết bị & Phiên đăng nhập Đa thiết bị</h3>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn btn-outline btn-sm" id="set-revoke-others">Đăng xuất thiết bị khác</button>
              <button class="btn btn-danger btn-sm" id="set-revoke-all">Đăng xuất tất cả</button>
            </div>
          </div>
          <p style="font-size:12.5px;color:var(--text-secondary);margin:0 0 12px;">
            Một tài khoản đăng nhập đồng thời trên Điện thoại, Laptop, PC, iPad mà không tự đăng xuất lẫn nhau.
          </p>
          <div id="set-sessions-list" style="display:flex;flex-direction:column;gap:8px;">
            <div class="card-subtle" style="font-size:13px;color:var(--text-muted);">${health.ok ? "⏳ Đang tải danh sách thiết bị đang đăng nhập..." : "Chế độ tĩnh trình duyệt — kết nối Backend 24/7 để quản lý phiên đa thiết bị."}</div>
          </div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 10px;font-size:17px;">🔑 Khôi phục mật khẩu & Máy chủ Cloud 24/7</h3>
          <div class="card-subtle" style="margin-bottom:12px;">
            <strong style="font-size:13.5px;">Mã khôi phục tài khoản (An toàn PBKDF2):</strong>
            <p style="font-size:12.5px;color:var(--text-secondary);margin:4px 0 8px;">Dùng để đặt lại mật khẩu nếu bạn quên, không lưu mật khẩu dạng văn bản thuần.</p>
            <button class="btn btn-soft btn-sm" id="set-regen-rec" ${!health.ok ? "disabled" : ""}>🔑 Tạo Mã khôi phục mới</button>
            <div id="set-rec-out" style="margin-top:8px;font-size:13px;"></div>
          </div>

          <div class="card-subtle">
            <strong style="font-size:13.5px;">🌐 Kết nối Backend Server Online 24/7 (Render / Railway / VPS):</strong>
            <p style="font-size:12.5px;color:var(--text-secondary);margin:4px 0 8px;">Nếu bạn mở giao diện từ GitHub Pages / Vercel, hãy dán URL Backend 24/7 của bạn để đồng bộ đa thiết bị mọi lúc:</p>
            <div style="display:flex;gap:8px;">
              <input class="input-field" id="set-api-base" value="${QCore.escapeHtml(QCore.getApiBase())}" placeholder="Để trống nếu chạy cùng server, hoặc https://qchinese-api.onrender.com" />
              <button class="btn btn-primary btn-sm" id="set-save-api-base">Lưu</button>
            </div>
          </div>
        </div>
      </div>
    `;

    container.querySelector("#set-logout-btn").onclick = async () => {
      await QCore.logoutAccount();
      window.QApp.showAuthGate();
    };

    const saveApiBtn = container.querySelector("#set-save-api-base");
    if (saveApiBtn) {
      saveApiBtn.onclick = () => {
        QCore.setApiBase(container.querySelector("#set-api-base").value);
        QCore.showToast("Đã lưu địa chỉ Backend Cloud! Đang tải lại kết nối...");
        setTimeout(() => window.location.reload(), 600);
      };
    }

    const canManageSessions = health.ok || QCore.isCloudAuthMode();
    if (canManageSessions) {
      const loadSessions = async () => {
        const box = container.querySelector("#set-sessions-list");
        if (!box) return;
        try {
          const list = await QCore.listDeviceSessions();
          const cloudNote = QCore.isCloudAuthMode()
            ? `<div class="card-subtle" style="font-size:12.5px;border-left:3px solid var(--primary);margin-bottom:6px;">☁️ <strong>Supabase Cloud 24/7</strong> · ${window.QCloud && QCloud.isRealtimeConnected() ? "Đang kết nối Realtime WebSocket" : "Đang đồng bộ Cloud"} (hệ sinh thái QChinese · QEnglish · TKB)</div>`
            : "";
          box.innerHTML = cloudNote + (list.length
            ? list.map((s) => `
                <div class="card-subtle" style="padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;">
                  <div>
                    <strong>${QCore.escapeHtml(s.deviceName)}</strong>
                    ${s.isCurrent ? `<span class="badge badge-jade" style="margin-left:6px;">Thiết bị hiện tại</span>` : ""}
                    <div style="font-size:11.5px;color:var(--text-muted);">${QCore.escapeHtml(s.ipAddress)} · Hoạt động: ${new Date(s.lastActiveAt).toLocaleString("vi-VN")}</div>
                  </div>
                  <button class="btn btn-outline btn-sm" data-rev-sid="${QCore.escapeHtml(s.sessionId)}">Đăng xuất</button>
                </div>
              `).join("")
            : `<div class="card-subtle" style="font-size:13px;">Không có phiên hoạt động nào.</div>`);
          box.querySelectorAll("[data-rev-sid]").forEach((b) => {
            b.onclick = async () => {
              const res = await QCore.revokeDeviceSession(b.getAttribute("data-rev-sid"));
              if (res.revokedCurrent) {
                await QCore.logoutAccount();
                window.QApp.showAuthGate();
              } else {
                QCore.showToast("Đã đăng xuất thiết bị đã chọn!");
                loadSessions();
              }
            };
          });
        } catch (e) {
          box.innerHTML = `<div class="card-subtle" style="color:var(--accent-red);">${QCore.escapeHtml(e.message)}</div>`;
        }
      };
      loadSessions();

      container.querySelector("#set-revoke-others").onclick = async () => {
        const res = await QCore.revokeAllDeviceSessions(true);
        QCore.showToast(`Đã đăng xuất ${res.revokedCount || 0} thiết bị khác!`);
        loadSessions();
      };
      container.querySelector("#set-revoke-all").onclick = async () => {
        await QCore.revokeAllDeviceSessions(false);
        await QCore.logoutAccount();
        window.QApp.showAuthGate();
      };
      const regenBtn = container.querySelector("#set-regen-rec");
      if (regenBtn && !QCore.isCloudAuthMode()) {
        regenBtn.onclick = async () => {
          const res = await QCore.apiFetch("/api/auth/recovery-key/regenerate", { method: "POST", body: {} });
          container.querySelector("#set-rec-out").innerHTML = `<div style="padding:8px 10px;background:var(--bg-accent-soft);border-radius:8px;"><strong>Mã khôi phục mới (chỉ hiện 1 lần, hãy lưu lại):</strong><br/><code style="font-size:15px;font-weight:800;">${QCore.escapeHtml(res.recoveryKey)}</code></div>`;
        };
      } else if (regenBtn && QCore.isCloudAuthMode()) {
        regenBtn.textContent = "📧 Khôi phục qua Email Cloud";
        regenBtn.disabled = false;
        regenBtn.onclick = async () => {
          try {
            const msg = await QCloud.sendPasswordReset(user.email || user.username);
            container.querySelector("#set-rec-out").innerHTML = `<div style="padding:8px 10px;background:var(--bg-accent-soft);border-radius:8px;">✅ ${QCore.escapeHtml(msg)}</div>`;
          } catch (err) {
            QCore.showToast(err.message);
          }
        };
      }
    }

    container.querySelector("#set-save-account").onclick = async () => {
      const newDisp = container.querySelector("#set-disp-name").value.trim() || p.name;
      const currPw = container.querySelector("#set-curr-pw").value;
      const newPw = container.querySelector("#set-new-pw").value;

      p.name = newDisp;
      QCore.saveState(true);

      if (health.ok || QCore.isCloudAuthMode()) {
        try {
          await QCore.updateUserProfile(newDisp, currPw, newPw);
          QCore.showToast("Đã lưu thông tin tài khoản thành công!");
          window.QApp.refreshTopbar();
          renderSettings(container);
        } catch (e) {
          QCore.showToast(e.message);
        }
      } else {
        QCore.showToast("Đã cập nhật tên hiển thị!");
        window.QApp.refreshTopbar();
      }
    };

    container.querySelector("#set-dark-chk").onchange = (e) => {
      QCore.applyTheme(e.target.checked ? "dark" : "light");
      QCore.saveState(false);
    };
    container.querySelector("#set-ime-chk").onchange = (e) => {
      p.enablePinyinIme = e.target.checked;
      QCore.saveState(false);
      QCore.showToast(p.enablePinyinIme ? "Đã bật gợi ý chữ Hán khi gõ Pinyin!" : "Đã tắt thanh gợi ý Pinyin.");
    };
    container.querySelector("#set-vihint-chk").onchange = (e) => {
      p.showVietnameseHint = e.target.checked;
      QCore.saveState(false);
    };
    container.querySelector("#set-speed-sel").onchange = (e) => {
      p.audioSpeed = Number(e.target.value) || 1.0;
      QCore.saveState(false);
    };

    container.querySelector("#set-export-backup").onclick = () => {
      const backupObj = {
        app: "QChinese Personal Tutor",
        exportedAt: new Date().toISOString(),
        account: user,
        state: st
      };
      const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `qchinese_backup_${user.username}_${QCore.todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    container.querySelector("#set-import-file").onchange = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const restoredState = parsed.state || parsed;
          if (!restoredState.profile) throw new Error("File sao lưu không hợp lệ.");
          if (health.ok) {
            const r = await QCore.apiFetch("/api/user/restore", { method: "POST", body: { state: restoredState } });
            QCore.setState(r.state);
          } else {
            QCore.setState(restoredState);
          }
          QCore.showToast("🎉 Đã phục hồi toàn bộ dữ liệu học tập thành công!");
          renderSettings(container);
        } catch (err) {
          QCore.showToast("Lỗi đọc file sao lưu: " + err.message);
        }
      };
      reader.readAsText(file);
    };
  }

  return {
    renderNotebook,
    renderAnalytics,
    renderSettings
  };
})();

</script>

  <!-- Application Bootstrapper -->
  <script data-bundle="js/app.js">
/* -*- coding: utf-8 -*-
 * QChinese – Main Application Router, 13-Section Sidebar, Top Quick Pinyin/Hanzi Search & Multi-User Auth Gate
 */

window.QApp = (function () {
  let currentRoute = "dashboard";
  let currentParams = {};

  const NAV_ITEMS = [
    { id: "dashboard", labelEn: "Dashboard", labelVi: "Dashboard", icon: "🏠" },
    { id: "vocab", labelEn: "HSK Vocabulary", labelVi: "Kho từ vựng HSK", icon: "📚" },
    { id: "pinyin", labelEn: "Pinyin Lab", labelVi: "Phòng luyện Pinyin", icon: "🎵" },
    { id: "ai-tutor", labelEn: "QChinese AI Tutor", labelVi: "QChinese AI Tutor", icon: "🤖" },
    { id: "ai-pdf", labelEn: "AI PDF · HSK 3.0", labelVi: "AI PDF · HSK 3.0", icon: "📄" },
    { id: "materials", labelEn: "My Materials", labelVi: "Kho tài liệu cá nhân", icon: "📁" },
    { id: "hanzi", labelEn: "Hanzi Studio", labelVi: "Học chữ Hán", icon: "✍️" },
    { id: "assessment", labelEn: "Placement Test", labelVi: "Đánh giá trình độ", icon: "🧭" },
    { id: "reading", labelEn: "Reading", labelVi: "Luyện đọc", icon: "📰" },
    { id: "listening", labelEn: "Listening", labelVi: "Luyện nghe", icon: "🎧" },
    { id: "grammar", labelEn: "Grammar", labelVi: "Ngữ pháp", icon: "🧩" },
    { id: "writing", labelEn: "Writing", labelVi: "Luyện viết", icon: "🖋️" },
    { id: "speaking", labelEn: "Speaking", labelVi: "Luyện nói", icon: "🎙️" },
    { id: "notebook", labelEn: "Notebook", labelVi: "Sổ tay", icon: "📒" },
    { id: "analytics", labelEn: "Analytics", labelVi: "Thống kê tiến độ", icon: "📊" },
    { id: "settings", labelEn: "Settings", labelVi: "Cài đặt", icon: "⚙️" }
  ];

  function renderSidebar() {
    const navEl = document.getElementById("sidebar-nav");
    if (!navEl) return;
    const isVi = QCore.getUiLang() === "vi";
    navEl.innerHTML = NAV_ITEMS.map(
      (item) => `
      <button class="nav-btn ${currentRoute === item.id ? "active" : ""}" data-route="${item.id}">
        <span class="nav-icon">${item.icon}</span>
        <span>${isVi ? item.labelVi : item.labelEn}</span>
      </button>
    `
    ).join("");

    navEl.querySelectorAll("[data-route]").forEach((btn) => {
      btn.onclick = () => {
        navigate(btn.getAttribute("data-route"));
        document.getElementById("sidebar").classList.remove("open");
      };
    });
  }

  function refreshTopbar() {
    const st = QCore.getState();
    const user = QCore.getUser();
    const isVi = QCore.getUiLang() === "vi";
    const langBtn = document.getElementById("top-lang-btn");
    const searchInp = document.getElementById("quick-search-input");
    if (langBtn) {
      langBtn.textContent = isVi ? "🇻🇳 VI" : "🌐 EN";
      langBtn.title = isVi ? "Chuyển sang tiếng Anh (ZH–EN)" : "Switch to Vietnamese (ZH–VI)";
    }
    if (searchInp) {
      searchInp.placeholder = isVi
        ? "Tra nhanh Pinyin (vd: nihao, xihuan), chữ Hán hoặc tiếng Việt..."
        : "Quick search Pinyin (e.g. nihao, xihuan), Hanzi or English...";
    }
    if (!st) return;

    const p = st.profile;
    const streakEl = document.getElementById("top-streak");
    const hanziEl = document.getElementById("top-hanzi");
    const hskEl = document.getElementById("top-hsk");
    const themeBtn = document.getElementById("top-theme-btn");
    const sbName = document.getElementById("sb-user-name");
    const sbSub = document.getElementById("sb-user-sub");
    const sbAvatar = document.getElementById("sb-user-avatar");

    const memHanzi = Object.values(st.hanziProgress).filter((x) => x.memorized).length;

    if (streakEl) streakEl.textContent = isVi ? `🔥 ${p.streakDays || 1} ngày` : `🔥 ${p.streakDays || 1}d`;
    if (hanziEl) hanziEl.textContent = isVi ? `✿ ${memHanzi} chữ` : `✿ ${memHanzi} chars`;
    if (hskEl) hskEl.textContent = `✦ HSK ${p.hskLevel}`;
    if (themeBtn) {
      themeBtn.textContent = p.theme === "dark"
        ? (isVi ? "☀️ Sáng" : "☀️ Light")
        : (isVi ? "🌙 Tối" : "🌙 Dark");
    }

    if (sbName) sbName.textContent = p.name || (user && user.displayName) || (isVi ? "Học viên" : "Learner");
    if (sbSub) sbSub.textContent = `@${(user && user.username) || "user"} · HSK ${p.hskLevel}`;
    if (sbAvatar) sbAvatar.textContent = (p.name || "H").trim().charAt(0).toUpperCase();
  }

  function navigate(route, params = {}) {
    currentRoute = route;
    currentParams = params || {};
    if (window.QAiTournament && typeof window.QAiTournament.stopPolling === "function") {
      window.QAiTournament.stopPolling();
    }
    if (window.QAiPdfStudio && typeof window.QAiPdfStudio.stopPoll === "function") {
      window.QAiPdfStudio.stopPoll();
    }
    QPinyinIME.hideBar();
    renderSidebar();
    refreshTopbar();

    const main = document.getElementById("page-content");
    if (!main) return;
    // Trigger gentle entrance animation
    main.style.animation = "none";
    void main.offsetWidth;
    main.style.animation = "";

    switch (route) {
      case "dashboard":
        QDashboardAssessment.renderDashboard(main);
        break;
      case "assessment":
        QDashboardAssessment.renderAssessment(main);
        break;
      case "vocab":
        QVocabTutor.renderVocab(main, params);
        break;
      case "hanzi":
        QHanziStudio.renderHanzi(main, params);
        break;
      case "pinyin":
        QPinyinListening.renderPinyin(main, params);
        break;
      case "ai-tutor":
        QAiTutor.renderAiTutor(main, params);
        break;
      case "ai-pdf":
        QAiPdfStudio.renderPdfStudio(main);
        break;
      case "lessons":
        QLessonStudio.renderSkillFolder(main, params.skill || "reading", params, (el) => QGrammarReadingWriting.renderReading(el, params));
        break;
      case "materials":
        QMaterialsHub.renderMaterials(main, params);
        break;
      case "grammar":
        QLessonStudio.renderSkillFolder(main, "grammar", params, (el) => QGrammarReadingWriting.renderGrammar(el));
        break;
      case "listening":
        QLessonStudio.renderSkillFolder(main, "listening", params, (el) => QPinyinListening.renderListening(el, params));
        break;
      case "speaking":
        QLessonStudio.renderSkillFolder(main, "speaking", params, (el) => QGrammarReadingWriting.renderSpeaking(el, false, params));
        break;
      case "reading":
        QLessonStudio.renderSkillFolder(main, "reading", params, (el) => QGrammarReadingWriting.renderReading(el, params));
        break;
      case "writing":
        QLessonStudio.renderSkillFolder(main, "writing", params, (el) => QGrammarReadingWriting.renderWriting(el, params));
        break;
      case "notebook":
        QNotebookAnalyticsSettings.renderNotebook(main);
        break;
      case "analytics":
        QNotebookAnalyticsSettings.renderAnalytics(main);
        break;
      case "settings":
        QNotebookAnalyticsSettings.renderSettings(main);
        break;
      default:
        QDashboardAssessment.renderDashboard(main);
    }

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function initQuickSearch() {
    const inp = document.getElementById("quick-search-input");
    const drop = document.getElementById("quick-search-dropdown");
    if (!inp || !drop) return;

    inp.addEventListener("input", () => {
      const q = inp.value.trim();
      if (!q) {
        drop.classList.remove("open");
        return;
      }
      const ql = q.toLowerCase();
      // Combine Pinyin IME suggestions + Vietnamese/English/Hanzi dictionary matches
      const pyHits = QPinyinIME.searchByPinyin(ql, 5);
      const storeHits = (window.QVocabStore ? QVocabStore.searchLoaded(q, 8) : []).map((v) => ({
        hanzi: v.hanzi,
        pinyin: v.pinyin,
        vi: QVocabStore.getDisplayMeaning(v)
      }));
      const vocabHits = (window.QCHINESE_VOCAB || [])
        .filter(
          (v) =>
            v.hanzi.includes(q) ||
            v.meanings.vietnamese.join(" ").toLowerCase().includes(ql) ||
            v.meanings.english.join(" ").toLowerCase().includes(ql) ||
            v.pinyin.toLowerCase().includes(ql)
        )
        .slice(0, 5)
        .map((v) => ({ hanzi: v.hanzi, pinyin: v.pinyin, vi: v.meanings.vietnamese[0] }));

      const seen = new Set();
      const merged = [];
      [...storeHits, ...pyHits, ...vocabHits].forEach((item) => {
        if (!seen.has(item.hanzi)) {
          seen.add(item.hanzi);
          merged.push(item);
        }
      });

      if (!merged.length) {
        drop.innerHTML = `<div style="padding:12px 14px;font-size:13px;color:var(--text-muted);">Không tìm thấy từ phù hợp. Nếu bạn nhập 1 chữ Hán, bấm Enter để xem thứ tự nét!</div>`;
        drop.classList.add("open");
        return;
      }

      drop.innerHTML = merged
        .slice(0, 8)
        .map(
          (m) => `
        <div class="qs-item" data-qs-hz="${QCore.escapeHtml(m.hanzi)}">
          <div>
            <strong class="hanzi-text" style="font-size:20px;">${QCore.escapeHtml(m.hanzi)}</strong>
            <span class="pinyin-text" style="color:var(--primary);font-weight:700;margin-left:8px;">${QCore.escapeHtml(m.pinyin)}</span>
            <div style="font-size:12.5px;color:var(--text-secondary);">🇻🇳 ${QCore.escapeHtml(m.vi)}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-soft btn-sm" data-qs-audio="${QCore.escapeHtml(m.hanzi)}">🔊</button>
            <button class="btn btn-outline btn-sm" data-qs-write="${QCore.escapeHtml(m.hanzi.charAt(0))}">✍️ Nét chữ</button>
          </div>
        </div>
      `
        )
        .join("");
      drop.classList.add("open");

      drop.querySelectorAll("[data-qs-audio]").forEach((b) => {
        b.onclick = (ev) => {
          ev.stopPropagation();
          QCore.speakChinese(b.getAttribute("data-qs-audio"));
        };
      });
      drop.querySelectorAll("[data-qs-write],[data-qs-hz]").forEach((el) => {
        el.onclick = () => {
          const hz = el.getAttribute("data-qs-write") || el.getAttribute("data-qs-hz");
          drop.classList.remove("open");
          inp.value = "";
          navigate("hanzi", { char: hz.charAt(0) });
        };
      });
    });

    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const m = inp.value.match(/[\u3400-\u9fff]/);
        if (m) {
          drop.classList.remove("open");
          inp.value = "";
          navigate("hanzi", { char: m[0] });
        }
      }
    });

    document.addEventListener("click", (e) => {
      if (!drop.contains(e.target) && e.target !== inp) {
        drop.classList.remove("open");
      }
    });
  }

  /* Multi-User Authentication Modal Gate */
  function showAuthGate(initialMode = "login") {
    const gate = document.getElementById("auth-modal");
    if (!gate) return;
    const cloudMode = QCore.isCloudAuthMode();
    let authTab = initialMode === "recovery-reset" ? "recovery-reset" : "login"; // "login" | "register" | "recover" | "recovery-reset"

    function drawAuth() {
      gate.classList.add("open");
      const idLabel = cloudMode ? "Email" : "Tên tài khoản";
      const idPlaceholder = cloudMode ? "Nhập địa chỉ email..." : "Nhập tên tài khoản...";
      const idType = cloudMode ? "email" : "text";
      gate.innerHTML = `
        <div class="modal-card" style="max-width:440px;">
          <div style="text-align:center;margin-bottom:16px;">
            <div class="brand-seal" style="margin:0 auto 8px;width:50px;height:50px;font-size:26px;">练</div>
            <h2 style="margin:0;font-size:21px;">CHINESE PERSONAL TUTOR</h2>
            <div style="color:var(--primary);font-weight:700;font-size:13.5px;margin-top:2px;">AI 汉语私人教师 · Tiếng Trung Giản Thể</div>
          </div>

          ${
            authTab === "recover" || authTab === "recovery-reset"
              ? `
            <div style="text-align:center;margin-bottom:14px;">
              <div style="font-size:15px;font-weight:700;color:var(--text-primary);">🔑 Khôi phục mật khẩu</div>
              <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px;">
                ${authTab === "recovery-reset"
                  ? "Nhập mật khẩu mới cho tài khoản của bạn"
                  : cloudMode
                    ? "Nhập Email đã đăng ký để nhận liên kết đặt lại mật khẩu"
                    : "Nhập tên tài khoản và mã khôi phục đã lưu để đặt mật khẩu mới"}
              </div>
            </div>
          `
              : `
            <div class="tabs-bar" style="width:100%;margin-bottom:16px;">
              <button class="tab-pill ${authTab === "login" ? "active" : ""}" style="flex:1;" id="auth-tab-login">Đăng nhập</button>
              <button class="tab-pill ${authTab === "register" ? "active" : ""}" style="flex:1;" id="auth-tab-reg">Tạo tài khoản</button>
            </div>
          `
          }

          <div id="auth-err" style="color:var(--accent-red);font-size:13px;margin-bottom:10px;display:none;"></div>
          <div id="auth-ok" style="color:var(--primary);font-size:13px;margin-bottom:10px;display:none;"></div>

          <div style="display:flex;flex-direction:column;gap:10px;">
            ${
              authTab === "recovery-reset"
                ? `
              <label style="font-size:13px;font-weight:600;">Mật khẩu mới (tối thiểu 6 ký tự)
                <input type="password" class="input-field" id="auth-pw" placeholder="Nhập mật khẩu mới...">
              </label>
            `
                : `
              <label style="font-size:13px;font-weight:600;">${idLabel}
                <input type="${idType}" class="input-field" id="auth-user" placeholder="${idPlaceholder}">
              </label>

              ${
                authTab === "register"
                  ? `
                <label style="font-size:13px;font-weight:600;">Tên hiển thị của bạn
                  <input class="input-field" id="auth-disp" placeholder="Nhập tên hiển thị...">
                </label>
              `
                  : ""
              }

              ${
                authTab === "recover"
                  ? cloudMode
                    ? ""
                    : `
                  <label style="font-size:13px;font-weight:600;">Mã khôi phục (QCN-XXXX-XXXX-XXXX)
                    <input class="input-field" id="auth-reckey" placeholder="Nhập mã khôi phục đã lưu...">
                  </label>
                  <label style="font-size:13px;font-weight:600;">Mật khẩu mới (tối thiểu 6 ký tự)
                    <input type="password" class="input-field" id="auth-pw" placeholder="Nhập mật khẩu mới...">
                  </label>
                `
                  : `
                <label style="font-size:13px;font-weight:600;">Mật khẩu (tối thiểu 6 ký tự)
                  <input type="password" class="input-field" id="auth-pw" placeholder="Nhập mật khẩu bảo mật...">
                </label>
              `
              }
            `
            }

            <button class="btn btn-primary" style="margin-top:6px;width:100%;padding:12px;font-weight:700;" id="auth-submit">
              ${
                authTab === "login"
                  ? "Đăng nhập"
                  : authTab === "register"
                    ? "Tạo tài khoản"
                    : authTab === "recover" && cloudMode
                      ? "Gửi liên kết khôi phục"
                      : "Đặt lại mật khẩu"
              }
            </button>

            ${
              authTab === "login"
                ? `
              <div style="text-align:center;margin-top:2px;">
                <button type="button" id="auth-tab-rec" style="background:none;border:none;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px;text-decoration:underline;text-underline-offset:3px;">
                  Khôi phục mật khẩu
                </button>
              </div>
            `
                : authTab === "recover" || authTab === "recovery-reset"
                ? `
              <div style="text-align:center;margin-top:2px;">
                <button type="button" id="auth-back-login" style="background:none;border:none;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px;">
                  ← Quay lại đăng nhập
                </button>
              </div>
            `
                : ""
            }
          </div>
        </div>
      `;

      const tabLoginBtn = gate.querySelector("#auth-tab-login");
      const tabRegBtn = gate.querySelector("#auth-tab-reg");
      const tabRecBtn = gate.querySelector("#auth-tab-rec");
      const backLoginBtn = gate.querySelector("#auth-back-login");
      if (tabLoginBtn) tabLoginBtn.onclick = () => { authTab = "login"; drawAuth(); };
      if (tabRegBtn) tabRegBtn.onclick = () => { authTab = "register"; drawAuth(); };
      if (tabRecBtn) tabRecBtn.onclick = () => { authTab = "recover"; drawAuth(); };
      if (backLoginBtn) backLoginBtn.onclick = () => { authTab = "login"; drawAuth(); };

      const doSubmit = async () => {
        const uEl = gate.querySelector("#auth-user");
        const pwEl = gate.querySelector("#auth-pw");
        const u = uEl ? uEl.value.trim() : "";
        const pw = pwEl ? pwEl.value : "";
        const dispEl = gate.querySelector("#auth-disp");
        const recEl = gate.querySelector("#auth-reckey");
        const disp = dispEl ? dispEl.value.trim() : u;
        const errBox = gate.querySelector("#auth-err");
        const okBox = gate.querySelector("#auth-ok");
        const submitBtn = gate.querySelector("#auth-submit");
        errBox.style.display = "none";
        if (okBox) okBox.style.display = "none";
        if (submitBtn) submitBtn.disabled = true;

        try {
          if (authTab === "recovery-reset" && cloudMode && window.QCloud) {
            const msg = await QCloud.updatePasswordWithRecovery(pw);
            if (okBox) { okBox.textContent = "✅ " + msg; okBox.style.display = "block"; }
            return;
          }
          if (authTab === "recover") {
            if (cloudMode && window.QCloud) {
              const msg = await QCloud.sendPasswordReset(u);
              if (okBox) { okBox.textContent = "✅ " + msg; okBox.style.display = "block"; }
              return;
            }
            const res = await QCore.apiFetch("/api/auth/recover-password", {
              method: "POST",
              body: { username: u, recoveryKey: recEl ? recEl.value.trim() : "", newPassword: pw }
            });
            if (okBox) {
              okBox.textContent = "✅ " + (res.message || "Đặt lại mật khẩu thành công! Hãy quay lại Đăng nhập.");
              okBox.style.display = "block";
            }
            return;
          }
          if (authTab === "login") {
            await QCore.loginAccount(u, pw);
          } else {
            const usr = await QCore.registerAccount(u, disp || u, pw);
            if (usr && usr.needsVerification) {
              if (okBox) { okBox.textContent = "✅ " + usr.message; okBox.style.display = "block"; }
              return;
            }
            if (usr && usr.recoveryKey) {
              QCore.showToast(`🔑 Mã khôi phục của bạn: ${usr.recoveryKey} (hãy lưu lại!)`);
            }
          }
          gate.classList.remove("open");
          QCore.showToast(`Chào mừng ${QCore.getState().profile.name} đến với QChinese!`);
          navigate("dashboard");
        } catch (err) {
          errBox.textContent = "⚠️ " + err.message;
          errBox.style.display = "block";
        } finally {
          if (submitBtn) submitBtn.disabled = false;
        }
      };

      gate.querySelector("#auth-submit").onclick = doSubmit;
      const pwInput = gate.querySelector("#auth-pw") || gate.querySelector("#auth-user");
      if (pwInput) {
        pwInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") doSubmit();
        });
      }
    }

    drawAuth();
  }

  async function init() {
    if (window.QVocabStore) QVocabStore.init();
    QPinyinIME.initGlobalListeners();
    initQuickSearch();

    const mobBtn = document.getElementById("mobile-menu-btn");
    if (mobBtn) {
      mobBtn.onclick = () => {
        document.getElementById("sidebar").classList.toggle("open");
      };
    }

    const themeBtn = document.getElementById("top-theme-btn");
    if (themeBtn) {
      themeBtn.onclick = () => {
        QCore.toggleTheme();
        refreshTopbar();
      };
    }

    const langBtn = document.getElementById("top-lang-btn");
    if (langBtn) {
      langBtn.onclick = () => {
        const nextLang = QCore.toggleUiLang();
        renderSidebar();
        refreshTopbar();
        refreshCurrentView();
        QCore.showToast(nextLang === "en" ? "🌐 Switched to English (ZH–EN bilingual)" : "🇻🇳 Đã chuyển sang Tiếng Việt (ZH–VI)");
      };
    }

    const sbSwitchBtn = document.getElementById("sb-switch-account");
    if (sbSwitchBtn) {
      sbSwitchBtn.onclick = async () => {
        await QCore.logoutAccount();
        showAuthGate();
      };
    }

    const session = await QCore.initSession();
    if (!session.authenticated) {
      renderSidebar();
      showAuthGate(session.recoveryMode ? "recovery-reset" : "login");
    } else {
      navigate("dashboard");
    }
  }

  document.addEventListener("DOMContentLoaded", init);

  function refreshCurrentView() {
    if (currentRoute) {
      navigate(currentRoute, currentParams);
    }
  }

  return {
    navigate,
    refreshCurrentView,
    refreshTopbar,
    showAuthGate
  };
})();

</script>
</body>
</html>
